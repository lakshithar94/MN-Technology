<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | MN Technology</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

.navbar{
    background:#051223;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:bold;
}

.logo-box{
    width:42px;
    height:42px;
    background:#22d3ee;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#051223;
    font-weight:bold;
}

.logout-btn{
    background:#ef4444;
    color:white;
    border:0;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

h1{
    margin-bottom:20px;
}

h2{
    margin-bottom:15px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.stat h3{
    font-size:14px;
    color:#64748b;
    margin-bottom:8px;
}

.stat p{
    font-size:28px;
    font-weight:bold;
}

.card{
    background:white;
    padding:22px;
    border-radius:12px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

input,select,textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:7px;
    margin-top:6px;
    margin-bottom:14px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

label{
    font-weight:bold;
    font-size:14px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 17px;
    cursor:pointer;
    font-size:14px;
}

.primary{
    background:#0ea5e9;
    color:white;
}

.success{
    background:#16a34a;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}

.edit-btn{
    background:#f59e0b;
    color:white;
    margin-right:6px;
}

.course-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:10px 0 15px;
}

.course-check{
    border:1px solid #dbe3ec;
    padding:12px;
    border-radius:8px;
    background:#f8fafc;
}

.course-check input{
    width:auto;
    margin:0 8px 0 0;
}

.student-item{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
}

.student-name{
    font-weight:bold;
    font-size:17px;
    margin-bottom:10px;
}

.access-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:10px 0;
}

.access-item{
    padding:8px;
    background:#f8fafc;
    border-radius:6px;
}

.access-item input{
    width:auto;
    margin:0 7px 0 0;
}

.lesson{
    border:1px solid #e2e8f0;
    padding:18px;
    border-radius:10px;
    margin-bottom:15px;
}

.lesson-title{
    font-size:19px;
    font-weight:bold;
}

.course-label{
    display:inline-block;
    margin:7px 0 12px;
    padding:5px 10px;
    background:#e0f2fe;
    color:#0369a1;
    border-radius:20px;
    font-size:13px;
}

video{
    width:100%;
    max-height:450px;
    background:#000;
    border-radius:8px;
    margin-top:10px;
}

.pdf-box{
    margin-top:12px;
    padding:12px;
    background:#f8fafc;
    border-radius:8px;
}

.pdf-box a{
    color:#0369a1;
    font-weight:bold;
    text-decoration:none;
}

.empty{
    color:#64748b;
    padding:10px 0;
}

.message{
    margin-top:10px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.success-msg{
    background:#dcfce7;
    color:#166534;
}

.error-msg{
    background:#fee2e2;
    color:#991b1b;
}

/* COURSE MANAGEMENT */
.course-management{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
    background:#f8fafc;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.course-management-name{
    font-size:17px;
    font-weight:bold;
}

.course-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.add-course-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

.add-course-box input{
    margin-bottom:10px;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

    .course-grid,
    .access-grid{
        grid-template-columns:1fr;
    }

    .container{
        padding:15px;
    }

    .course-management{
        flex-direction:column;
        align-items:flex-start;
    }

    .course-actions{
        width:100%;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        <div class="logo-box">MN</div>
        MN Technology
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</nav>

<div class="container">

<h1>Admin Dashboard</h1>

<!-- STATS -->

<div class="stats">

    <div class="stat">
        <h3>Total Students</h3>
        <p id="studentCount">0</p>
    </div>

    <div class="stat">
        <h3>Total Courses</h3>
        <p id="courseCount">0</p>
    </div>

    <div class="stat">
        <h3>Total Lessons</h3>
        <p id="lessonCount">0</p>
    </div>

</div>


<!-- CREATE STUDENT -->

<div class="card">

<h2>👨‍🎓 Create Student</h2>

<form id="studentForm">

<label>Username</label>

<input
    type="text"
    id="studentUsername"
    placeholder="Example: MNT100110A"
    required
>

<label>Password</label>

<input
    type="password"
    id="studentPassword"
    placeholder="Student password"
    required
>

<label>Course Access</label>

<div class="course-grid" id="createCourseList"></div>

<button type="submit" class="primary">
    Create Student
</button>

</form>

<div id="studentMessage" class="message"></div>

</div>


<!-- COURSES -->

<div class="card">

<h2>📚 Courses</h2>

<!-- ADD COURSE -->

<div class="add-course-box">

    <label>Add New Course</label>

    <input
        type="text"
        id="newCourseName"
        placeholder="Example: Computer Hardware"
    >

    <button
        type="button"
        class="primary"
        onclick="addCourse()"
    >
        ➕ Add Course
    </button>

    <div id="courseMessage" class="message"></div>

</div>

<!-- COURSE LIST -->

<div id="coursesList">

    <div class="empty">
        Loading courses...
    </div>

</div>

</div>


<!-- STUDENTS -->

<div class="card">

<h2>👨‍🎓 Students & Course Access</h2>

<div id="studentsList">

    <div class="empty">
        Loading students...
    </div>

</div>

</div>


<!-- ADD LESSON -->

<div class="card">

<h2>➕ Add New Lesson</h2>

<form id="lessonForm">

<label>Lesson Title</label>

<input
    type="text"
    id="lessonTitle"
    placeholder="Example: Resistor"
    required
>

<label>Course</label>

<select id="lessonCourse" required>

    <option value="">
        Select Course
    </option>

</select>

<label>Description</label>

<textarea
    id="lessonDescription"
    placeholder="Lesson description"
></textarea>

<label>🎥 Video File</label>

<input
    type="file"
    id="videoFile"
    accept="video/*"
    required
>

<label>📄 PDF File</label>

<input
    type="file"
    id="pdfFile"
    accept="application/pdf"
>

<button type="submit" class="success">
    Upload Lesson
</button>

</form>

<div id="lessonMessage" class="message"></div>

</div>


<!-- LESSONS -->

<div class="card">

<h2>🎬 Lessons</h2>

<div id="lessonsList">

    <div class="empty">
        Loading lessons...
    </div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
    "https://ekanfqwbqwfhjfgctouk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* COURSE LIST */

let ALL_COURSES = [];


/* PAGE START */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const {
            data: { session }
        } =
        await supabaseClient.auth.getSession();

        if(!session){

            window.location.href =
                "login.html";

            return;
        }


        const {
            data: admin
        } =
        await supabaseClient
        .from("admins")
        .select("id,username")
        .eq("id",session.user.id)
        .maybeSingle();


        if(!admin){

            await supabaseClient.auth.signOut();

            window.location.href =
                "login.html";

            return;
        }


        await loadCourseNames();

        buildCourseInputs();

        await loadDashboard();

    }
);


/* LOAD COURSE NAMES FROM SUPABASE */

async function loadCourseNames(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("courses")
    .select("id,name")
    .order("id",{ascending:true});


    if(error){

        console.error(error);

        alert(
            "Courses load failed:\n" +
            error.message
        );

        return;

    }


    ALL_COURSES =
        data.map(course => course.name);

}


/* COURSE INPUTS */

function buildCourseInputs(){

    const createList =
        document.getElementById(
            "createCourseList"
        );

    const select =
        document.getElementById(
            "lessonCourse"
        );


    createList.innerHTML = "";

    select.innerHTML =
        '<option value="">Select Course</option>';


    ALL_COURSES.forEach(course => {

        createList.innerHTML += `

            <label class="course-check">

                <input
                    type="checkbox"
                    class="create-course"
                    value="${escapeHtml(course)}"
                >

                ${escapeHtml(course)}

            </label>

        `;


        select.innerHTML += `

            <option value="${escapeHtml(course)}">
                ${escapeHtml(course)}
            </option>

        `;

    });

}


/* DASHBOARD */

async function loadDashboard(){

    await loadStudents();

    await loadLessons();

    await loadCourses();

}


/* STUDENTS */

async function loadStudents(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("student_accounts")
    .select(
        "id,username,course_access,created_at"
    )
    .order(
        "created_at",
        {ascending:false}
    );


    if(error){

        console.error(error);

        document.getElementById(
            "studentsList"
        ).innerHTML =
            `
            <div class="empty">
                Students load failed.
            </div>
            `;

        return;

    }


    document.getElementById(
        "studentCount"
    ).textContent =
        data.length;


    const box =
        document.getElementById(
            "studentsList"
        );


    if(data.length === 0){

        box.innerHTML =
            `
            <div class="empty">
                No students yet.
            </div>
            `;

        return;

    }


    box.innerHTML = "";


    data.forEach(student => {

        const access =
            student.course_access || [];


        let courseHTML = "";


        ALL_COURSES.forEach(course => {

            const checked =
                access.includes(course)
                ? "checked"
                : "";


            courseHTML += `

                <label class="access-item">

                    <input
                        type="checkbox"
                        class="student-course"
                        data-student="${student.id}"
                        value="${escapeHtml(course)}"
                        ${checked}
                    >

                    ${escapeHtml(course)}

                </label>

            `;

        });


        box.innerHTML += `

            <div class="student-item">

                <div class="student-name">
                    👤 ${escapeHtml(student.username)}
                </div>

                <div class="access-grid">
                    ${courseHTML}
                </div>

                <button
                    class="success"
                    onclick="saveStudentAccess('${student.id}')"
                >
                    Save Course Access
                </button>

            </div>

        `;

    });

}


/* SAVE COURSE ACCESS */

async function saveStudentAccess(studentId){

    const checkboxes =
        document.querySelectorAll(
            `.student-course[data-student="${studentId}"]`
        );


    const selected = [];


    checkboxes.forEach(box => {

        if(box.checked){

            selected.push(
                box.value
            );

        }

    });


    const {
        error
    } =
    await supabaseClient
    .from("student_accounts")
    .update({
        course_access:selected
    })
    .eq("id",studentId);


    if(error){

        alert(
            "Course Access save failed:\n" +
            error.message
        );

        return;

    }


    alert(
        "Course Access successfully updated."
    );


    await loadStudents();

}


/* CREATE STUDENT */

document.getElementById(
    "studentForm"
)
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const username =
            document.getElementById(
                "studentUsername"
            ).value.trim();


        const password =
            document.getElementById(
                "studentPassword"
            ).value;


        const checkboxes =
            document.querySelectorAll(
                ".create-course"
            );


        const selectedCourses = [];


        checkboxes.forEach(box => {

            if(box.checked){

                selectedCourses.push(
                    box.value
                );

            }

        });


        const msg =
            document.getElementById(
                "studentMessage"
            );


        msg.style.display =
            "block";

        msg.className =
            "message";

        msg.textContent =
            "Creating student...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.functions.invoke(
                "create-student-v2",
                {
                    body:{
                        username:username,
                        password:password
                    }
                }
            );


            if(error){

                throw error;

            }


            if(
                !data ||
                data.ok !== true
            ){

                throw new Error(
                    data?.error ||
                    "Student creation failed."
                );

            }


            const {
                data: student,
                error: findError
            } =
            await supabaseClient
            .from("student_accounts")
            .select("id,username")
            .eq("username",username)
            .maybeSingle();


            if(findError){

                throw findError;

            }


            if(!student){

                throw new Error(
                    "Student created, but account row was not found."
                );

            }


            const {
                error: accessError
            } =
            await supabaseClient
            .from("student_accounts")
            .update({
                course_access:selectedCourses
            })
            .eq("id",student.id);


            if(accessError){

                throw accessError;

            }


            msg.className =
                "message success-msg";

            msg.textContent =
                "Student created successfully!";


            document.getElementById(
                "studentForm"
            ).reset();


            await loadStudents();

        }
        catch(err){

            console.error(err);

            msg.className =
                "message error-msg";

            msg.textContent =
                err.message ||
                "Error occurred.";

        }

    }
);


/* ==========================================
   COURSE MANAGEMENT
   ========================================== */


/* LOAD COURSES */

async function loadCourses(){

    const {
        data: courses,
        error: courseError
    } =
    await supabaseClient
    .from("courses")
    .select("id,name")
    .order("id",{ascending:true});


    if(courseError){

        console.error(courseError);

        document.getElementById(
            "coursesList"
        ).innerHTML =
            `
            <div class="empty">
                Courses load failed.
            </div>
            `;

        return;

    }


    ALL_COURSES =
        courses.map(
            course => course.name
        );


    document.getElementById(
        "courseCount"
    ).textContent =
        courses.length;


    const {
        data: lessons,
        error: lessonError
    } =
    await supabaseClient
    .from("lessons")
    .select("course");


    if(lessonError){

        console.error(lessonError);

    }


    const box =
        document.getElementById(
            "coursesList"
        );


    box.innerHTML = "";


    if(courses.length === 0){

        box.innerHTML =
            `
            <div class="empty">
                No courses available.
            </div>
            `;

        buildCourseInputs();

        return;

    }


    courses.forEach(course => {

        const count =
            (lessons || []).filter(
                lesson =>
                lesson.course === course.name
            ).length;


        box.innerHTML += `

            <div class="course-management">

                <div>

                    <div class="course-management-name">
                        📚 ${escapeHtml(course.name)}
                    </div>

                    <div class="course-label">
                        ${count}
                        Lesson${count === 1 ? "" : "s"}
                    </div>

                </div>


                <div class="course-actions">

                    <button
                        class="edit-btn"
                        onclick="editCourse(${course.id}, '${escapeJs(course.name)}')"
                    >
                        ✏️ Edit
                    </button>


                    <button
                        class="danger"
                        onclick="deleteCourse(${course.id}, '${escapeJs(course.name)}')"
                    >
                        🗑️ Delete
                    </button>

                </div>

            </div>

        `;

    });


    buildCourseInputs();

}


/* ADD COURSE */

async function addCourse(){

    const input =
        document.getElementById(
            "newCourseName"
        );


    const name =
        input.value.trim();


    const msg =
        document.getElementById(
            "courseMessage"
        );


    if(!name){

        msg.style.display =
            "block";

        msg.className =
            "message error-msg";

        msg.textContent =
            "Please enter a course name.";

        return;

    }


    msg.style.display =
        "block";

    msg.className =
        "message";

    msg.textContent =
        "Adding course...";


    try{

        const {
            error
        } =
        await supabaseClient
        .from("courses")
        .insert({
            name:name
        });


        if(error){

            if(
                error.code === "23505"
            ){

                throw new Error(
                    "මෙම Course එක දැනටමත් තිබෙනවා."
                );

            }

            throw error;

        }


        msg.className =
            "message success-msg";

        msg.textContent =
            "Course added successfully!";


        input.value = "";


        await loadCourseNames();

        await loadCourses();

        await loadStudents();

    }
    catch(err){

        console.error(err);

        msg.className =
            "message error-msg";

        msg.textContent =
            err.message ||
            "Course add failed.";

    }

}


/* EDIT COURSE */

async function editCourse(
    courseId,
    oldName
){

    const newName =
        prompt(
            "Enter new course name:",
            oldName
        );


    if(newName === null){

        return;

    }


    const cleanName =
        newName.trim();


    if(!cleanName){

        alert(
            "Course name cannot be empty."
        );

        return;

    }


    if(cleanName === oldName){

        return;

    }


    try{

        /*
         * Check duplicate course name
         */

        const {
            data: existing,
            error: existingError
        } =
        await supabaseClient
        .from("courses")
        .select("id")
        .eq("name",cleanName)
        .maybeSingle();


        if(existingError){

            throw existingError;

        }


        if(existing){

            alert(
                "මෙම Course Name එක දැනටමත් තිබෙනවා."
            );

            return;

        }


        /*
         * Update course table
         */

        const {
            error: courseError
        } =
        await supabaseClient
        .from("courses")
        .update({
            name:cleanName
        })
        .eq("id",courseId);


        if(courseError){

            throw courseError;

        }


        /*
         * Update lessons using old course name
         */

        const {
            error: lessonError
        } =
        await supabaseClient
        .from("lessons")
        .update({
            course:cleanName
        })
        .eq("course",oldName);


        if(lessonError){

            throw lessonError;

        }


        /*
         * Update student course access
         */

        const {
            data: students,
            error: studentError
        } =
        await supabaseClient
        .from("student_accounts")
        .select("id,course_access");


        if(studentError){

            throw studentError;

        }


        for(
            const student of students || []
        ){

            const access =
                student.course_access || [];


            if(
                access.includes(oldName)
            ){

                const newAccess =
                    access.map(
                        course =>
                        course === oldName
                        ? cleanName
                        : course
                    );


                const {
                    error: updateError
                } =
                await supabaseClient
                .from("student_accounts")
                .update({
                    course_access:newAccess
                })
                .eq("id",student.id);


                if(updateError){

                    throw updateError;

                }

            }

        }


        alert(
            "Course name updated successfully."
        );


        await loadCourseNames();

        await loadCourses();

        await loadStudents();

        await loadLessons();

    }
    catch(err){

        console.error(err);

        alert(
            "Course Edit failed:\n" +
            err.message
        );

    }

}


/* DELETE COURSE */

async function deleteCourse(
    courseId,
    courseName
){

    /*
     * Check whether lessons exist
     */

    const {
        data: lessons,
        error: lessonCheckError
    } =
    await supabaseClient
    .from("lessons")
    .select("id")
    .eq("course",courseName);


    if(lessonCheckError){

        alert(
            "Course check failed:\n" +
            lessonCheckError.message
        );

        return;

    }


    if(
        lessons &&
        lessons.length > 0
    ){

        alert(
            "මෙම Course එක Delete කරන්න බැහැ.\n\n" +
            "මෙයට Lessons " +
            lessons.length +
            " ක් තිබෙනවා.\n\n" +
            "මුලින් එම Lessons Delete කරන්න."
        );

        return;

    }


    const yes =
        confirm(
            '"' +
            courseName +
            '" Course එක Delete කරන්නද?\n\n' +
            "මෙය ආපසු ලබාගත නොහැක."
        );


    if(!yes){

        return;

    }


    try{

        /*
         * Remove course from student access
         */

        const {
            data: students,
            error: studentError
        } =
        await supabaseClient
        .from("student_accounts")
        .select("id,course_access");


        if(studentError){

            throw studentError;

        }


        for(
            const student of students || []
        ){

            const access =
                student.course_access || [];


            if(
                access.includes(courseName)
            ){

                const newAccess =
                    access.filter(
                        course =>
                        course !== courseName
                    );


                const {
                    error: updateError
                } =
                await supabaseClient
                .from("student_accounts")
                .update({
                    course_access:newAccess
                })
                .eq("id",student.id);


                if(updateError){

                    throw updateError;

                }

            }

        }


        /*
         * Delete course
         */

        const {
            error: deleteError
        } =
        await supabaseClient
        .from("courses")
        .delete()
        .eq("id",courseId);


        if(deleteError){

            throw deleteError;

        }


        alert(
            "Course deleted successfully."
        );


        await loadCourseNames();

        await loadCourses();

        await loadStudents();


    }
    catch(err){

        console.error(err);

        alert(
            "Course Delete failed:\n" +
            err.message
        );

    }

}


/* LOAD LESSONS */

async function loadLessons(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("lessons")
    .select("*")
    .order(
        "created_at",
        {ascending:false}
    );


    if(error){

        console.error(error);

        document.getElementById(
            "lessonsList"
        ).innerHTML =
            `
            <div class="empty">
                Lessons load failed.
            </div>
            `;

        return;

    }


    document.getElementById(
        "lessonCount"
    ).textContent =
        data.length;


    const box =
        document.getElementById(
            "lessonsList"
        );


    if(data.length === 0){

        box.innerHTML =
            `
            <div class="empty">
                No lessons uploaded yet.
            </div>
            `;

        return;

    }


    box.innerHTML = "";


    data.forEach(lesson => {

        let videoHTML = "";


        if(lesson.video_path){

            const {
                data: publicData
            } =
            supabaseClient
            .storage
            .from("Video")
            .getPublicUrl(
                lesson.video_path
            );


            if(publicData?.publicUrl){

                videoHTML = `

                    <video
                        controls
                        preload="metadata"
                    >

                        <source
                            src="${publicData.publicUrl}"
                            type="video/mp4"
                        >

                        Your browser does not support video.

                    </video>

                `;

            }

        }


        let pdfHTML = "";


        if(lesson.pdf_path){

            const {
                data: pdfData
            } =
            supabaseClient
            .storage
            .from("Video")
            .getPublicUrl(
                lesson.pdf_path
            );


            if(pdfData?.publicUrl){

                pdfHTML = `

                    <div class="pdf-box">

                        📄

                        <a
                            href="${pdfData.publicUrl}"
                            target="_blank"
                            download
                        >
                            Open / Download Lesson PDF
                        </a>

                    </div>

                `;

            }

        }


        box.innerHTML += `

            <div class="lesson">

                <div class="lesson-title">
                    ${escapeHtml(lesson.title)}
                </div>

                <div class="course-label">
                    ${escapeHtml(lesson.course)}
                </div>

                <p>
                    ${escapeHtml(
                        lesson.description || ""
                    )}
                </p>

                ${videoHTML}

                ${pdfHTML}

                <br>

                <button
                    class="danger"
                    onclick="deleteLesson(${lesson.id})"
                >
                    Delete Lesson
                </button>

            </div>

        `;

    });

}


/* ADD LESSON */

document.getElementById(
    "lessonForm"
)
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const title =
            document.getElementById(
                "lessonTitle"
            ).value.trim();


        const course =
            document.getElementById(
                "lessonCourse"
            ).value;


        const description =
            document.getElementById(
                "lessonDescription"
            ).value.trim();


        const videoFile =
            document.getElementById(
                "videoFile"
            ).files[0];


        const pdfFile =
            document.getElementById(
                "pdfFile"
            ).files[0];


        const msg =
            document.getElementById(
                "lessonMessage"
            );


        msg.style.display =
            "block";

        msg.className =
            "message";

        msg.textContent =
            "Uploading lesson...";


        try{

            if(!videoFile){

                throw new Error(
                    "Please select a video file."
                );

            }


            const videoPath =
                course +
                "/" +
                Date.now() +
                "-" +
                cleanFileName(
                    videoFile.name
                );


            const {
                error: videoError
            } =
            await supabaseClient
            .storage
            .from("Video")
            .upload(
                videoPath,
                videoFile,
                {
                    upsert:false,
                    contentType:
                        videoFile.type
                }
            );


            if(videoError){

                throw videoError;

            }


            let pdfPath = null;


            if(pdfFile){

                if(
                    pdfFile.type !==
                    "application/pdf"
                ){

                    throw new Error(
                        "PDF file එකක් පමණක් upload කරන්න."
                    );

                }


                pdfPath =
                    course +
                    "/PDF/" +
                    Date.now() +
                    "-" +
                    cleanFileName(
                        pdfFile.name
                    );


                const {
                    error: pdfError
                } =
                await supabaseClient
                .storage
                .from("Video")
                .upload(
                    pdfPath,
                    pdfFile,
                    {
                        upsert:false,
                        contentType:
                            "application/pdf"
                    }
                );


                if(pdfError){

                    throw pdfError;

                }

            }


            const {
                error: lessonError
            } =
            await supabaseClient
            .from("lessons")
            .insert({

                title:title,

                course:course,

                description:
                    description || null,

                video_path:
                    videoPath,

                pdf_path:
                    pdfPath

            });


            if(lessonError){

                await supabaseClient
                .storage
                .from("Video")
                .remove([
                    videoPath
                ]);


                if(pdfPath){

                    await supabaseClient
                    .storage
                    .from("Video")
                    .remove([
                        pdfPath
                    ]);

                }


                throw lessonError;

            }


            msg.className =
                "message success-msg";

            msg.textContent =
                "Lesson uploaded successfully!";


            document.getElementById(
                "lessonForm"
            ).reset();


            await loadLessons();

            await loadCourses();

        }
        catch(err){

            console.error(err);

            msg.className =
                "message error-msg";

            msg.textContent =
                err.message ||
                "Lesson upload failed.";

        }

    }
);


/* DELETE LESSON */

async function deleteLesson(id){

    const yes =
        confirm(
            "මෙම Lesson එක Delete කරන්නද?"
        );


    if(!yes){

        return;

    }


    const {
        data: lesson,
        error: findError
    } =
    await supabaseClient
    .from("lessons")
    .select(
        "video_path,pdf_path"
    )
    .eq("id",id)
    .maybeSingle();


    if(findError){

        alert(
            findError.message
        );

        return;

    }


    if(lesson){

        const files = [];


        if(lesson.video_path){

            files.push(
                lesson.video_path
            );

        }


        if(lesson.pdf_path){

            files.push(
                lesson.pdf_path
            );

        }


        if(files.length > 0){

            await supabaseClient
            .storage
            .from("Video")
            .remove(files);

        }

    }


    const {
        error
    } =
    await supabaseClient
    .from("lessons")
    .delete()
    .eq("id",id);


    if(error){

        alert(
            "Delete failed:\n" +
            error.message
        );

        return;

    }


    await loadLessons();

    await loadCourses();

}

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href =
        "login.html";

}


/* HELPERS */

function cleanFileName(name){

    return name
        .replace(
            /[^\w.\-]/g,
            "_"
        );

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(value){

    return String(value ?? "")
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /\r/g,
            ""
        )
        .replace(
            /\n/g,
            "\\n"
        );

}
