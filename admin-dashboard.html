<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | MN Technology</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    /* NAVBAR */
    .navbar {
      background: #051223;
      color: white;
      padding: 14px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #22d3ee;
      color: #051223;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .logout-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 10px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* CONTAINER */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin-bottom: 8px;
      color: #051223;
    }

    .welcome p {
      color: #667085;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .stat-card h3 {
      color: #667085;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .stat-card .number {
      font-size: 30px;
      font-weight: bold;
      color: #051223;
    }

    /* GRID */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 20px;
      color: #051223;
      font-size: 21px;
    }

    /* FORM */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background: white;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #22d3ee;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .primary-btn {
      width: 100%;
      background: #051223;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .primary-btn:hover {
      background: #0b294d;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* MESSAGE */
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    /* UPLOAD STATUS */
    .upload-status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 8px;
      font-size: 14px;
    }

    /* LIST */
    .list-card {
      margin-top: 25px;
    }

    .item {
      border: 1px solid #e4e7ec;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .item h3 {
      color: #051223;
      margin-bottom: 5px;
    }

    .item small {
      color: #667085;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }

    .delete-btn:hover {
      background: #dc2626;
    }

    .video-preview {
      margin-top: 12px;
      width: 100%;
      max-width: 550px;
      border-radius: 10px;
      background: black;
    }

    .empty {
      color: #667085;
      text-align: center;
      padding: 20px;
    }

    /* RESPONSIVE */
    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .navbar {
        padding: 12px 15px;
      }

      .container {
        padding: 15px;
      }

      .brand {
        font-size: 17px;
      }

      .logo {
        width: 36px;
        height: 36px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="brand">
      <div class="logo">MN</div>
      <span>MN Technology - Admin</span>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>


  <main class="container">

    <!-- WELCOME -->
    <section class="welcome">
      <h1>Admin Dashboard</h1>
      <p>Welcome to MN Technology Administration Panel.</p>
    </section>


    <!-- STATS -->
    <section class="stats">

      <div class="stat-card">
        <h3>Total Students</h3>
        <div class="number" id="studentCount">0</div>
      </div>

      <div class="stat-card">
        <h3>Total Lessons</h3>
        <div class="number" id="lessonCount">0</div>
      </div>

      <div class="stat-card">
        <h3>Uploaded Videos</h3>
        <div class="number" id="videoCount">0</div>
      </div>

    </section>


    <!-- ADD SECTION -->
    <section class="main-grid">

      <!-- CREATE STUDENT -->
      <div class="card">

        <h2>👨‍🎓 Create Student</h2>

        <form id="studentForm">

          <div class="form-group">
            <label>Student Username</label>
            <input
              type="text"
              id="studentUsername"
              placeholder="Example: student01"
              required
            >
          </div>

          <div class="form-group">
            <label>Student Password</label>
            <input
              type="password"
              id="studentPassword"
              placeholder="Enter password"
              required
              minlength="6"
            >
          </div>

          <button
            type="submit"
            class="primary-btn"
            id="studentButton"
          >
            Create Student
          </button>

        </form>

        <div id="studentMessage" class="message"></div>

      </div>


      <!-- ADD LESSON -->
      <div class="card">

        <h2>🎥 Add New Lesson</h2>

        <form id="lessonForm">

          <div class="form-group">
            <label>Course</label>

            <select id="course" required>
              <option value="">Select Course</option>
              <option value="Electronics">Electronics</option>
              <option value="Electrical">Electrical</option>
              <option value="Radio">Radio</option>
              <option value="TV">TV</option>
              <option value="Other">Other</option>
            </select>
          </div>


          <div class="form-group">
            <label>Lesson Title</label>

            <input
              type="text"
              id="lessonTitle"
              placeholder="Example: Capacitor"
              required
            >
          </div>


          <div class="form-group">
            <label>Description</label>

            <textarea
              id="lessonDescription"
              placeholder="Enter lesson description"
            ></textarea>
          </div>


          <div class="form-group">
            <label>Video File</label>

            <input
              type="file"
              id="videoFile"
              accept="video/*"
              required
            >
          </div>


          <div id="uploadStatus" class="upload-status">
            Uploading video... Please wait.
          </div>


          <button
            type="submit"
            class="primary-btn"
            id="lessonButton"
          >
            Upload Video & Save Lesson
          </button>

        </form>

        <div id="lessonMessage" class="message"></div>

      </div>

    </section>


    <!-- STUDENTS -->
    <section class="card list-card">

      <h2>👨‍🎓 Students</h2>

      <div id="studentsList">
        <div class="empty">Loading students...</div>
      </div>

    </section>


    <!-- LESSONS -->
    <section class="card list-card">

      <h2>📚 Lessons & Videos</h2>

      <div id="lessonsList">
        <div class="empty">Loading lessons...</div>
      </div>

    </section>

  </main>


<script>

  /* =========================================
     SUPABASE CONFIG
  ========================================= */

  const SUPABASE_URL =
    "https://ekanfqwbqwfhjfgctouk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     PAGE START
  ========================================= */

  document.addEventListener("DOMContentLoaded", async () => {

    await checkAdmin();

    await loadStudents();

    await loadLessons();

  });


  /* =========================================
     ADMIN CHECK
  ========================================= */

  async function checkAdmin() {

    const {
      data: { session },
      error
    } = await supabaseClient.auth.getSession();

    if (error || !session) {

      window.location.href = "login.html";

      return;
    }


    /*
      Check whether logged-in user
      is actually an admin.
    */

    const { data: adminRow, error: adminError } =
      await supabaseClient
        .from("admins")
        .select("username")
        .eq("id", session.user.id)
        .maybeSingle();


    if (adminError || !adminRow) {

      await supabaseClient.auth.signOut();

      alert("Admin access required.");

      window.location.href = "login.html";

      return;
    }

  }


  /* =========================================
     LOGOUT
  ========================================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    localStorage.removeItem("studentLoggedIn");

    window.location.href = "login.html";

  }


  /* =========================================
     CREATE STUDENT
  ========================================= */

  document
    .getElementById("studentForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      const username =
        document
          .getElementById("studentUsername")
          .value
          .trim();

      const password =
        document
          .getElementById("studentPassword")
          .value;


      const button =
        document.getElementById("studentButton");

      const message =
        document.getElementById("studentMessage");


      message.className = "message";
      message.textContent = "";


      if (!username || !password) {

        showMessage(
          message,
          "Please enter username and password.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent = "Creating...";


      try {

        /*
          Edge Function creates the
          Supabase Auth student account.
        */

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {

          throw new Error("Admin session expired.");

        }


        const response =
          await supabaseClient.functions.invoke(
            "create-student",
            {
              body: {
                username: username,
                password: password
              }
            }
          );


        if (response.error) {

          throw response.error;

        }


        if (
          response.data &&
          response.data.error
        ) {

          throw new Error(
            response.data.error
          );

        }


        showMessage(
          message,
          "Student account created successfully.",
          "success"
        );


        document
          .getElementById("studentForm")
          .reset();


        await loadStudents();


      } catch (error) {

        console.error(error);

        showMessage(
          message,
          error.message ||
          "Unable to create student.",
          "error"
        );

      }


      button.disabled = false;
      button.textContent = "Create Student";

    });


  /* =========================================
     LOAD STUDENTS
  ========================================= */

  async function loadStudents() {

    const list =
      document.getElementById("studentsList");


    const {
      data,
      error
    } = await supabaseClient
      .from("student_accounts")
      .select("id, username, created_at")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      list.innerHTML =
        '<div class="empty">Unable to load students.</div>';

      return;
    }


    document.getElementById("studentCount")
      .textContent = data.length;


    if (!data.length) {

      list.innerHTML =
        '<div class="empty">No students created yet.</div>';

      return;
    }


    list.innerHTML = "";


    data.forEach(student => {

      const item =
        document.createElement("div");

      item.className = "item";


      const header =
        document.createElement("div");

      header.className = "item-header";


      const info =
        document.createElement("div");


      const title =
        document.createElement("h3");

      title.textContent =
        student.username;


      const date =
        document.createElement("small");

      date.textContent =
        "Created: " +
        new Date(student.created_at)
          .toLocaleString();


      info.appendChild(title);
      info.appendChild(date);


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "Delete";


      deleteButton.onclick =
        () => deleteStudent(student.id);


      header.appendChild(info);
      header.appendChild(deleteButton);

      item.appendChild(header);

      list.appendChild(item);

    });

  }


  /* =========================================
     DELETE STUDENT
  ========================================= */

  async function deleteStudent(studentId) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this student?"
      );


    if (!confirmed) return;


    /*
      Student deletion through frontend
      requires a secure server function.
      We call the Edge Function.
    */

    try {

      const response =
        await supabaseClient.functions.invoke(
          "delete-student",
          {
            body: {
              studentId: studentId
            }
          }
        );


      if (response.error) {

        throw response.error;

      }


      if (
        response.data &&
        response.data.error
      ) {

        throw new Error(
          response.data.error
        );

      }


      alert("Student deleted successfully.");

      await loadStudents();


    } catch (error) {

      console.error(error);

      alert(
        "Student delete failed: " +
        error.message
      );

    }

  }


  /* =========================================
     ADD LESSON + VIDEO
  ========================================= */

  document
    .getElementById("lessonForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();


      const course =
        document
          .getElementById("course")
          .value;

      const title =
        document
          .getElementById("lessonTitle")
          .value
          .trim();

      const description =
        document
          .getElementById("lessonDescription")
          .value
          .trim();

      const fileInput =
        document.getElementById("videoFile");

      const file =
        fileInput.files[0];


      const button =
        document.getElementById("lessonButton");

      const message =
        document.getElementById("lessonMessage");

      const status =
        document.getElementById("uploadStatus");


      message.className = "message";
      message.textContent = "";


      if (!file) {

        showMessage(
          message,
          "Please select a video file.",
          "error"
        );

        return;
      }


      /*
        Check video file type.
      */

      if (!file.type.startsWith("video/")) {

        showMessage(
          message,
          "Please select a valid video file.",
          "error"
        );

        return;
      }


      button.disabled = true;

      button.textContent =
        "Uploading...";


      status.style.display = "block";

      status.textContent =
        "Uploading video... Please wait.";


      let filePath = null;


      try {

        /*
          Create safe filename.
        */

        const safeName =
          file.name
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        filePath =
          course +
          "/" +
          Date.now() +
          "-" +
          safeName;


        /*
          Upload video to Supabase Storage.
        */

        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("Video")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false,
                contentType:
                  file.type ||
                  "video/mp4"
              }
            );


        if (uploadError) {

          throw uploadError;

        }


        status.textContent =
          "Video uploaded. Saving lesson...";


        /*
          Save storage path to lessons table.
        */

        const {
          error: dbError
        } =
          await supabaseClient
            .from("lessons")
            .insert({
              title: title,
              course: course,
              description: description,
              video_path: filePath
            });


        if (dbError) {

          /*
            If database save fails,
            remove uploaded video.
          */

          await supabaseClient
            .storage
            .from("Video")
            .remove([filePath]);


          throw dbError;

        }


        status.style.display = "none";


        showMessage(
          message,
          "Lesson and video uploaded successfully.",
          "success"
        );


        document
          .getElementById("lessonForm")
          .reset();


        await loadLessons();


      } catch (error) {

        console.error(error);


        status.style.display = "none";


        showMessage(
          message,
          error.message ||
          "Video upload failed.",
          "error"
        );

      }


      button.disabled = false;

      button.textContent =
        "Upload Video & Save Lesson";

    });


  /* =========================================
     LOAD LESSONS
  ========================================= */

  async function loadLessons() {

    const list =
      document.getElementById("lessonsList");


    const {
      data,
      error
    } =
      await supabaseClient
        .from("lessons")
        .select(
          "id, title, course, description, video_path, created_at"
        )
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      list.innerHTML =
        '<div class="empty">Unable to load lessons.</div>';

      return;
    }


    document.getElementById("lessonCount")
      .textContent = data.length;


    document.getElementById("videoCount")
      .textContent =
        data.filter(
          lesson => lesson.video_path
        ).length;


    if (!data.length) {

      list.innerHTML =
        '<div class="empty">No lessons uploaded yet.</div>';

      return;
    }


    list.innerHTML = "";


    data.forEach(lesson => {

      const item =
        document.createElement("div");

      item.className = "item";


      const header =
        document.createElement("div");

      header.className =
        "item-header";


      const info =
        document.createElement("div");


      const title =
        document.createElement("h3");

      title.textContent =
        lesson.title;


      const course =
        document.createElement("small");

      course.textContent =
        "Course: " +
        lesson.course;


      info.appendChild(title);
      info.appendChild(course);


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-btn";

      deleteButton.textContent =
        "Delete";


      deleteButton.onclick =
        () => deleteLesson(
          lesson.id,
          lesson.video_path
        );


      header.appendChild(info);
      header.appendChild(deleteButton);


      item.appendChild(header);


      if (lesson.description) {

        const description =
          document.createElement("p");

        description.style.marginTop =
          "10px";

        description.textContent =
          lesson.description;

        item.appendChild(description);

      }


      /*
        Get public URL from Storage.
      */

      if (lesson.video_path) {

        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("Video")
            .getPublicUrl(
              lesson.video_path
            );


        const video =
          document.createElement("video");

        video.className =
          "video-preview";

        video.controls = true;

        video.preload =
          "metadata";

        video.src =
          publicUrlData.publicUrl;


        item.appendChild(video);

      }


      list.appendChild(item);

    });

  }


  /* =========================================
     DELETE LESSON
  ========================================= */

  async function deleteLesson(
    lessonId,
    videoPath
  ) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this lesson and video?"
      );


    if (!confirmed) return;


    try {

      /*
        Delete video from Storage.
      */

      if (videoPath) {

        const {
          error: storageError
        } =
          await supabaseClient
            .storage
            .from("Video")
            .remove([videoPath]);


        if (storageError) {

          console.error(
            storageError
          );

        }

      }


      /*
        Delete lesson from database.
      */

      const {
        error
      } =
        await supabaseClient
          .from("lessons")
          .delete()
          .eq("id", lessonId);


      if (error) {

        throw error;

      }


      alert(
        "Lesson deleted successfully."
      );


      await loadLessons();


    } catch (error) {

      console.error(error);

      alert(
        "Lesson delete failed: " +
        error.message
      );

    }

  }


  /* =========================================
     MESSAGE
  ========================================= */

  function showMessage(
    element,
    text,
    type
  ) {

    element.textContent =
      text;

    element.className =
      "message " + type;

  }

</script>

</body>
</html>
