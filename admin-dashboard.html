<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | MN Technology</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    nav {
      background: #051223;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      background: #22d3ee;
      color: #051223;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .logout-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .stat-card h3 {
      font-size: 32px;
      color: #0ea5e9;
      margin-bottom: 8px;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      cursor: pointer;
    }

    .primary-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: bold;
    }

    .primary-btn:hover {
      background: #0284c7;
    }

    .danger-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 13px;
      border-radius: 6px;
    }

    .student-item,
    .lesson-item {
      border: 1px solid #e5e7eb;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .lesson-item h3 {
      margin-bottom: 7px;
    }

    .lesson-item p {
      color: #64748b;
      margin-bottom: 12px;
    }

    video {
      width: 100%;
      max-width: 700px;
      border-radius: 10px;
      background: black;
      margin-top: 10px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .empty {
      color: #64748b;
      padding: 10px 0;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .student-item {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        padding: 12px 15px;
      }

      .container {
        padding: 0 12px;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="logo">
    <div class="logo-box">MN</div>
    <span>MN Technology - Admin</span>
  </div>

  <button class="logout-btn" id="logoutBtn">
    Logout
  </button>
</nav>


<div class="container">

  <h1>Admin Dashboard</h1>


  <!-- STATS -->
  <div class="stats">

    <div class="stat-card">
      <h3 id="studentCount">0</h3>
      <p>Students</p>
    </div>

    <div class="stat-card">
      <h3 id="lessonCount">0</h3>
      <p>Lessons</p>
    </div>

    <div class="stat-card">
      <h3 id="videoCount">0</h3>
      <p>Videos</p>
    </div>

  </div>


  <!-- MESSAGE -->
  <div id="message" class="message"></div>


  <!-- CREATE STUDENT -->
  <div class="section">

    <h2>Create Student Account</h2>

    <form id="studentForm">

      <label for="studentUsername">
        Student Username
      </label>

      <input
        type="text"
        id="studentUsername"
        placeholder="Example: student01"
        required
        autocomplete="off"
      >

      <label for="studentPassword">
        Student Password
      </label>

      <input
        type="password"
        id="studentPassword"
        placeholder="Minimum 6 characters"
        required
        autocomplete="new-password"
      >

      <button
        type="submit"
        class="primary-btn"
        id="createStudentBtn"
      >
        Create Student
      </button>

    </form>

  </div>


  <!-- ADD LESSON -->
  <div class="section">

    <h2>Add New Lesson</h2>

    <form id="lessonForm">

      <label for="lessonTitle">
        Lesson Title
      </label>

      <input
        type="text"
        id="lessonTitle"
        placeholder="Example: Resistor"
        required
      >


      <label for="lessonCourse">
        Course
      </label>

      <input
        type="text"
        id="lessonCourse"
        placeholder="Example: Electronics"
        required
      >


      <label for="lessonDescription">
        Description
      </label>

      <textarea
        id="lessonDescription"
        placeholder="Lesson description"
      ></textarea>


      <label for="videoFile">
        Video File
      </label>

      <input
        type="file"
        id="videoFile"
        accept="video/*"
        required
      >


      <button
        type="submit"
        class="primary-btn"
        id="uploadVideoBtn"
      >
        Upload Lesson & Video
      </button>

    </form>

  </div>


  <!-- STUDENTS -->
  <div class="section">

    <h2>Student Accounts</h2>

    <div id="studentsList">
      <p class="empty">Loading students...</p>
    </div>

  </div>


  <!-- LESSONS -->
  <div class="section">

    <h2>Lessons & Videos</h2>

    <div id="lessonsList">
      <p class="empty">Loading lessons...</p>
    </div>

  </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* =========================================
     SUPABASE CONFIGURATION
  ========================================= */

  const SUPABASE_URL =
    "https://ekanfqwbqwfhjfgctouk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ELEMENTS
  ========================================= */

  const messageBox =
    document.getElementById("message");

  const studentForm =
    document.getElementById("studentForm");

  const lessonForm =
    document.getElementById("lessonForm");

  const studentsList =
    document.getElementById("studentsList");

  const lessonsList =
    document.getElementById("lessonsList");


  /* =========================================
     MESSAGE
  ========================================= */

  function showMessage(text, type = "success") {

    messageBox.textContent = text;

    messageBox.className =
      "message " + type;

    messageBox.style.display = "block";

    setTimeout(() => {
      messageBox.style.display = "none";
    }, 5000);
  }


  /* =========================================
     ADMIN CHECK
  ========================================= */

  async function checkAdmin() {

    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (
      sessionError ||
      !sessionData ||
      !sessionData.session
    ) {
      window.location.href = "login.html";
      return null;
    }

    const user =
      sessionData.session.user;


    const {
      data: adminRow,
      error: adminError
    } = await supabaseClient
      .from("admins")
      .select("id, username")
      .eq("id", user.id)
      .maybeSingle();


    if (
      adminError ||
      !adminRow
    ) {

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";

      return null;
    }

    return user;
  }


  /* =========================================
     LOAD DASHBOARD
  ========================================= */

  async function loadDashboard() {

    await loadStudents();

    await loadLessons();

  }


  /* =========================================
     LOAD STUDENTS
  ========================================= */

  async function loadStudents() {

    studentsList.innerHTML =
      '<p class="empty">Loading students...</p>';

    const {
      data,
      error
    } = await supabaseClient
      .from("student_accounts")
      .select("id, username, created_at")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      studentsList.innerHTML =
        `<p class="empty">
          Could not load students.
        </p>`;

      console.error(error);

      return;
    }


    document.getElementById("studentCount")
      .textContent = data.length;


    if (!data.length) {

      studentsList.innerHTML =
        '<p class="empty">No students created yet.</p>';

      return;
    }


    studentsList.innerHTML = "";


    data.forEach(student => {

      const div =
        document.createElement("div");

      div.className =
        "student-item";


      const date =
        student.created_at
          ? new Date(student.created_at)
              .toLocaleDateString()
          : "";


      div.innerHTML = `

        <div>

          <strong>
            Username: ${escapeHtml(student.username)}
          </strong>

          <p>
            Created: ${date}
          </p>

        </div>

        <button
          class="danger-btn"
          onclick="deleteStudent('${student.id}', '${escapeHtml(student.username)}')"
        >
          Delete
        </button>

      `;


      studentsList.appendChild(div);

    });

  }


  /* =========================================
     LOAD LESSONS
  ========================================= */

  async function loadLessons() {

    lessonsList.innerHTML =
      '<p class="empty">Loading lessons...</p>';


    const {
      data,
      error
    } = await supabaseClient
      .from("lessons")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      lessonsList.innerHTML =
        `<p class="empty">
          Could not load lessons.
        </p>`;

      console.error(error);

      return;
    }


    document.getElementById("lessonCount")
      .textContent = data.length;

    document.getElementById("videoCount")
      .textContent =
        data.filter(x => x.video_path).length;


    if (!data.length) {

      lessonsList.innerHTML =
        '<p class="empty">No lessons added yet.</p>';

      return;
    }


    lessonsList.innerHTML = "";


    data.forEach(lesson => {

      const div =
        document.createElement("div");

      div.className =
        "lesson-item";


      let videoHtml = "";


      if (lesson.video_path) {

        const {
          data: publicUrlData
        } =
          supabaseClient.storage
            .from("Video")
            .getPublicUrl(
              lesson.video_path
            );


        const videoUrl =
          publicUrlData.publicUrl;


        videoHtml = `

          <video
            controls
            preload="metadata"
          >
            <source
              src="${videoUrl}"
              type="video/mp4"
            >

            Your browser does not support
            HTML5 video.
          </video>

        `;
      }


      div.innerHTML = `

        <h3>
          ${escapeHtml(lesson.title)}
        </h3>

        <p>
          <strong>Course:</strong>
          ${escapeHtml(lesson.course)}
        </p>

        <p>
          ${escapeHtml(
            lesson.description || ""
          )}
        </p>

        ${videoHtml}

        <br>

        <button
          class="danger-btn"
          onclick="deleteLesson(${lesson.id}, '${escapeHtml(lesson.video_path || "")}')"
        >
          Delete Lesson
        </button>

      `;


      lessonsList.appendChild(div);

    });

  }


  /* =========================================
     CREATE STUDENT
  ========================================= */

  studentForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const username =
        document.getElementById(
          "studentUsername"
        ).value.trim();


      const password =
        document.getElementById(
          "studentPassword"
        ).value;


      if (
        !/^[A-Za-z0-9_]{3,30}$/.test(username)
      ) {

        showMessage(
          "Username must be 3-30 characters using letters, numbers or underscore.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must contain at least 6 characters.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById(
          "createStudentBtn"
        );


      button.disabled = true;

      button.textContent =
        "Creating...";


      try {

        const response =
          await supabaseClient.functions.invoke(
            "create-student-v2",
            {
              body: {
                username,
                password
              }
            }
          );


        console.log(
          "Create student response:",
          response
        );


        if (response.error) {

          throw new Error(
            response.error.message ||
            "Edge Function error."
          );
        }


        if (
          response.data &&
          response.data.ok === false
        ) {

          throw new Error(
            response.data.error ||
            "Student creation failed."
          );
        }


        if (
          !response.data ||
          response.data.ok !== true
        ) {

          throw new Error(
            "Student account was not created."
          );
        }


        showMessage(
          `Student "${username}" created successfully!`,
          "success"
        );


        studentForm.reset();


        await loadStudents();


      } catch (error) {

        console.error(
          "Create student error:",
          error
        );


        showMessage(
          error.message ||
          "Could not create student.",
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Create Student";

      }

    }
  );


  /* =========================================
     UPLOAD LESSON + VIDEO
  ========================================= */

  lessonForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const title =
        document.getElementById(
          "lessonTitle"
        ).value.trim();


      const course =
        document.getElementById(
          "lessonCourse"
        ).value.trim();


      const description =
        document.getElementById(
          "lessonDescription"
        ).value.trim();


      const file =
        document.getElementById(
          "videoFile"
        ).files[0];


      if (!title || !course || !file) {

        showMessage(
          "Please enter lesson details and select a video.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById(
          "uploadVideoBtn"
        );


      button.disabled = true;

      button.textContent =
        "Uploading...";


      let filePath = null;


      try {

        const safeName =
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


        filePath =
          `${course}/${Date.now()}-${safeName}`;


        /* Upload video */

        const {
          error: uploadError
        } =
          await supabaseClient.storage
            .from("Video")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false,
                contentType:
                  file.type ||
                  "video/mp4"
              }
            );


        if (uploadError) {

          throw uploadError;
        }


        /* Save lesson */

        const {
          error: lessonError
        } =
          await supabaseClient
            .from("lessons")
            .insert({
              title,
              course,
              description,
              video_path: filePath
            });


        if (lessonError) {

          await supabaseClient.storage
            .from("Video")
            .remove([filePath]);


          throw lessonError;
        }


        showMessage(
          "Lesson and video uploaded successfully!",
          "success"
        );


        lessonForm.reset();


        await loadLessons();


      } catch (error) {

        console.error(
          "Upload error:",
          error
        );


        showMessage(
          error.message ||
          "Could not upload video.",
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Upload Lesson & Video";

      }

    }
  );


  /* =========================================
     DELETE LESSON
  ========================================= */

  async function deleteLesson(
    lessonId,
    videoPath
  ) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this lesson?"
      );


    if (!confirmed) return;


    try {

      if (videoPath) {

        const {
          error: storageError
        } =
          await supabaseClient.storage
            .from("Video")
            .remove([
              videoPath
            ]);


        if (storageError) {

          console.warn(
            "Storage delete warning:",
            storageError
          );
        }

      }


      const {
        error
      } =
        await supabaseClient
          .from("lessons")
          .delete()
          .eq("id", lessonId);


      if (error) {

        throw error;
      }


      showMessage(
        "Lesson deleted successfully.",
        "success"
      );


      await loadLessons();


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Could not delete lesson.",
        "error"
      );

    }

  }


  /* =========================================
     DELETE STUDENT
  ========================================= */

  async function deleteStudent(
    studentId,
    username
  ) {

    const confirmed =
      confirm(
        `Delete student "${username}"?`
      );


    if (!confirmed) return;


    try {

      const response =
        await supabaseClient.functions.invoke(
          "delete-student",
          {
            body: {
              student_id: studentId
            }
          }
        );


      if (response.error) {

        throw new Error(
          response.error.message
        );
      }


      if (
        response.data &&
        response.data.error
      ) {

        throw new Error(
          response.data.error
        );
      }


      showMessage(
        "Student deleted successfully.",
        "success"
      );


      await loadStudents();


    } catch (error) {

      console.error(
        "Delete student error:",
        error
      );


      showMessage(
        error.message ||
        "Delete student function is not ready yet.",
        "error"
      );

    }

  }


  /* =========================================
     HTML ESCAPE
  ========================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     LOGOUT
  ========================================= */

  document.getElementById(
    "logoutBtn"
  ).addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

    }
  );


  /* =========================================
     START
  ========================================= */

  (async function() {

    const user =
      await checkAdmin();


    if (!user) return;


    await loadDashboard();

  })();

</script>

</body>
</html>
