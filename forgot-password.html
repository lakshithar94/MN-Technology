<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | MN Technology</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        135deg,
        #06152e,
        #0b4f8a,
        #06152e
      );
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #0b4f8a;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
    }

    .text {
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b4f8a;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      background: #0b4f8a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #083c69;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b4f8a;
      text-decoration: none;
      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      MN Technology
    </div>

    <h2>
      Forgot Password?
    </h2>

    <div class="text">
      Enter your registered email address.
      <br>
      We will send you a password reset link.
    </div>

    <form id="resetForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
        autocomplete="email"
      >

      <button
        type="submit"
        id="sendBtn"
      >
        Send Reset Link
      </button>

    </form>

    <div
      class="message"
      id="message"
    ></div>

    <a
      href="login.html"
      class="back"
    >
      ← Back to Login
    </a>

  </div>


  <script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://ekanfqwbqwfhjfgctouk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tpFTptBWglmisRRHqiptmg_VkKhJdDn";


    // Create Supabase client
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const form =
      document.getElementById("resetForm");

    const emailInput =
      document.getElementById("email");

    const message =
      document.getElementById("message");

    const sendBtn =
      document.getElementById("sendBtn");


    // ==========================================
    // PASSWORD RESET
    // ==========================================

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();


        // Clear old message
        message.textContent = "";
        message.style.color = "";


        // Disable button
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending...";


        try {

          // ======================================
          // IMPORTANT FOR GITHUB PAGES
          // ======================================

          const redirectUrl =
            new URL(
              "reset-password.html",
              window.location.href
            ).href;


          console.log(
            "Password reset redirect URL:",
            redirectUrl
          );


          // ======================================
          // SEND RESET EMAIL
          // ======================================

          const { error } =
            await supabaseClient.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo: redirectUrl
                }
              );


          if (error) {
            throw error;
          }


          // ======================================
          // SUCCESS
          // ======================================

          message.style.color = "green";

          message.textContent =
            "Password reset link sent successfully. Please check your email.";


        } catch (error) {

          // ======================================
          // ERROR
          // ======================================

          console.error(
            "Password reset error:",
            error
          );


          message.style.color = "red";


          if (
            error.message &&
            error.message
              .toLowerCase()
              .includes("invalid api key")
          ) {

            message.textContent =
              "Invalid API key. Please check the Supabase configuration.";

          } else {

            message.textContent =
              error.message ||
              "Failed to send password reset link.";

          }

        } finally {

          // Enable button again
          sendBtn.disabled = false;
          sendBtn.textContent =
            "Send Reset Link";

        }

      }
    );

  </script>

</body>
</html>
