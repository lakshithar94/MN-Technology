<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | MN Technology</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(135deg, #06152e, #0b4f8a, #06152e);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #0b4f8a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .user-type {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .user-type button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #e9eef5;
      color: #333;
      font-weight: bold;
      cursor: pointer;
    }

    .user-type button.active {
      background: #0b4f8a;
      color: white;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #0b4f8a;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0b4f8a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: #083c69;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      min-height: 22px;
    }

    .info {
      margin-top: 22px;
      padding: 14px;
      background: #f1f6fb;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
      text-align: center;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">MN Technology</div>

    <div class="subtitle">
      Electronic & Technical Learning
    </div>

    <!-- User Type -->
    <div class="user-type">
      <button id="studentBtn" class="active" onclick="selectType('student')">
        Student
      </button>

      <button id="adminBtn" onclick="selectType('admin')">
        Admin
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">

      <div class="input-group">
        <label>Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
          autocomplete="username"
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Login
      </button>

    <div class="message" id="message"></div>

    <div class="info">
      MN Technology Learning System
      <br>
      Secure Admin Login
    </div>

  </div>


  <script>

    // ==============================
    // SUPABASE CONFIG
    // ==============================

    const SUPABASE_URL =
      "https://ekanfqwbqwfhjfgctouk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // ADMIN EMAIL
    // ==============================

    const ADMIN_EMAIL = "Lakshitha94314@gmail.com";


    // ==============================
    // CURRENT LOGIN TYPE
    // ==============================

    let loginType = "student";


    // ==============================
    // SELECT STUDENT / ADMIN
    // ==============================

    function selectType(type) {

      loginType = type;

      const studentBtn =
        document.getElementById("studentBtn");

      const adminBtn =
        document.getElementById("adminBtn");

      if (type === "student") {

        studentBtn.classList.add("active");
        adminBtn.classList.remove("active");

      } else {

        adminBtn.classList.add("active");
        studentBtn.classList.remove("active");

      }

      document.getElementById("message").textContent = "";

      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }


    // ==============================
    // LOGIN
    // ==============================

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        const loginBtn =
          document.getElementById("loginBtn");

        message.textContent = "";

        // --------------------------
        // ADMIN LOGIN
        // --------------------------

        if (loginType === "admin") {

          if (username !== "admin") {

            message.style.color = "red";
            message.textContent =
              "Invalid Admin username.";

            return;
          }

          loginBtn.textContent = "Logging in...";
          loginBtn.classList.add("loading");

          try {

            const { data, error } =
              await supabaseClient.auth.signInWithPassword({
                email: ADMIN_EMAIL,
                password: password
              });

            if (error) {
              throw error;
            }

            if (!data.user) {
              throw new Error("Admin user not found.");
            }

            // Check admin table
            const { data: adminRow, error: adminError } =
              await supabaseClient
                .from("admins")
                .select("username")
                .eq("id", data.user.id)
                .maybeSingle();

            if (adminError) {
              await supabaseClient.auth.signOut();
              throw adminError;
            }

            if (!adminRow) {

              await supabaseClient.auth.signOut();

              throw new Error(
                "This account is not registered as an Admin."
              );
            }

            message.style.color = "green";
            message.textContent =
              "Admin login successful.";

            setTimeout(function() {
              window.location.href =
                "admin-dashboard.html";
            }, 500);

          } catch (error) {

            console.error(error);

            message.style.color = "red";
            message.textContent =
              "Admin login failed. Check username/password.";

          } finally {

            loginBtn.textContent = "Login";
            loginBtn.classList.remove("loading");
          }

          return;
        }


        // --------------------------
        // STUDENT LOGIN
        // --------------------------

        if (
          username === "student" &&
          password === "1234"
        ) {

          localStorage.setItem(
            "studentLoggedIn",
            "true"
          );

          localStorage.removeItem(
            "selectedCourse"
          );

          message.style.color = "green";
          message.textContent =
            "Student login successful.";

          setTimeout(function() {
            window.location.href =
              "student-dashboard.html";
          }, 500);

        } else {

          message.style.color = "red";
          message.textContent =
            "Invalid Student username or password.";
        }

      });

  </script>

</body>
</html>
