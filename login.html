<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | MN Technology</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-box {
      width: 55px;
      height: 55px;
      background: #22d3ee;
      color: #051223;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .logo h1 {
      font-size: 24px;
      color: #051223;
    }

    .logo p {
      color: #64748b;
      margin-top: 5px;
    }

    .type-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .type-buttons button {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .type-buttons button.active {
      background: #0ea5e9;
      color: white;
      border-color: #0ea5e9;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-bottom: 16px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #0284c7;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot {
      text-align: center;
      margin-top: 15px;
    }

    .forgot a {
      color: #0284c7;
      text-decoration: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <div class="logo-box">MN</div>
    <h1>MN Technology</h1>
    <p>Login to your account</p>
  </div>

  <div class="type-buttons">
    <button id="studentBtn" class="active">
      Student
    </button>

    <button id="adminBtn">
      Admin
    </button>
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <label for="username">
      Username
    </label>

    <input
      type="text"
      id="username"
      placeholder="Enter username"
      required
      autocomplete="username"
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
      autocomplete="current-password"
    >

    <button
      type="submit"
      class="login-btn"
      id="loginButton"
    >
      Student Login
    </button>

  </form>

  <div class="forgot">
    <a href="forgot-password.html">
      Forgot Password?
    </a>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ekanfqwbqwfhjfgctouk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let loginType = "student";


const studentBtn =
  document.getElementById("studentBtn");

const adminBtn =
  document.getElementById("adminBtn");

const loginButton =
  document.getElementById("loginButton");

const loginForm =
  document.getElementById("loginForm");

const messageBox =
  document.getElementById("message");


function showMessage(text, type = "error") {

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

  messageBox.style.display = "block";
}


studentBtn.addEventListener("click", () => {

  loginType = "student";

  studentBtn.classList.add("active");
  adminBtn.classList.remove("active");

  loginButton.textContent =
    "Student Login";

});


adminBtn.addEventListener("click", () => {

  loginType = "admin";

  adminBtn.classList.add("active");
  studentBtn.classList.remove("active");

  loginButton.textContent =
    "Admin Login";

});


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    messageBox.style.display = "none";

    const username =
      document.getElementById(
        "username"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;


    if (!username || !password) {

      showMessage(
        "Please enter username and password."
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";


    try {

      let email;


      /*
        STUDENT LOGIN

        Admin-created student accounts use:
        username@students.mntechnology.com
      */

      if (loginType === "student") {

        email =
          `${username.toLowerCase()}@students.mntechnology.com`;

      }


      /*
        ADMIN LOGIN

        Admin email is:
        lakshitha94314@gmail.com
      */

      else {

        email =
          username.toLowerCase();

      }


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });


      if (error) {

        throw new Error(
          error.message
        );

      }


      if (!data.user) {

        throw new Error(
          "Login failed."
        );

      }


      /*
        STUDENT
      */

      if (loginType === "student") {

        const {
          data: student,
          error: studentError
        } =
          await supabaseClient
            .from("student_accounts")
            .select("id, username")
            .eq("id", data.user.id)
            .maybeSingle();


        if (
          studentError ||
          !student
        ) {

          await supabaseClient.auth.signOut();

          throw new Error(
            "This account is not a valid student account."
          );

        }


        window.location.href =
          "student-dashboard.html";

        return;
      }


      /*
        ADMIN
      */

      const {
        data: admin,
        error: adminError
      } =
        await supabaseClient
          .from("admins")
          .select("id, username")
          .eq("id", data.user.id)
          .maybeSingle();


      if (
        adminError ||
        !admin
      ) {

        await supabaseClient.auth.signOut();

        throw new Error(
          "This account is not an admin account."
        );

      }


      window.location.href =
        "admin-dashboard.html";

    }

    catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Login failed."
      );

    }

    finally {

      loginButton.disabled = false;

      loginButton.textContent =
        loginType === "student"
          ? "Student Login"
          : "Admin Login";

    }

  }
);

</script>

</body>
</html>
