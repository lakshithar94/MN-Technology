<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | MN Technology</title>

  <!-- Supabase JavaScript Library -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #06152e, #0b4f8a, #06152e);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #0b4f8a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .user-type {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .user-type button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #e9eef5;
      color: #333;
      font-weight: bold;
      cursor: pointer;
    }

    .user-type button.active {
      background: #0b4f8a;
      color: white;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #0b4f8a;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 55px;
    }

    .show-password-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      font-size: 21px;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0b4f8a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: #083c69;
    }

    .forgot-password {
      text-align: center;
      margin-top: 14px;
    }

    .forgot-password a {
      color: #0b4f8a;
      font-weight: bold;
      text-decoration: none;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      min-height: 22px;
      line-height: 1.5;
    }

    .info {
      margin-top: 22px;
      padding: 14px;
      background: #f1f6fb;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
      text-align: center;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
  </style>

</head>

<body>

<div class="login-box">

  <div class="logo">MN Technology</div>

  <div class="subtitle">
    Electronic & Technical Learning
  </div>

  <div class="user-type">

```
<button
  id="studentBtn"
  class="active"
  type="button"
  onclick="selectType('student')">
  Student
</button>

<button
  id="adminBtn"
  type="button"
  onclick="selectType('admin')">
  Admin
</button>
```

  </div>

  <form id="loginForm">

```
<div class="input-group">

  <label for="username">Username</label>

  <input
    type="text"
    id="username"
    placeholder="Enter username"
    required
    autocomplete="username">

</div>

<div class="input-group">

  <label for="password">Password</label>

  <div class="password-wrapper">

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
      autocomplete="current-password">

    <button
      type="button"
      id="showPasswordBtn"
      class="show-password-btn">
      👁️
    </button>

  </div>

</div>

<button
  type="submit"
  class="login-btn"
  id="loginBtn">
  Login
</button>

<div class="forgot-password">
  <a href="forgot-password.html">
    Forgot Password?
  </a>
</div>
```

  </form>

  <div class="message" id="message"></div>

  <div class="info">
    MN Technology Learning System
    <br>
    Secure Admin Login
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://ekanfqwbqwfhjfgctouk.supabase.co";

const SUPABASE_KEY =
   "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrYW5mcXdicXdmaGpmZ2N0b3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODI4MDcsImV4cCI6MjEwNDk1ODgwN30.EjfM_-4NYlD3oPzi66J00CZPAKdyUecTahWo2JGrN_Y";
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const ADMIN_EMAIL =
  "Lakshitha94314@gmail.com";

let loginType = "student";


/* =========================
   SHOW / HIDE PASSWORD
========================= */

const passwordInput =
  document.getElementById("password");

const showPasswordBtn =
  document.getElementById("showPasswordBtn");

showPasswordBtn.addEventListener(
  "click",
  function () {

    if (passwordInput.type === "password") {

      passwordInput.type = "text";
      showPasswordBtn.textContent = "🙈";

    } else {

      passwordInput.type = "password";
      showPasswordBtn.textContent = "👁️";

    }

  }
);


/* =========================
   SELECT LOGIN TYPE
========================= */

function selectType(type) {

  loginType = type;

  document
    .getElementById("studentBtn")
    .classList.toggle(
      "active",
      type === "student"
    );

  document
    .getElementById("adminBtn")
    .classList.toggle(
      "active",
      type === "admin"
    );

  document.getElementById(
    "username"
  ).value = "";

  document.getElementById(
    "password"
  ).value = "";

  document.getElementById(
    "message"
  ).textContent = "";

  passwordInput.type = "password";
  showPasswordBtn.textContent = "👁️";
}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const message =
        document.getElementById("message");

      const loginBtn =
        document.getElementById("loginBtn");


      message.textContent = "";


      /* =====================
         ADMIN LOGIN
      ===================== */

      if (loginType === "admin") {

        if (
          username.toLowerCase() !==
          "admin"
        ) {

          message.style.color = "red";

          message.textContent =
            "Username must be admin.";

          return;
        }


        loginBtn.textContent =
          "Logging in...";

        loginBtn.classList.add(
          "loading"
        );


        try {

          /* AUTH LOGIN */

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({

                email: ADMIN_EMAIL,

                password: password

              });


          if (error) {

            throw new Error(
              "Supabase Auth: " +
              error.message
            );

          }


          if (!data.user) {

            throw new Error(
              "Supabase Auth: User not found."
            );

          }


          /* ADMIN TABLE */

          const {
            data: adminRow,
            error: adminError
          } =
            await supabaseClient
              .from("admins")
              .select("username")
              .eq(
                "id",
                data.user.id
              )
              .maybeSingle();


          if (adminError) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "Admin table: " +
              adminError.message
            );

          }


          if (!adminRow) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "Admin table: No admin record found."
            );

          }


          /* SUCCESS */

          message.style.color =
            "green";

          message.textContent =
            "Admin login successful!";

          setTimeout(
            function() {

              window.location.href =
                "admin-dashboard.html";

            },
            500
          );


        } catch (error) {

          console.error(
            "ADMIN LOGIN ERROR:",
            error
          );

          message.style.color =
            "red";

          message.textContent =
            error.message ||
            "Unknown login error.";

        } finally {

          loginBtn.textContent =
            "Login";

          loginBtn.classList.remove(
            "loading"
          );

        }

        return;
      }


      /* =====================
         STUDENT LOGIN
      ===================== */

      if (
        username.toLowerCase() ===
          "student" &&
        password === "1234"
      ) {

        localStorage.setItem(
          "studentLoggedIn",
          "true"
        );

        localStorage.removeItem(
          "selectedCourse"
        );

        message.style.color =
          "green";

        message.textContent =
          "Student login successful.";

        setTimeout(
          function() {

            window.location.href =
              "student-dashboard.html";

          },
          500
        );

      } else {

        message.style.color =
          "red";

        message.textContent =
          "Invalid Student username or password.";

      }

    }
  );

</script>

</body>
</html>
