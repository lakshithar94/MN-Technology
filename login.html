<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MN Technology">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #071a33, #0a3157);
      color: white;
    }

    .navbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      background: #051223;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #22d3ee;
      color: #071a33;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .home {
      color: #22d3ee;
      text-decoration: none;
      font-weight: bold;
    }

    .login-area {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      color: #172033;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    h1 {
      text-align: center;
      color: #071a33;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
    }

    .types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .type-btn {
      padding: 13px;
      border: 2px solid #d9e1ea;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    .type-btn.active {
      border-color: #22d3ee;
      background: #e9fbff;
      color: #087990;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #cfd8e3;
      border-radius: 9px;
      font-size: 16px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0891b2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .info {
      margin-top: 20px;
      padding: 14px;
      background: #f0f9ff;
      border-radius: 10px;
      color: #155e75;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <nav class="navbar">

    <a href="index.html" class="brand">
      <span class="logo">MN</span>
      <span>MN Technology</span>
    </a>

    <a href="index.html" class="home">Home</a>

  </nav>

  <main class="login-area">

    <div class="login-box">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Sign in to MN Technology
      </p>

      <div class="types">

        <button class="type-btn active" id="studentBtn"
          onclick="selectType('student')">
          🎓 Student
        </button>

        <button class="type-btn" id="adminBtn"
          onclick="selectType('admin')">
          🔐 Admin
        </button>

      </div>

      <form id="loginForm">

        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter your username"
          required>

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required>

        <button type="submit" class="login-btn">
          Student Login
        </button>

      </form>

      <div class="info">
        <b>Student:</b><br>
        Use the username and password provided by your teacher.
        <br><br>
        <b>Admin:</b><br>
        Admin can manage students and lessons.
      </div>

    </div>

  </main><script>

    let accountType = "student";

    function selectType(type) {

      accountType = type;

      const studentBtn = document.getElementById("studentBtn");
      const adminBtn = document.getElementById("adminBtn");
      const loginButton = document.querySelector(".login-btn");

      if (type === "student") {

        studentBtn.classList.add("active");
        adminBtn.classList.remove("active");

        loginButton.textContent = "Student Login";

      } else {

        adminBtn.classList.add("active");
        studentBtn.classList.remove("active");

        loginButton.textContent = "Admin Login";
      }
    }

    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      alert(
        "Login system will be connected to the secure database next."
      );

    });

  </script>

</body>
</html>
