<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | MN Technology</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-box {
      width: 55px;
      height: 55px;
      background: #22d3ee;
      color: #051223;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .logo h1 {
      font-size: 24px;
      color: #051223;
    }

    .logo p {
      color: #64748b;
      margin-top: 5px;
    }

    .type-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .type-buttons button {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .type-buttons button.active {
      background: #0ea5e9;
      color: white;
      border-color: #0ea5e9;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .password-box {
      position: relative;
      width: 100%;
    }

    .password-box input {
      width: 100%;
      padding: 12px 45px 12px 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-bottom: 16px;
      font-size: 15px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-60%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      padding: 3px;
    }

    .password-toggle:hover {
      opacity: 0.7;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-bottom: 16px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #0284c7;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot {
      text-align: center;
      margin-top: 15px;
    }

    .forgot a {
      color: #0284c7;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <div class="logo-box">MN</div>

    <h1>MN Technology</h1>

    <p>Login to your account</p>
  </div>


  <div class="type-buttons">

    <button
      type="button"
      id="studentBtn"
      class="active">
      Student
    </button>

    <button
      type="button"
      id="adminBtn">
      Admin
    </button>

  </div>


  <div
    id="message"
    class="message">
  </div>


  <form id="loginForm">

    <label for="username">
      Username
    </label>

    <input
      type="text"
      id="username"
      placeholder="Enter username"
      required
      autocomplete="username"
    >


    <label for="password">
      Password
    </label>

    <div class="password-box">

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
        autocomplete="current-password"
      >

      <button
        type="button"
        id="togglePassword"
        class="password-toggle"
        aria-label="Show password">
        👁️
      </button>

    </div>


    <button
      type="submit"
      class="login-btn"
      id="loginButton">
      Student Login
    </button>

  </form>


  <div class="forgot">

    <a href="forgot-password.html">
      Forgot Password?
    </a>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://ekanfqwbqwfhjfgctouk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let loginType = "student";


const studentBtn =
  document.getElementById("studentBtn");

const adminBtn =
  document.getElementById("adminBtn");

const loginButton =
  document.getElementById("loginButton");

const loginForm =
  document.getElementById("loginForm");

const messageBox =
  document.getElementById("message");

const passwordInput =
  document.getElementById("password");

const togglePassword =
  document.getElementById("togglePassword");


/* =========================
   PASSWORD SHOW / HIDE
========================= */

togglePassword.addEventListener(
  "click",
  function() {

    if (
      passwordInput.type === "password"
    ) {

      passwordInput.type = "text";

      togglePassword.textContent =
        "🙈";

      togglePassword.setAttribute(
        "aria-label",
        "Hide password"
      );

    } else {

      passwordInput.type =
        "password";

      togglePassword.textContent =
        "👁️";

      togglePassword.setAttribute(
        "aria-label",
        "Show password"
      );

    }

  }
);


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type = "error"
) {

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

  messageBox.style.display =
    "block";
}


/* =========================
   STUDENT BUTTON
========================= */

studentBtn.addEventListener(
  "click",
  function() {

    loginType = "student";

    studentBtn.classList.add(
      "active"
    );

    adminBtn.classList.remove(
      "active"
    );

    loginButton.textContent =
      "Student Login";

    messageBox.style.display =
      "none";

  }
);


/* =========================
   ADMIN BUTTON
========================= */

adminBtn.addEventListener(
  "click",
  function() {

    loginType = "admin";

    adminBtn.classList.add(
      "active"
    );

    studentBtn.classList.remove(
      "active"
    );

    loginButton.textContent =
      "Admin Login";

    messageBox.style.display =
      "none";

  }
);


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    messageBox.style.display =
      "none";


    const username =
      document
        .getElementById("username")
        .value
        .trim();


    const password =
      passwordInput.value;


    if (
      !username ||
      !password
    ) {

      showMessage(
        "Please enter username and password."
      );

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Logging in...";


    try {

      let email;


      /* =========================
         STUDENT LOGIN
      ========================= */

      if (
        loginType === "student"
      ) {

        email =
          `${username.toLowerCase()}@students.mntechnology.com`;

      }


      /* =========================
         ADMIN LOGIN
      ========================= */

      else {

        /*
          Admin login uses the
          real Supabase email.
        */

        if (
          username.toLowerCase() ===
          "admin"
        ) {

          email =
            "lakshitha94314@gmail.com";

        } else {

          email =
            username.toLowerCase();

        }

      }


      /* =========================
         SUPABASE AUTH LOGIN
      ========================= */

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {

        console.error(
          "Supabase Login Error:",
          error
        );

        throw new Error(
          error.message
        );

      }


      if (
        !data ||
        !data.user
      ) {

        throw new Error(
          "Login failed."
        );

      }


      /* =========================
         STUDENT CHECK
      ========================= */

      if (
        loginType === "student"
      ) {

        const {
          data: student,
          error: studentError
        } =
          await supabaseClient
            .from("student_accounts")
            .select(
              "id, username"
            )
            .eq(
              "id",
              data.user.id
            )
            .maybeSingle();


        if (
          studentError ||
          !student
        ) {

          await supabaseClient.auth
            .signOut();

          throw new Error(
            "This account is not a valid student account."
          );

        }


        window.location.href =
          "student-dashboard.html";

        return;

      }


      /* =========================
         ADMIN CHECK
      ========================= */

      const {
        data: admin,
        error: adminError
      } =
        await supabaseClient
          .from("admins")
          .select(
            "id, username"
          )
          .eq(
            "id",
            data.user.id
          )
          .maybeSingle();


      if (
        adminError ||
        !admin
      ) {

        console.error(
          "Admin Check Error:",
          adminError
        );

        await supabaseClient.auth
          .signOut();

        throw new Error(
          "This account is not an admin account."
        );

      }


      /* =========================
         ADMIN DASHBOARD
      ========================= */

      window.location.href =
        "admin-dashboard.html";

    }


    catch (error) {

      console.error(
        "Login Error:",
        error
      );

      showMessage(
        error.message ||
        "Login failed."
      );

    }


    finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        loginType === "student"
          ? "Student Login"
          : "Admin Login";

    }

  }
);

</script>

</body>
</html>
