<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MN Technology - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      min-height: 100vh;
      color: white;
    }

    nav {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      background: rgba(0, 0, 0, 0.25);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #38bdf8;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
      margin: 60px auto;
      padding: 35px;
      background: white;
      color: #111827;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .types {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .type-btn {
      flex: 1;
      padding: 13px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .type-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .info {
      margin-top: 25px;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 10px;
      line-height: 1.7;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .login-container {
        margin: 30px 15px;
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">
      <span>MN</span> Technology
    </div>

    <a href="index.html">Home</a>
  </nav>


  <div class="login-container">

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to MN Technology
    </p>


    <div class="types">

      <button
        type="button"
        class="type-btn active"
        id="studentBtn"
        onclick="selectType('student')">
        🎓 Student
      </button>

      <button
        type="button"
        class="type-btn"
        id="adminBtn"
        onclick="selectType('admin')">
        🔐 Admin
      </button>

    </div>


    <form id="loginForm">

      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        required>


      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required>


      <button
        type="submit"
        class="login-btn"
        id="loginButton">
        Student Login
      </button>

    </form>


    <div id="message" class="message"></div>


    <div class="info">

      <b>Student Login</b><br>
      Username: <b>student</b><br>
      Password: <b>1234</b>

      <br><br>

      <b>Admin Login</b><br>
      Username: <b>admin</b><br>
      Password: <b>admin123</b>

    </div>

  </div>


<script>

  let loginType = "student";


  function selectType(type) {

    loginType = type;

    const studentBtn = document.getElementById("studentBtn");
    const adminBtn = document.getElementById("adminBtn");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    message.innerHTML = "";

    if (type === "student") {

      studentBtn.classList.add("active");
      adminBtn.classList.remove("active");

      loginButton.textContent = "Student Login";

    } else {

      adminBtn.classList.add("active");
      studentBtn.classList.remove("active");

      loginButton.textContent = "Admin Login";

    }
  }


  document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");


      // STUDENT LOGIN
      if (loginType === "student") {

        if (
          username === "student" &&
          password === "1234"
        ) {

          message.style.color = "green";
          message.textContent = "Login successful!";

          setTimeout(function() {

            window.location.href =
              "student-dashboard.html";

          }, 500);

        } else {

          message.style.color = "red";
          message.textContent =
            "Incorrect Student username or password.";

        }

      }


      // ADMIN LOGIN
      else {

        if (
          username === "admin" &&
          password === "admin123"
        ) {

          message.style.color = "green";
          message.textContent = "Login successful!";

          setTimeout(function() {

            window.location.href =
              "admin-dashboard.html";

          }, 500);

        } else {

          message.style.color = "red";
          message.textContent =
            "Incorrect Admin username or password.";

        }

      }

    });

</script>

</body>
</html>
