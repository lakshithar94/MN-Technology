<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MN Electronic Assistant | Learning</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#061429,#09345c 70%,#08213c);color:#fff;font-family:Arial,sans-serif;padding:16px}.shell{max-width:900px;margin:auto;border:1px solid #1a8ac3;border-radius:18px;background:#061b32;overflow:hidden;min-height:calc(100vh - 32px);display:flex;flex-direction:column}header{padding:18px 22px;border-bottom:1px solid #225677;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{letter-spacing:1px;color:#8ceeff}a{color:#d4f5ff;text-decoration:none}.subtitle{padding:12px 22px;color:#b6dff2;font-size:14px;border-bottom:1px solid #18435e}.messages{flex:1;min-height:350px;padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}.bubble{padding:13px 16px;border-radius:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;max-width:90%}.assistant{align-self:flex-start;background:#103956;border:1px solid #235c7e}.student{align-self:flex-end;background:#096b91}.status{min-height:24px;padding:0 22px;color:#ffdc96;font-size:13px}.composer{display:flex;gap:10px;padding:16px 22px 22px;border-top:1px solid #18435e}textarea{flex:1;resize:vertical;min-height:52px;max-height:170px;background:#0c2b45;color:white;border:1px solid #397da1;border-radius:10px;padding:12px;font:inherit}button{background:#29cbea;color:#042338;border:0;border-radius:10px;font-weight:bold;padding:12px 20px;cursor:pointer}button:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}@media(max-width:600px){header{padding:15px}header strong{font-size:14px}.messages{padding:13px}.composer{padding:12px}.bubble{max-width:98%}button{padding:10px}}

/* Chat header — preserves existing chat functions */
header{position:relative;isolation:isolate;min-height:170px;align-items:flex-start;padding:23px 28px;background:radial-gradient(circle at 75% 20%,#158cc466,transparent 45%),linear-gradient(115deg,#041426,#0a4879)}
header:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background:repeating-linear-gradient(90deg,transparent 0 40px,#4de3ff 41px,transparent 42px),repeating-linear-gradient(0deg,transparent 0 40px,#4de3ff 41px,transparent 42px);mask-image:linear-gradient(90deg,transparent,#000)}
.header-title{display:flex;flex-direction:column;gap:15px;padding-top:8px;max-width:70%}.header-title strong{font-size:clamp(17px,2.8vw,25px);line-height:1.3}.header-portrait{position:absolute;right:65px;bottom:0;width:160px;height:155px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 15px #30d6ff88);pointer-events:none}.back-link{position:relative;z-index:2;background:#062b49cc;border:1px solid #3fd5ff80;border-radius:9px;padding:9px 13px;white-space:nowrap}.quota{border-bottom:1px solid #18435e;padding:11px 22px;color:#bdefff;font-size:14px;background:#082640}.quota strong{color:#7ce9ff}.quota[hidden]{display:none}
@media(max-width:600px){header{min-height:135px;padding:14px}.header-title{max-width:65%;gap:9px}.header-title strong{font-size:15px}.header-portrait{right:42px;width:110px;height:115px}.back-link{padding:6px 8px;font-size:12px}.quota{padding:10px 13px}}
</style></head><body><div class="shell"><header><div class="header-title"><strong>MN ELECTRONIC ASSISTANT</strong><div id="welcome">Electronics Learning</div></div><img class="header-portrait" src="mnt-teacher-portrait.png" alt="Your Electronics Teacher"><a class="back-link" href="mn-electronic-assistant.html">← Back</a></header><div class="quota" id="quota" role="status">අද ඉතිරි ප්‍රශ්න ගණන පරීක්ෂා කරමින්...</div><div class="messages" id="messages" role="log" aria-live="polite"><div class="bubble assistant">ආයුබෝවන්! ඉලෙක්ට්‍රොනික විෂය ගැන ඔබේ ප්‍රශ්නය අහන්න.</div></div><div class="status" id="status" role="status">Login පරීක්ෂා කරමින්...</div><form class="composer" id="form"><textarea id="question" maxlength="3000" placeholder="Type your electronics question..." aria-label="Electronics question" disabled required></textarea><button id="send" disabled type="submit">Send</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const endpoint='https://ekanfqwbqwfhjfgctouk.supabase.co/functions/v1/mn-electronic-chat';const supabaseUrl='https://ekanfqwbqwfhjfgctouk.supabase.co';const publishableKey='sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn';const client=window.supabase.createClient(supabaseUrl,publishableKey);const quota=document.getElementById('quota');const status=document.getElementById('status'),question=document.getElementById('question'),send=document.getElementById('send'),form=document.getElementById('form'),messages=document.getElementById('messages');let ready=false,busy=false;
async function refreshQuota(){try{const {data:{session}}=await client.auth.getSession();if(!session?.access_token){quota.textContent='Login අවශ්‍යයි';return;}const response=await fetch(supabaseUrl+'/functions/v1/mn-assistant-status',{method:'POST',headers:{'Content-Type':'application/json','apikey':publishableKey,'Authorization':'Bearer '+session.access_token},body:'{}'});const data=await response.json();if(!response.ok){quota.textContent='ප්‍රශ්න ගණන ලබාගත නොහැක';return;}if(!data.enabled){quota.textContent='Chat Access අක්‍රියයි හෝ කල් ඉකුත් වී ඇත';return;}quota.textContent='අද භාවිත කළ ප්‍රශ්න: '+data.used+' / '+data.daily_limit+'  |  ඉතිරි ප්‍රශ්න: '+data.remaining;}catch(e){console.error(e);quota.textContent='ප්‍රශ්න ගණන ලබාගත නොහැක';}}
function setStatus(message){status.textContent=message;}function addMessage(text,who){const item=document.createElement('div');item.className='bubble '+who;item.textContent=text;messages.appendChild(item);messages.scrollTop=messages.scrollHeight;}function updateControls(){question.disabled=!ready||busy;send.disabled=!ready||busy;}
(async()=>{try{const {data,error}=await client.auth.getUser();if(error||!data.user){location.replace('login.html');return;}const {data:student,error:studentError}=await client.from('student_accounts').select('username').eq('id',data.user.id).maybeSingle();if(studentError||!student){location.replace('login.html');return;}document.getElementById('welcome').textContent='Welcome, '+student.username;ready=true;await refreshQuota();setStatus('ඔබේ ඉලෙක්ට්‍රොනික ප්‍රශ්නය ඇතුළත් කරන්න.');updateControls();}catch(e){console.error(e);setStatus('Login පරීක්ෂාව අසාර්ථකයි. Dashboard එකට ආපසු යන්න.');}})();
form.addEventListener('submit',async(e)=>{e.preventDefault();const message=question.value.trim();if(!ready||busy||!message)return;busy=true;updateControls();addMessage(message,'student');question.value='';setStatus('පිළිතුර සකස් කරමින්...');try{const {data:{session},error:sessionError}=await client.auth.getSession();if(sessionError||!session?.access_token){setStatus('Session අවසන්. නැවත Login වෙන්න.');return;}const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':publishableKey,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({message})});let data={};try{data=await response.json();}catch{}if(!response.ok){const messageForStudent=response.status===403?'Chat Access සක්‍රිය නැහැ, කල් ඉකුත් වී ඇත, නැත්නම් අද ප්‍රශ්න සීමාව අවසන්.':response.status===401?'නැවත Login වෙන්න.':response.status===502?'Learning service එක තාවකාලිකව ලබාගත නොහැක.':'පිළිතුර ලබාගත නොහැකි වුණා. නැවත උත්සාහ කරන්න.';setStatus(messageForStudent);return;}if(typeof data.answer!=='string'||!data.answer.trim()){setStatus('පිළිතුරක් ලැබුණේ නැහැ.');return;}addMessage(data.answer,'assistant');setStatus('තවත් ඉලෙක්ට්‍රොනික ප්‍රශ්නයක් අහන්න.');}catch(error){console.error(error);setStatus('Network ගැටලුවක් ඇති වුණා. නැවත උත්සාහ කරන්න.');}finally{await refreshQuota();busy=false;updateControls();question.focus();}});
})();
</script></body></html>
