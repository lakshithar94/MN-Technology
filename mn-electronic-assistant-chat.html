<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MN Electronic Assistant | Learning</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#061429,#09345c 70%,#08213c);color:#fff;font-family:Arial,sans-serif;padding:16px}.shell{max-width:900px;margin:auto;border:1px solid #1a8ac3;border-radius:18px;background:#061b32;overflow:hidden;min-height:calc(100vh - 32px);display:flex;flex-direction:column}header{position:relative;isolation:isolate;min-height:170px;display:flex;justify-content:space-between;align-items:flex-start;padding:23px 28px;background:radial-gradient(circle at 75% 20%,#158cc466,transparent 45%),linear-gradient(115deg,#041426,#0a4879);border-bottom:1px solid #225677}header:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background:repeating-linear-gradient(90deg,transparent 0 40px,#4de3ff 41px,transparent 42px),repeating-linear-gradient(0deg,transparent 0 40px,#4de3ff 41px,transparent 42px);mask-image:linear-gradient(90deg,transparent,#000)}.header-title{display:flex;flex-direction:column;gap:15px;padding-top:8px;max-width:70%}.header-title strong{font-size:clamp(17px,2.8vw,25px);letter-spacing:1px;color:#8ceeff}.header-portrait{position:absolute;right:65px;bottom:0;width:160px;height:155px;object-fit:contain;object-position:bottom;filter:drop-shadow(0 0 15px #30d6ff88);pointer-events:none}.back-link{position:relative;z-index:2;background:#062b49cc;border:1px solid #3fd5ff80;border-radius:9px;padding:9px 13px;color:#d4f5ff;text-decoration:none;white-space:nowrap}.quota{border-bottom:1px solid #18435e;padding:11px 22px;color:#bdefff;font-size:14px;background:#082640}.messages{flex:1;min-height:350px;padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}.bubble{padding:13px 16px;border-radius:13px;line-height:1.65;overflow-wrap:anywhere;max-width:90%;white-space:pre-wrap}.assistant{align-self:flex-start;background:#103956;border:1px solid #235c7e}.student{align-self:flex-end;background:#096b91}.bubble img{max-width:100%;max-height:280px;border-radius:8px;display:block;margin-top:8px}.bubble .formatted{white-space:normal}.formatted p{margin:7px 0}.formatted ul,.formatted ol{padding-left:23px}.formatted pre{white-space:pre-wrap;overflow:auto;background:#06192b;padding:10px;border-radius:7px}.formatted table{border-collapse:collapse;display:block;overflow-x:auto}.formatted td,.formatted th{border:1px solid #42728d;padding:5px}.status{min-height:24px;padding:0 22px;color:#ffdc96;font-size:13px}.composer{display:flex;gap:10px;padding:16px 22px 22px;border-top:1px solid #18435e;align-items:end}.entry{flex:1;min-width:0}textarea{width:100%;resize:vertical;min-height:52px;max-height:170px;background:#0c2b45;color:white;border:1px solid #397da1;border-radius:10px;padding:12px;font:inherit}.file-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:13px}.file-row input{max-width:220px}button{background:#29cbea;color:#042338;border:0;border-radius:10px;font-weight:bold;padding:12px 20px;cursor:pointer}button:disabled,textarea:disabled,input:disabled{opacity:.55;cursor:not-allowed}@media(max-width:600px){header{min-height:135px;padding:14px}.header-title{max-width:65%;gap:9px}.header-title strong{font-size:15px}.header-portrait{right:42px;width:110px;height:115px}.back-link{padding:6px 8px;font-size:12px}.quota{padding:10px 13px}.messages{padding:13px}.composer{padding:12px}.bubble{max-width:98%}button{padding:10px}}
</style></head><body><div class="shell"><header><div class="header-title"><strong>MN ELECTRONIC ASSISTANT</strong><div id="welcome">Electronics Learning</div></div><img class="header-portrait" src="mnt-teacher-portrait.png" alt="Your Electronics Teacher"><a class="back-link" href="mn-electronic-assistant.html">← Back</a></header><div class="quota" id="quota" role="status">අද ඉතිරි ප්‍රශ්න ගණන පරීක්ෂා කරමින්...</div><div class="messages" id="messages" role="log" aria-live="polite"><div class="bubble assistant">ආයුබෝවන්! ඉලෙක්ට්‍රොනික විෂය ගැන ඔබේ ප්‍රශ්නය අහන්න. පරිපථයක Photo එකක් එකතු කරලා ඒ ගැනත් අහන්න පුළුවන්.</div></div><div class="status" id="status" role="status">Login පරීක්ෂා කරමින්...</div><form class="composer" id="form"><div class="entry"><textarea id="question" maxlength="3000" placeholder="Type your electronics question..." aria-label="Electronics question" disabled required></textarea><div class="file-row"><label for="photo">📷 Photo (JPG / PNG / WebP, up to 4 MB)</label><input type="file" id="photo" accept="image/jpeg,image/png,image/webp" disabled><span id="photoName"></span></div></div><button id="send" disabled type="submit">Send</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script>
(()=>{'use strict';const supabaseUrl='https://ekanfqwbqwfhjfgctouk.supabase.co',publishableKey='sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn',client=window.supabase.createClient(supabaseUrl,publishableKey);const quota=document.getElementById('quota'),status=document.getElementById('status'),question=document.getElementById('question'),send=document.getElementById('send'),photo=document.getElementById('photo'),photoName=document.getElementById('photoName'),form=document.getElementById('form'),messages=document.getElementById('messages');let ready=false,busy=false;
function setStatus(s){status.textContent=s}function updateControls(){question.disabled=photo.disabled=send.disabled=!ready||busy}function addMessage(text,who,imageUrl){const item=document.createElement('div');item.className='bubble '+who;if(who==='assistant'&&window.marked&&window.DOMPurify){const inner=document.createElement('div');inner.className='formatted';inner.innerHTML=window.DOMPurify.sanitize(window.marked.parse(text));item.appendChild(inner)}else{item.appendChild(document.createTextNode(text))}if(imageUrl){const img=document.createElement('img');img.src=imageUrl;img.alt='Student uploaded electronics photo';item.appendChild(img)}messages.appendChild(item);messages.scrollTop=messages.scrollHeight}
async function getToken(){const {data:{session},error}=await client.auth.getSession();if(error||!session?.access_token)throw new Error('Session expired');return session.access_token}
async function refreshQuota(){try{const token=await getToken();const r=await fetch(supabaseUrl+'/functions/v1/mn-assistant-status',{method:'POST',headers:{'Content-Type':'application/json','apikey':publishableKey,'Authorization':'Bearer '+token},body:'{}'});const d=await r.json();if(!r.ok){quota.textContent='ප්‍රශ්න ගණන ලබාගත නොහැක';return}if(!d.enabled){quota.textContent='Chat Access අක්‍රියයි හෝ කල් ඉකුත් වී ඇත';return}quota.textContent='Text: '+d.used+' / '+d.daily_limit+' | ඉතිරි: '+d.remaining+'   •   Images: '+(d.image_used??0)+' / '+(d.image_daily_limit??0)+' | ඉතිරි: '+(d.image_remaining??0)}catch(e){console.error(e);quota.textContent='ප්‍රශ්න ගණන ලබාගත නොහැක'}}
photo.addEventListener('change',()=>{const f=photo.files?.[0];photoName.textContent=f?f.name:''});
function toBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Photo read failed'));reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(file)})}
(async()=>{try{const {data,error}=await client.auth.getUser();if(error||!data.user){location.replace('login.html');return}const {data:student,error:studentError}=await client.from('student_accounts').select('username').eq('id',data.user.id).maybeSingle();if(studentError||!student){location.replace('login.html');return}document.getElementById('welcome').textContent='Welcome, '+student.username;ready=true;await refreshQuota();setStatus('ඔබේ ඉලෙක්ට්‍රොනික ප්‍රශ්නය ඇතුළත් කරන්න.');updateControls()}catch(e){console.error(e);setStatus('Login පරීක්ෂාව අසාර්ථකයි.')}})();
form.addEventListener('submit',async e=>{e.preventDefault();const message=question.value.trim();if(!ready||busy||!message)return;const file=photo.files?.[0];if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>4*1024*1024)){setStatus('JPG / PNG / WebP Photo එකක් 4 MB ට අඩුවෙන් තෝරන්න.');return}busy=true;updateControls();let previewUrl=null;try{const token=await getToken();const body={message};if(file){body.image={mimeType:file.type,data:await toBase64(file)};previewUrl=URL.createObjectURL(file)}addMessage(message,'student',previewUrl);question.value='';photo.value='';photoName.textContent='';setStatus('පිළිතුර සකස් කරමින්...');const r=await fetch(supabaseUrl+'/functions/v1/mn-electronic-chat',{method:'POST',headers:{'Content-Type':'application/json','apikey':publishableKey,'Authorization':'Bearer '+token},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok){setStatus(r.status===403?'Chat Access අක්‍රියයි හෝ අද සීමාව අවසන්.':r.status===401?'නැවත Login වෙන්න.':'Learning service එක තාවකාලිකව ලබාගත නොහැක. නැවත උත්සාහ කරන්න.');return}if(typeof d.answer!=='string'||!d.answer.trim()){setStatus('පිළිතුරක් ලැබුණේ නැහැ.');return}addMessage(d.answer,'assistant');setStatus('තවත් ඉලෙක්ට්‍රොනික ප්‍රශ්නයක් අහන්න.')}catch(err){console.error(err);setStatus('Network ගැටලුවක් ඇති වුණා. නැවත උත්සාහ කරන්න.')}finally{await refreshQuota();busy=false;updateControls();question.focus()}});
})();
</script></body></html>
