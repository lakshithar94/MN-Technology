<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password | MN Technology</title>


  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background:
        linear-gradient(
          135deg,
          #06152e,
          #0b4f8a,
          #06152e
        );

      padding: 20px;

    }


    .box {

      width: 100%;

      max-width: 420px;

      background: white;

      border-radius: 20px;

      padding: 35px 30px;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.35);

    }


    .logo {

      text-align: center;

      font-size: 28px;

      font-weight: bold;

      color: #0b4f8a;

      margin-bottom: 15px;

    }


    h2 {

      text-align: center;

      color: #333;

      margin-bottom: 10px;

    }


    .text {

      text-align: center;

      color: #777;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 25px;

    }


    label {

      display: block;

      font-weight: bold;

      margin-bottom: 7px;

      color: #333;

    }


    input {

      width: 100%;

      padding: 14px;

      border: 1px solid #ccc;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

      margin-bottom: 15px;

    }


    input:focus {

      border-color: #0b4f8a;

    }


    button {

      width: 100%;

      padding: 14px;

      margin-top: 5px;

      border: none;

      border-radius: 10px;

      background: #0b4f8a;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {

      background: #083c69;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .message {

      text-align: center;

      margin-top: 18px;

      font-weight: bold;

      line-height: 1.5;

    }


    .back {

      display: block;

      text-align: center;

      margin-top: 20px;

      color: #0b4f8a;

      text-decoration: none;

      font-weight: bold;

    }


    .back:hover {

      text-decoration: underline;

    }


    #resetForm {

      display: none;

    }


    #loading {

      text-align: center;

      color: #555;

      line-height: 1.6;

    }

  </style>

</head>


<body>


  <div class="box">


    <div class="logo">
      MN Technology
    </div>


    <h2>
      Reset Password
    </h2>


    <div class="text">
      Create a new password for your account
    </div>


    <!-- Loading message -->

    <div id="loading">

      Checking password reset link...

    </div>


    <!-- Reset form -->

    <form id="resetForm">


      <label for="password">
        New Password
      </label>


      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <label for="confirmPassword">
        Confirm New Password
      </label>


      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <button
        type="submit"
        id="resetBtn"
      >
        Update Password
      </button>


    </form>


    <!-- Message -->

    <div
      class="message"
      id="message"
    ></div>


    <a
      href="login.html"
      class="back"
    >
      ← Back to Login
    </a>


  </div>


  <script>


    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://ekanfqwbqwfhjfgctouk.supabase.co";


    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrYW5mcXdicXdmaGpmZ2N0b3VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODI4MDcsImV4cCI6MjEwNDk1ODgwN30.EjfM_-4NYuLdoPzi66J00CZPAKdyUecTahWo2JGrN_Y";


    // ==========================================
    // CREATE SUPABASE CLIENT
    // ==========================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const loading =
      document.getElementById("loading");


    const form =
      document.getElementById("resetForm");


    const password =
      document.getElementById("password");


    const confirmPassword =
      document.getElementById("confirmPassword");


    const resetBtn =
      document.getElementById("resetBtn");


    const message =
      document.getElementById("message");


    // ==========================================
    // SHOW ERROR
    // ==========================================

    function showError(text) {

      loading.style.display = "none";

      form.style.display = "none";

      message.style.color = "red";

      message.textContent = text;

    }


    // ==========================================
    // SHOW RESET FORM
    // ==========================================

    function showResetForm() {

      loading.style.display = "none";

      form.style.display = "block";

      message.textContent = "";

    }


    // ==========================================
    // CHECK URL FOR AUTH ERRORS
    // ==========================================

    function checkUrlErrors() {

      const hash =
        window.location.hash;


      const search =
        window.location.search;


      const combined =
        hash + "&" + search;


      const params =
        new URLSearchParams(
          combined.replace(/^#/, "")
        );


      const error =
        params.get("error");


      const errorCode =
        params.get("error_code");


      const errorDescription =
        params.get("error_description");


      if (error || errorCode) {

        console.error(
          "Supabase recovery error:",
          error,
          errorCode,
          errorDescription
        );


        showError(
          "This reset link is invalid or has expired. Please request a new reset link."
        );


        return true;

      }


      return false;

    }


    // ==========================================
    // PASSWORD RECOVERY EVENT
    // ==========================================

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Auth event:",
          event
        );


        if (
          event === "PASSWORD_RECOVERY"
          &&
          session
        ) {

          console.log(
            "Password recovery session found."
          );


          showResetForm();

        }

      }
    );


    // ==========================================
    // CHECK CURRENT SESSION
    // ==========================================

    async function checkSession() {

      try {

        // First check URL errors

        if (checkUrlErrors()) {

          return;

        }


        // Get current session

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(error);

          showError(
            "Unable to verify the password reset link."
          );

          return;

        }


        const session =
          data.session;


        if (session) {

          console.log(
            "Session found."
          );


          showResetForm();

          return;

        }


        // Wait briefly for PASSWORD_RECOVERY
        // event to arrive

        setTimeout(
          async () => {

            const {
              data: retryData
            } =
              await supabaseClient.auth.getSession();


            if (
              retryData &&
              retryData.session
            ) {

              showResetForm();

            } else {

              showError(
                "This reset link is invalid or has expired. Please request a new reset link."
              );

            }

          },
          1500
        );


      } catch (error) {

        console.error(
          "Session check error:",
          error
        );


        showError(
          "Unable to verify the reset link."
        );

      }

    }


    // ==========================================
    // UPDATE PASSWORD
    // ==========================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const newPassword =
          password.value;


        const confirmPasswordValue =
          confirmPassword.value;


        // Check password length

        if (
          newPassword.length < 6
        ) {

          message.style.color = "red";

          message.textContent =
            "Password must be at least 6 characters.";

          return;

        }


        // Check matching passwords

        if (
          newPassword !==
          confirmPasswordValue
        ) {

          message.style.color = "red";

          message.textContent =
            "Passwords do not match.";

          return;

        }


        resetBtn.disabled = true;

        resetBtn.textContent =
          "Updating...";


        message.textContent = "";


        try {

          // ====================================
          // UPDATE SUPABASE PASSWORD
          // ====================================

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .updateUser({

                password:
                  newPassword

              });


          if (error) {

            throw error;

          }


          console.log(
            "Password updated:",
            data
          );


          // ====================================
          // SUCCESS
          // ====================================

          message.style.color =
            "green";


          message.textContent =
            "Password updated successfully! Redirecting to login...";


          // Sign out recovery session

          await supabaseClient.auth.signOut();


          // Redirect to login

          setTimeout(
            () => {

              window.location.href =
                "login.html";

            },
            2000
          );


        } catch (error) {

          console.error(
            "Password update error:",
            error
          );


          message.style.color =
            "red";


          message.textContent =
            error.message ||
            "Failed to update password.";


          resetBtn.disabled =
            false;


          resetBtn.textContent =
            "Update Password";

        }

      }
    );


    // ==========================================
    // START
    // ==========================================

    checkSession();


  </script>

</body>

</html>
