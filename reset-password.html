<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | MN Technology</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        135deg,
        #06152e,
        #0b4f8a,
        #06152e
      );
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #0b4f8a;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b4f8a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0b4f8a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #083c69;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .back-login {
      text-align: center;
      margin-top: 20px;
    }

    .back-login a {
      color: #0b4f8a;
      text-decoration: none;
      font-weight: bold;
    }

    .back-login a:hover {
      text-decoration: underline;
    }

    #passwordArea {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      MN Technology
    </div>

    <h2>
      Reset Password
    </h2>

    <div class="subtitle">
      Create a new password for your account
    </div>


    <div id="passwordArea">

      <form id="passwordForm">

        <div class="input-group">

          <label for="password">
            New Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="6"
            required
            autocomplete="new-password"
          >

        </div>


        <div class="input-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            required
            autocomplete="new-password"
          >

        </div>


        <button
          type="submit"
          id="updateBtn"
        >
          Update Password
        </button>

      </form>

    </div>


    <div
      class="message"
      id="message"
    >
      Checking reset link...
    </div>


    <div class="back-login">

      <a href="login.html">
        Back to Login
      </a>

    </div>

  </div>


  <script>

    // =====================================
    // SUPABASE CONFIG
    // =====================================

    const SUPABASE_URL =
      "https://ekanfqwbqwfhjfgctouk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tpFTptBWglmisRRHQiptmg_VkKhJdDn";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =====================================
    // ELEMENTS
    // =====================================

    const passwordArea =
      document.getElementById("passwordArea");

    const form =
      document.getElementById("passwordForm");

    const message =
      document.getElementById("message");

    const updateBtn =
      document.getElementById("updateBtn");


    // =====================================
    // SHOW ERROR
    // =====================================

    function showError(text) {

      message.style.color = "red";

      message.textContent = text;

      passwordArea.style.display = "none";
    }


    // =====================================
    // SHOW PASSWORD FORM
    // =====================================

    function showPasswordForm() {

      message.style.color = "#0b4f8a";

      message.textContent =
        "Enter your new password below.";

      passwordArea.style.display = "block";
    }


    // =====================================
    // AUTH STATE CHANGE
    // =====================================

    supabaseClient.auth.onAuthStateChange(
      async function(event, session) {

        console.log(
          "Auth event:",
          event,
          session
        );


        if (event === "PASSWORD_RECOVERY") {

          if (session) {

            showPasswordForm();

          } else {

            showError(
              "Reset link is invalid or expired. Please request a new reset link."
            );

          }

        }

      }
    );


    // =====================================
    // CHECK EXISTING SESSION
    // =====================================

    async function checkSession() {

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.getSession();


        if (error) {

          console.error(error);

          showError(
            "Unable to verify the reset link."
          );

          return;

        }


        if (data && data.session) {

          showPasswordForm();

          return;

        }


        // Give Supabase a moment to process
        // the recovery URL.

        setTimeout(async function() {

          const {
            data: retryData
          } = await supabaseClient.auth.getSession();


          if (
            retryData &&
            retryData.session
          ) {

            showPasswordForm();

          } else {

            showError(
              "This reset link is invalid or has expired. Please request a new reset link."
            );

          }

        }, 1000);


      } catch (error) {

        console.error(error);

        showError(
          "Something went wrong while checking the reset link."
        );

      }

    }


    checkSession();


    // =====================================
    // UPDATE PASSWORD
    // =====================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const password =
          document
            .getElementById("password")
            .value;


        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        message.textContent = "";


        // Password match

        if (
          password !== confirmPassword
        ) {

          message.style.color = "red";

          message.textContent =
            "Passwords do not match.";

          return;

        }


        // Minimum length

        if (
          password.length < 6
        ) {

          message.style.color = "red";

          message.textContent =
            "Password must be at least 6 characters.";

          return;

        }


        updateBtn.disabled = true;

        updateBtn.textContent =
          "Updating...";


        try {

          // Check session first

          const {
            data: sessionData
          } =
            await supabaseClient.auth.getSession();


          if (
            !sessionData ||
            !sessionData.session
          ) {

            throw new Error(
              "Your reset session is missing or expired. Please request a new reset link."
            );

          }


          // Update password

          const {
            data,
            error
          } =
            await supabaseClient.auth.updateUser({

              password: password

            });


          if (error) {

            throw error;

          }


          console.log(
            "Password update:",
            data
          );


          message.style.color = "green";

          message.textContent =
            "Password updated successfully! Redirecting to login...";


          setTimeout(
            async function() {

              await supabaseClient.auth.signOut();

              window.location.href =
                "login.html";

            },
            1500
          );


        } catch (error) {

          console.error(error);

          message.style.color = "red";

          message.textContent =
            error.message ||
            "Failed to update password.";

          updateBtn.disabled = false;

          updateBtn.textContent =
            "Update Password";

        }

      }
    );

  </script>

</body>
</html>
