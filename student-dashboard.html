<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Dashboard | MN Technology</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {
      background: #f4f7fb;
      color: #172033;
    }


    nav {
      background: #051223;
      color: white;
      padding: 15px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 20px;
      font-weight: bold;
    }


    .logo-box {
      width: 42px;
      height: 42px;

      background: #22d3ee;
      color: #051223;

      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
    }


    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }


    .username-display {
      color: #cbd5e1;
    }


    .logout-btn {
      background: #ef4444;
      border: none;
      color: white;

      padding: 9px 15px;
      border-radius: 7px;

      cursor: pointer;
    }


    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }


    .welcome {
      background: white;
      padding: 25px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

      margin-bottom: 25px;
    }


    .welcome h1 {
      margin-bottom: 8px;
    }


    .welcome p {
      color: #64748b;
    }


    .section {
      background: white;
      padding: 25px;

      border-radius: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

      margin-bottom: 25px;
    }


    .section h2 {
      margin-bottom: 20px;
    }


    .lesson {
      border: 1px solid #e5e7eb;

      border-radius: 10px;

      padding: 20px;

      margin-bottom: 18px;
    }


    .lesson:last-child {
      margin-bottom: 0;
    }


    .lesson h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }


    .course {
      color: #0284c7;
      font-weight: bold;
      margin-bottom: 10px;
    }


    .description {
      color: #64748b;
      margin-bottom: 15px;
      line-height: 1.5;
    }


    video {
      width: 100%;
      max-width: 800px;

      display: block;

      background: black;

      border-radius: 10px;
    }


    .no-lessons {
      color: #64748b;
      text-align: center;
      padding: 30px;
    }


    .password-form {
      max-width: 500px;
    }


    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }


    input {
      width: 100%;

      padding: 12px;

      border: 1px solid #d1d5db;

      border-radius: 7px;

      margin-bottom: 15px;

      font-size: 15px;
    }


    .change-btn {
      background: #0ea5e9;
      color: white;

      border: none;

      padding: 12px 20px;

      border-radius: 7px;

      font-weight: bold;

      cursor: pointer;
    }


    .change-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    .message {
      display: none;

      padding: 12px;

      border-radius: 7px;

      margin-bottom: 15px;
    }


    .success {
      background: #dcfce7;
      color: #166534;
    }


    .error {
      background: #fee2e2;
      color: #991b1b;
    }


    @media (max-width: 700px) {

      nav {
        padding: 12px 15px;
      }

      .logo span {
        display: none;
      }

      .nav-right {
        gap: 8px;
      }

      .username-display {
        font-size: 13px;
      }

      .container {
        padding: 0 12px;
      }

    }

  </style>

</head>


<body>


<nav>

  <div class="logo">

    <div class="logo-box">
      MN
    </div>

    <span>
      MN Technology
    </span>

  </div>


  <div class="nav-right">

    <span
      class="username-display"
      id="navUsername"
    >
      Student
    </span>


    <button
      class="logout-btn"
      id="logoutBtn"
    >
      Logout
    </button>

  </div>

</nav>


<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h1>
      Welcome, <span id="welcomeUsername">
        Student
      </span>!
    </h1>

    <p>
      Select a lesson below and start learning.
    </p>

  </div>


  <!-- LESSONS -->

  <div class="section">

    <h2>
      📚 Available Lessons
    </h2>

    <div id="lessonsList">

      <p class="no-lessons">
        Loading lessons...
      </p>

    </div>

  </div>


  <!-- PASSWORD -->

  <div class="section">

    <h2>
      🔐 Change Password
    </h2>


    <div id="passwordMessage"
         class="message">
    </div>


    <form
      id="passwordForm"
      class="password-form"
    >

      <label for="newPassword">
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <button
        type="submit"
        class="change-btn"
        id="changePasswordBtn"
      >
        Change Password
      </button>

    </form>

  </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================
   SUPABASE
===================================== */


const SUPABASE_URL =
  "https://ekanfqwbqwfhjfgctouk.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   ELEMENTS
===================================== */


const lessonsList =
  document.getElementById(
    "lessonsList"
  );


const navUsername =
  document.getElementById(
    "navUsername"
  );


const welcomeUsername =
  document.getElementById(
    "welcomeUsername"
  );


const passwordForm =
  document.getElementById(
    "passwordForm"
  );


const passwordMessage =
  document.getElementById(
    "passwordMessage"
  );


/* =====================================
   MESSAGE
===================================== */


function showPasswordMessage(
  text,
  type
) {

  passwordMessage.textContent =
    text;

  passwordMessage.className =
    "message " + type;

  passwordMessage.style.display =
    "block";

}


/* =====================================
   LOAD STUDENT
===================================== */


async function loadStudent() {

  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth
      .getSession();


  if (
    sessionError ||
    !sessionData.session
  ) {

    window.location.href =
      "login.html";

    return null;
  }


  const user =
    sessionData.session.user;


  const {
    data: student,
    error
  } =
    await supabaseClient
      .from("student_accounts")
      .select("id, username")
      .eq("id", user.id)
      .maybeSingle();


  if (
    error ||
    !student
  ) {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

    return null;
  }


  navUsername.textContent =
    student.username;


  welcomeUsername.textContent =
    student.username;


  return student;

}


/* =====================================
   LOAD LESSONS
===================================== */


async function loadLessons() {

  lessonsList.innerHTML =
    '<p class="no-lessons">Loading lessons...</p>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("lessons")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    lessonsList.innerHTML =
      '<p class="no-lessons">Could not load lessons.</p>';

    return;
  }


  if (!data || data.length === 0) {

    lessonsList.innerHTML =
      '<p class="no-lessons">No lessons available yet.</p>';

    return;
  }


  lessonsList.innerHTML = "";


  data.forEach(lesson => {


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "lesson";


    let videoHtml = "";


    if (lesson.video_path) {


      const {
        data: publicUrlData
      } =
        supabaseClient.storage
          .from("Video")
          .getPublicUrl(
            lesson.video_path
          );


      const videoUrl =
        publicUrlData.publicUrl;


      videoHtml = `

        <video
          controls
          preload="metadata"
        >

          <source
            src="${videoUrl}"
            type="video/mp4"
          >

          Your browser does not support
          HTML5 video.

        </video>

      `;

    }


    item.innerHTML = `

      <h3>
        ${escapeHtml(lesson.title)}
      </h3>

      <div class="course">
        Course:
        ${escapeHtml(lesson.course)}
      </div>

      <div class="description">
        ${escapeHtml(
          lesson.description || ""
        )}
      </div>

      ${videoHtml}

    `;


    lessonsList.appendChild(
      item
    );

  });

}


/* =====================================
   CHANGE PASSWORD
===================================== */


passwordForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const newPassword =
      document.getElementById(
        "newPassword"
      ).value;


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      ).value;


    if (newPassword.length < 6) {

      showPasswordMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;
    }


    if (
      newPassword !==
      confirmPassword
    ) {

      showPasswordMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById(
        "changePasswordBtn"
      );


    button.disabled = true;

    button.textContent =
      "Changing...";


    try {


      const {
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password:
              newPassword
          });


      if (error) {

        throw error;

      }


      showPasswordMessage(
        "Password changed successfully!",
        "success"
      );


      passwordForm.reset();


    }
    catch (error) {

      console.error(error);


      showPasswordMessage(
        error.message ||
        "Could not change password.",
        "error"
      );

    }
    finally {

      button.disabled = false;

      button.textContent =
        "Change Password";

    }

  }
);


/* =====================================
   LOGOUT
===================================== */


document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

  }
);


/* =====================================
   HTML ESCAPE
===================================== */


function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   START
===================================== */


(async function() {

  const student =
    await loadStudent();


  if (!student) return;


  await loadLessons();

})();

</script>


</body>
</html>
