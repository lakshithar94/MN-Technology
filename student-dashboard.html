<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Dashboard | MN Technology</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    nav {
      background: #051223;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      background: #22d3ee;
      color: #051223;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .username-display {
      color: #cbd5e1;
    }

    .logout-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #64748b;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    .course-section {
      margin-bottom: 30px;
    }

    .course-title {
      background: #051223;
      color: white;
      padding: 14px 18px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 19px;
    }

    .course-locked {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      margin-bottom: 15px;
    }

    .lock-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .course-locked h3 {
      margin-bottom: 8px;
      color: #334155;
    }

    .course-locked p {
      color: #64748b;
    }

    .lesson {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .lesson:last-child {
      margin-bottom: 0;
    }

    .lesson h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .course {
      color: #0284c7;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: black;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
      background: black;
      border-radius: 10px;
    }

    /*
      WATERMARK
    */

    .video-watermark {
      position: absolute;

      color: rgba(255,255,255,0.65);

      font-size: 15px;
      font-weight: bold;

      padding: 6px 10px;

      background: rgba(0,0,0,0.20);

      border-radius: 5px;

      pointer-events: none;

      user-select: none;

      z-index: 10;

      transition:
        top 1s ease,
        left 1s ease,
        right 1s ease,
        bottom 1s ease;

      white-space: nowrap;
    }

    .no-lessons {
      color: #64748b;
      text-align: center;
      padding: 30px;
    }

    .password-form {
      max-width: 500px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .change-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .change-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 700px) {

      nav {
        padding: 12px 15px;
      }

      .logo span {
        display: none;
      }

      .nav-right {
        gap: 8px;
      }

      .username-display {
        font-size: 13px;
      }

      .container {
        padding: 0 12px;
      }

      .video-watermark {
        font-size: 11px;
        padding: 4px 7px;
      }

    }

  </style>

</head>


<body>


<nav>

  <div class="logo">

    <div class="logo-box">
      MN
    </div>

    <span>
      MN Technology
    </span>

  </div>


  <div class="nav-right">

    <span
      class="username-display"
      id="navUsername"
    >
      Student
    </span>


    <button
      class="logout-btn"
      id="logoutBtn"
    >
      Logout
    </button>

  </div>

</nav>


<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h1>
      Welcome,
      <span id="welcomeUsername">
        Student
      </span>!
    </h1>

    <p>
      Select a lesson below and start learning.
    </p>

  </div>


  <!-- LESSONS -->

  <div class="section">

    <h2>
      📚 Available Lessons
    </h2>

    <div id="lessonsList">

      <p class="no-lessons">
        Loading lessons...
      </p>

    </div>

  </div>


  <!-- PASSWORD -->

  <div class="section">

    <h2>
      🔐 Change Password
    </h2>


    <div
      id="passwordMessage"
      class="message">
    </div>


    <form
      id="passwordForm"
      class="password-form"
    >

      <label for="newPassword">
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
        autocomplete="new-password"
      >


      <button
        type="submit"
        class="change-btn"
        id="changePasswordBtn"
      >
        Change Password
      </button>

    </form>

  </div>


</div>


<!-- IMPORTANT: lowercase @supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================
   SUPABASE
===================================== */


const SUPABASE_URL =
  "https://ekanfqwbqwfhjfgctouk.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   ELEMENTS
===================================== */


const lessonsList =
  document.getElementById(
    "lessonsList"
  );


const navUsername =
  document.getElementById(
    "navUsername"
  );


const welcomeUsername =
  document.getElementById(
    "welcomeUsername"
  );


const passwordForm =
  document.getElementById(
    "passwordForm"
  );


const passwordMessage =
  document.getElementById(
    "passwordMessage"
  );


/* =====================================
   CURRENT STUDENT
===================================== */


let CURRENT_STUDENT = null;


/* =====================================
   MESSAGE
===================================== */


function showPasswordMessage(
  text,
  type
) {

  passwordMessage.textContent =
    text;

  passwordMessage.className =
    "message " + type;

  passwordMessage.style.display =
    "block";

}


/* =====================================
   LOAD STUDENT
===================================== */


async function loadStudent() {


  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth
      .getSession();


  if (
    sessionError ||
    !sessionData.session
  ) {

    window.location.href =
      "login.html";

    return null;

  }


  const user =
    sessionData.session.user;


  const {
    data: student,
    error
  } =
    await supabaseClient
      .from("student_accounts")
      .select(
        "id, username, course_access"
      )
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (
    error ||
    !student
  ) {

    console.error(error);

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

    return null;

  }


  CURRENT_STUDENT =
    student;


  navUsername.textContent =
    student.username;


  welcomeUsername.textContent =
    student.username;


  return student;

}


/* =====================================
   LOAD COURSES
===================================== */


async function loadCourses() {


  const {
    data: courses,
    error: courseError
  } =
    await supabaseClient
      .from("courses")
      .select("id, name")
      .order(
        "id",
        {
          ascending: true
        }
      );


  if (courseError) {

    console.error(courseError);

    lessonsList.innerHTML =
      '<p class="no-lessons">Could not load courses.</p>';

    return;

  }


  if (
    !courses ||
    courses.length === 0
  ) {

    lessonsList.innerHTML =
      '<p class="no-lessons">No courses available yet.</p>';

    return;

  }


  const {
    data: lessons,
    error: lessonError
  } =
    await supabaseClient
      .from("lessons")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (lessonError) {

    console.error(lessonError);

    lessonsList.innerHTML =
      '<p class="no-lessons">Could not load lessons.</p>';

    return;

  }


  /*
    Student course access
  */

  const access =
    Array.isArray(
      CURRENT_STUDENT.course_access
    )
      ? CURRENT_STUDENT.course_access
      : [];


  lessonsList.innerHTML = "";


  courses.forEach(
    course => {


      const courseName =
        course.name;


      const hasAccess =
        access.includes(
          courseName
        );


      const courseBox =
        document.createElement(
          "div"
        );


      courseBox.className =
        "course-section";


      /*
        COURSE TITLE
      */

      const title =
        document.createElement(
          "div"
        );


      title.className =
        "course-title";


      title.textContent =
        hasAccess
          ? "📚 " + courseName
          : "🔒 " + courseName;


      courseBox.appendChild(
        title
      );


      /*
        LOCKED COURSE
      */

      if (!hasAccess) {

        const locked =
          document.createElement(
            "div"
          );


        locked.className =
          "course-locked";


        locked.innerHTML = `

          <div class="lock-icon">
            🔒
          </div>

          <h3>
            Course Locked
          </h3>

          <p>
            You don't have access to this course yet.
          </p>

          <p style="margin-top:8px;">
            Please contact the administrator to get access.
          </p>

        `;


        courseBox.appendChild(
          locked
        );


        lessonsList.appendChild(
          courseBox
        );


        return;

      }


      /*
        OPEN COURSE
      */

      const courseLessons =
        lessons.filter(
          lesson =>
            lesson.course ===
            courseName
        );


      if (
        courseLessons.length === 0
      ) {

        const noLesson =
          document.createElement(
            "div"
          );


        noLesson.className =
          "no-lessons";


        noLesson.textContent =
          "No lessons available in this course yet.";


        courseBox.appendChild(
          noLesson
        );

      }
      else {

        courseLessons.forEach(
          lesson => {

            courseBox.appendChild(
              createLessonElement(
                lesson
              )
            );

          }
        );

      }


      lessonsList.appendChild(
        courseBox
      );

    }
  );

}


/* =====================================
   CREATE LESSON
===================================== */


function createLessonElement(
  lesson
) {


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "lesson";


  const title =
    document.createElement(
      "h3"
    );


  title.textContent =
    lesson.title || "";


  const course =
    document.createElement(
      "div"
    );


  course.className =
    "course";


  course.textContent =
    "Course: " +
    (lesson.course || "");


  const description =
    document.createElement(
      "div"
    );


  description.className =
    "description";


  description.textContent =
    lesson.description || "";


  item.appendChild(
    title
  );


  item.appendChild(
    course
  );


  item.appendChild(
    description
  );


  /*
    VIDEO
  */

  if (lesson.video_path) {

    const videoWrapper =
      document.createElement(
        "div"
      );


    videoWrapper.className =
      "video-wrapper";


    const video =
      document.createElement(
        "video"
      );


    video.controls = true;

    video.preload =
      "metadata";

    /*
      Hide browser download button
      where supported.
    */

    video.setAttribute(
      "controlsList",
      "nodownload noremoteplayback"
    );

    video.setAttribute(
      "disablePictureInPicture",
      ""
    );


    /*
      Prevent right-click
      on video.
    */

    video.addEventListener(
      "contextmenu",
      function(event) {

        event.preventDefault();

      }
    );


    /*
      WATERMARK
    */

    const watermark =
      document.createElement(
        "div"
      );


    watermark.className =
      "video-watermark";


    watermark.textContent =
      "MN TECHNOLOGY • " +
      CURRENT_STUDENT.username;


    videoWrapper.appendChild(
      video
    );


    videoWrapper.appendChild(
      watermark
    );


    item.appendChild(
      videoWrapper
    );


    /*
      Load private video
      with signed URL.
    */

    loadSecureVideo(
      lesson.video_path,
      video
    );


    /*
      Move watermark.
    */

    startWatermarkMovement(
      watermark,
      videoWrapper
    );

  }


  return item;

}


/* =====================================
   SECURE VIDEO
===================================== */


async function loadSecureVideo(
  videoPath,
  videoElement
) {


  try {


    const {
      data,
      error
    } =
      await supabaseClient.storage
        .from("Video")
        .createSignedUrl(
          videoPath,
          7200
        );


    if (error) {

      console.error(
        "Video signed URL error:",
        error
      );

      videoElement.outerHTML =
        '<p style="color:#991b1b;padding:15px;">Unable to load this video.</p>';

      return;

    }


    if (
      !data ||
      !data.signedUrl
    ) {

      videoElement.outerHTML =
        '<p style="color:#991b1b;padding:15px;">Video URL could not be created.</p>';

      return;

    }


    /*
      Add signed URL.
    */

    videoElement.src =
      data.signedUrl;


    videoElement.load();


  }
  catch (error) {

    console.error(error);

    videoElement.outerHTML =
      '<p style="color:#991b1b;padding:15px;">Unable to load this video.</p>';

  }

}


/* =====================================
   MOVING WATERMARK
===================================== */


function startWatermarkMovement(
  watermark,
  wrapper
) {


  const positions = [

    {
      top: "8%",
      left: "8%"
    },

    {
      top: "8%",
      left: "auto",
      right: "8%"
    },

    {
      top: "auto",
      bottom: "18%",
      left: "8%"
    },

    {
      top: "auto",
      bottom: "18%",
      left: "auto",
      right: "8%"
    },

    {
      top: "42%",
      left: "40%"
    },

    {
      top: "25%",
      left: "20%"
    },

    {
      top: "60%",
      left: "55%"
    }

  ];


  let index =
    Math.floor(
      Math.random() *
      positions.length
    );


  function moveWatermark() {


    const position =
      positions[index];


    watermark.style.top =
      position.top ||
      "auto";


    watermark.style.bottom =
      position.bottom ||
      "auto";


    watermark.style.left =
      position.left ||
      "auto";


    watermark.style.right =
      position.right ||
      "auto";


    index =
      (index + 1) %
      positions.length;

  }


  moveWatermark();


  /*
    Every 15 seconds
  */

  setInterval(
    moveWatermark,
    15000
  );

}


/* =====================================
   CHANGE PASSWORD
===================================== */


passwordForm.addEventListener(
  "submit",
  async function(event) {


    event.preventDefault();


    const newPassword =
      document.getElementById(
        "newPassword"
      ).value;


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      ).value;


    if (
      newPassword.length < 6
    ) {

      showPasswordMessage(
        "Password must contain at least 6 characters.",
        "error"
      );

      return;

    }


    if (
      newPassword !==
      confirmPassword
    ) {

      showPasswordMessage(
        "Passwords do not match.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "changePasswordBtn"
      );


    button.disabled =
      true;


    button.textContent =
      "Changing...";


    try {


      const {
        error
      } =
        await supabaseClient.auth
          .updateUser({
            password:
              newPassword
          });


      if (error) {

        throw error;

      }


      showPasswordMessage(
        "Password changed successfully!",
        "success"
      );


      passwordForm.reset();


    }
    catch (error) {

      console.error(error);


      showPasswordMessage(
        error.message ||
        "Could not change password.",
        "error"
      );

    }
    finally {

      button.disabled =
        false;

      button.textContent =
        "Change Password";

    }

  }
);


/* =====================================
   LOGOUT
===================================== */


document.getElementById(
  "logoutBtn"
).addEventListener(
  "click",
  async function() {


    await supabaseClient.auth.signOut();


    window.location.href =
      "login.html";


  }
);


/* =====================================
   START
===================================== */


(async function() {


  const student =
    await loadStudent();


  if (!student) return;


  await loadCourses();


})();

</script>


</body>
</html>
