<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Dashboard | MN Technology</title>

  <!-- IMPORTANT: lowercase @supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    /* ================= NAVBAR ================= */

    nav {
      background: #051223;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #22d3ee;
      color: #051223;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #studentName {
      font-weight: bold;
      color: #67e8f9;
    }

    .logout-btn {
      border: none;
      background: #ef4444;
      color: white;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* ================= MAIN ================= */

    .container {
      width: min(1100px, 94%);
      margin: 25px auto;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin-top: 0;
      color: #051223;
    }

    .welcome p {
      color: #64748b;
      margin-bottom: 0;
    }

    /* ================= COURSES ================= */

    .course-card {
      background: white;
      border-radius: 14px;
      margin-bottom: 25px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .course-title {
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
      color: #051223;
    }

    /* ================= LESSON ================= */

    .lesson {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin: 15px 0;
      padding: 18px;
      background: #fafcff;
    }

    .lesson.locked {
      opacity: 0.65;
      background: #f1f5f9;
    }

    .lesson-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .lesson-title {
      margin: 0 0 7px;
      color: #0f172a;
    }

    .lesson-description {
      color: #64748b;
      margin: 5px 0 12px;
      white-space: pre-wrap;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .status.locked {
      background: #e2e8f0;
      color: #475569;
    }

    .status.available {
      background: #dcfce7;
      color: #166534;
    }

    .status.completed {
      background: #dbeafe;
      color: #1d4ed8;
    }

    /* ================= VIDEO ================= */

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 550px;
      background: #000;
    }

    /* ================= WATERMARK ================= */

    .watermark {
      position: absolute;
      z-index: 20;
      color: rgba(255,255,255,0.72);
      background: rgba(0,0,0,0.25);
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      text-shadow: 1px 1px 3px #000;
    }

    /* ================= LOCK ================= */

    .locked-message {
      padding: 30px 15px;
      text-align: center;
      color: #64748b;
      font-weight: bold;
    }

    /* ================= BUTTONS ================= */

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button,
    .pdf-btn {
      border: none;
      border-radius: 7px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .complete-btn {
      background: #16a34a;
      color: white;
    }

    .complete-btn:hover {
      background: #15803d;
    }

    .complete-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .pdf-btn {
      background: #2563eb;
      color: white;
    }

    .pdf-btn:hover {
      background: #1d4ed8;
    }

    /* ================= PASSWORD ================= */

    .password-card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      margin-top: 25px;
    }

    .password-card h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .password-btn {
      background: #0f172a;
      color: white;
    }

    .password-btn:hover {
      background: #1e293b;
    }

    /* ================= MESSAGE ================= */

    #message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1000;
      max-width: 350px;
      padding: 13px 17px;
      border-radius: 8px;
      color: white;
      display: none;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    #message.success {
      background: #16a34a;
    }

    #message.error {
      background: #dc2626;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 650px) {

      nav {
        padding: 10px 12px;
      }

      .brand {
        font-size: 17px;
      }

      .logo {
        width: 38px;
        height: 38px;
      }

      .container {
        width: 95%;
        margin-top: 15px;
      }

      .welcome,
      .course-card,
      .password-card {
        padding: 16px;
      }

      .watermark {
        font-size: 10px;
        padding: 4px 6px;
      }

      .lesson {
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <nav>
    <div class="brand">
      <div class="logo">MN</div>
      <div>MN Technology</div>
    </div>

    <div class="nav-right">
      <span id="studentName">Student</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>


  <main class="container">

    <!-- ================= WELCOME ================= -->

    <section class="welcome">
      <h1>Welcome to MN Technology 🎓</h1>
      <p>
        Learn your lessons, watch videos and complete each lesson to unlock the next one.
      </p>
    </section>


    <!-- ================= COURSES ================= -->

    <section>
      <h2>📚 Available Lessons</h2>

      <div id="coursesContainer">
        <p>Loading lessons...</p>
      </div>
    </section>


    <!-- ================= CHANGE PASSWORD ================= -->

    <section class="password-card">

      <h2>🔐 Change Password</h2>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
      >

      <button
        class="password-btn"
        onclick="changePassword()"
      >
        Change Password
      </button>

    </section>

  </main>


  <div id="message"></div>


<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://ekanfqwbqwfhjfgctouk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     GLOBAL VARIABLES
  ========================================================= */

  let CURRENT_USER = null;
  let CURRENT_STUDENT = null;

  let ALL_LESSONS = [];
  let ALL_COURSES = [];
  let ALL_PROGRESS = [];

  let ACTIVE_TRACKERS = {};

  let watermarkTimer = null;


  /* =========================================================
     MESSAGE
  ========================================================= */

  function showMessage(text, type = "success") {

    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "";
    box.classList.add(type);

    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 3500);
  }


  /* =========================================================
     LOAD STUDENT
  ========================================================= */

  async function loadStudent() {

    const {
      data: {
        user
      },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

      window.location.href = "login.html";
      return;
    }

    CURRENT_USER = user;


    const {
      data: student,
      error: studentError
    } = await supabaseClient
      .from("student_accounts")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();


    if (studentError || !student) {

      showMessage(
        "Student account not found.",
        "error"
      );

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";
      return;
    }


    CURRENT_STUDENT = student;


    document.getElementById("studentName").textContent =
      student.username || "Student";


    await loadProgress();
    await loadCourses();

  }


  /* =========================================================
     LOAD PROGRESS
  ========================================================= */

  async function loadProgress() {

    if (!CURRENT_USER) return;


    const {
      data,
      error
    } = await supabaseClient
      .from("lesson_progress")
      .select("*")
      .eq("student_id", CURRENT_USER.id);


    if (error) {

      console.error(error);

      showMessage(
        "Could not load lesson progress.",
        "error"
      );

      ALL_PROGRESS = [];
      return;
    }


    ALL_PROGRESS = data || [];
  }


  /* =========================================================
     LOAD COURSES
  ========================================================= */

  async function loadCourses() {

    const {
      data: courses,
      error: courseError
    } = await supabaseClient
      .from("courses")
      .select("*")
      .order("id", {
        ascending: true
      });


    if (courseError) {

      console.error(courseError);

      showMessage(
        "Could not load courses.",
        "error"
      );

      return;
    }


    ALL_COURSES = courses || [];


    const {
      data: lessons,
      error: lessonError
    } = await supabaseClient
      .from("lessons")
      .select("*")
      .order("id", {
        ascending: true
      });


    if (lessonError) {

      console.error(lessonError);

      showMessage(
        "Could not load lessons.",
        "error"
      );

      return;
    }


    ALL_LESSONS = lessons || [];


    renderCourses();
  }


  /* =========================================================
     CHECK COURSE ACCESS
  ========================================================= */

  function studentHasCourseAccess(courseName) {

    if (!CURRENT_STUDENT) return false;

    const access =
      CURRENT_STUDENT.course_access || [];

    return access.includes(courseName);
  }


  /* =========================================================
     GROUP LESSONS
  ========================================================= */

  function getCourseLessons(courseName) {

    return ALL_LESSONS
      .filter(
        lesson =>
          lesson.course === courseName
      )
      .sort(
        (a, b) =>
          Number(a.id) - Number(b.id)
      );
  }


  /* =========================================================
     GET PROGRESS
  ========================================================= */

  function getLessonProgress(lessonId) {

    return ALL_PROGRESS.find(
      item =>
        Number(item.lesson_id) ===
        Number(lessonId)
    );
  }


  /* =========================================================
     CHECK COMPLETED
  ========================================================= */

  function isLessonCompleted(lessonId) {

    const progress =
      getLessonProgress(lessonId);

    return !!(
      progress &&
      progress.completed_at
    );
  }


  /* =========================================================
     CHECK UNLOCKED
  ========================================================= */

  function isLessonUnlocked(
    lesson,
    courseLessons
  ) {

    if (
      !courseLessons ||
      courseLessons.length === 0
    ) {
      return false;
    }


    const lessonIndex =
      courseLessons.findIndex(
        item =>
          Number(item.id) ===
          Number(lesson.id)
      );


    if (lessonIndex === -1) {
      return false;
    }


    /* First lesson is unlocked */

    if (lessonIndex === 0) {
      return true;
    }


    /* Previous lesson must be completed */

    const previousLesson =
      courseLessons[lessonIndex - 1];


    return isLessonCompleted(
      previousLesson.id
    );
  }


  /* =========================================================
     RENDER COURSES
  ========================================================= */

  function renderCourses() {

    const container =
      document.getElementById(
        "coursesContainer"
      );


    container.innerHTML = "";


    const accessibleCourses =
      ALL_COURSES.filter(
        course =>
          studentHasCourseAccess(
            course.name
          )
      );


    if (accessibleCourses.length === 0) {

      container.innerHTML = `
        <div class="course-card">
          <p>
            No courses have been assigned to your account yet.
          </p>
        </div>
      `;

      return;
    }


    accessibleCourses.forEach(course => {

      const courseLessons =
        getCourseLessons(
          course.name
        );


      if (courseLessons.length === 0) {
        return;
      }


      const courseCard =
        document.createElement("div");

      courseCard.className =
        "course-card";


      const title =
        document.createElement("h2");

      title.className =
        "course-title";

      title.textContent =
        "📚 " + course.name;


      courseCard.appendChild(title);


      courseLessons.forEach(
        (lesson, index) => {

          const lessonElement =
            createLessonElement(
              lesson,
              courseLessons,
              index
            );

          courseCard.appendChild(
            lessonElement
          );

        }
      );


      container.appendChild(
        courseCard
      );

    });

  }


  /* =========================================================
     CREATE LESSON ELEMENT
  ========================================================= */

  function createLessonElement(
    lesson,
    courseLessons,
    index
  ) {

    const unlocked =
      isLessonUnlocked(
        lesson,
        courseLessons
      );


    const completed =
      isLessonCompleted(
        lesson.id
      );


    const lessonBox =
      document.createElement("div");


    lessonBox.className =
      "lesson";


    if (!unlocked) {
      lessonBox.classList.add("locked");
    }


    /* ================= HEADER ================= */

    const header =
      document.createElement("div");

    header.className =
      "lesson-header";


    const info =
      document.createElement("div");


    const title =
      document.createElement("h3");

    title.className =
      "lesson-title";

    title.textContent =
      `${index + 1}. ${lesson.title}`;


    const description =
      document.createElement("p");

    description.className =
      "lesson-description";

    description.textContent =
      lesson.description || "";


    info.appendChild(title);
    info.appendChild(description);


    const status =
      document.createElement("span");

    status.className =
      "status";


    if (completed) {

      status.classList.add(
        "completed"
      );

      status.textContent =
        "✅ Completed";

    } else if (unlocked) {

      status.classList.add(
        "available"
      );

      status.textContent =
        "▶ Available";

    } else {

      status.classList.add(
        "locked"
      );

      status.textContent =
        "🔒 Locked";

    }


    header.appendChild(info);
    header.appendChild(status);


    lessonBox.appendChild(header);


    /* ================= LOCKED ================= */

    if (!unlocked) {

      const locked =
        document.createElement("div");

      locked.className =
        "locked-message";

      locked.textContent =
        "🔒 Complete the previous lesson to unlock this lesson.";

      lessonBox.appendChild(locked);

      return lessonBox;
    }


    /* ================= VIDEO ================= */

    const videoWrapper =
      document.createElement("div");

    videoWrapper.className =
      "video-wrapper";


    const video =
      document.createElement("video");

    video.preload = "metadata";

    video.playsInline = true;

    video.controls = true;


    /*
      Disable common download / remote controls.
      Note: browser controls cannot provide absolute
      protection against copying screen/video data.
    */

    video.setAttribute(
      "controlsList",
      "nodownload noremoteplayback nofullscreen"
    );

    video.setAttribute(
      "disablePictureInPicture",
      ""
    );


    video.addEventListener(
      "contextmenu",
      event => {
        event.preventDefault();
      }
    );


    /* ================= WATERMARK ================= */

    const watermark =
      document.createElement("div");

    watermark.className =
      "watermark";

    watermark.textContent =
      "💧 MN TECHNOLOGY • " +
      (CURRENT_STUDENT.username || "STUDENT");


    videoWrapper.appendChild(video);
    videoWrapper.appendChild(watermark);

    lessonBox.appendChild(
      videoWrapper
    );


    /* ================= VIDEO EVENTS ================= */

    loadSecureVideo(
      lesson.video_path,
      video
    );


    video.addEventListener(
      "loadedmetadata",
      async () => {

        await ensureProgressRow(
          lesson.id,
          video.duration
        );

      }
    );


    video.addEventListener(
      "play",
      () => {

        startLessonProgress(
          lesson.id,
          video
        );

      }
    );


    video.addEventListener(
      "timeupdate",
      () => {

        trackVideoTime(
          lesson.id,
          video
        );

      }
    );


    video.addEventListener(
      "pause",
      async () => {

        await saveLessonProgress(
          lesson.id,
          video
        );

      }
    );


    video.addEventListener(
      "ended",
      async () => {

        await saveLessonProgress(
          lesson.id,
          video
        );

        /*
          Existing automatic completion remains.
          Student can also manually press Complete.
        */

        await completeLesson(
          lesson.id,
          true
        );

      }
    );


    /* ================= BUTTONS ================= */

    const buttonRow =
      document.createElement("div");

    buttonRow.className =
      "button-row";


    /* COMPLETE BUTTON */

    const completeButton =
      document.createElement("button");

    completeButton.className =
      "complete-btn";


    if (completed) {

      completeButton.textContent =
        "✅ Completed";

      completeButton.disabled =
        true;

    } else {

      completeButton.textContent =
        "✅ Lesson Complete";

      completeButton.addEventListener(
        "click",
        async () => {

          /*
            If video is playing, pause first
            and save current progress.
          */

          if (!video.paused) {

            video.pause();

            await saveLessonProgress(
              lesson.id,
              video
            );
          }


          await completeLesson(
            lesson.id,
            false
          );

        }
      );

    }


    buttonRow.appendChild(
      completeButton
    );


    /* ================= PDF ================= */

    if (lesson.pdf_path) {

      const pdfButton =
        document.createElement("a");

      pdfButton.className =
        "pdf-btn";

      pdfButton.textContent =
        "📄 Download PDF";

      pdfButton.href =
        "#";


      pdfButton.addEventListener(
        "click",
        async event => {

          event.preventDefault();

          await downloadPdf(
            lesson.pdf_path,
            pdfButton
          );

        }
      );


      buttonRow.appendChild(
        pdfButton
      );

    }


    lessonBox.appendChild(
      buttonRow
    );


    return lessonBox;
  }


  /* =========================================================
     LOAD SECURE VIDEO
  ========================================================= */

  async function loadSecureVideo(
    videoPath,
    video
  ) {

    if (!videoPath) {
      return;
    }


    const {
      data,
      error
    } = await supabaseClient
      .storage
      .from("Video")
      .createSignedUrl(
        videoPath,
        7200
      );


    if (error || !data?.signedUrl) {

      console.error(error);

      video.outerHTML = `
        <div class="locked-message">
          ❌ Video could not be loaded.
        </div>
      `;

      return;
    }


    video.src =
      data.signedUrl;

  }


  /* =========================================================
     DOWNLOAD PDF
  ========================================================= */

  async function downloadPdf(
    pdfPath,
    button
  ) {

    if (!pdfPath) {
      return;
    }


    const originalText =
      button.textContent;


    button.textContent =
      "Preparing PDF...";


    button.style.pointerEvents =
      "none";


    const {
      data,
      error
    } = await supabaseClient
      .storage
      .from("Video")
      .createSignedUrl(
        pdfPath,
        3600,
        {
          download: true
        }
      );


    if (
      error ||
      !data?.signedUrl
    ) {

      console.error(error);

      showMessage(
        "PDF download failed.",
        "error"
      );

    } else {

      window.open(
        data.signedUrl,
        "_blank"
      );

    }


    button.textContent =
      originalText;

    button.style.pointerEvents =
      "auto";
  }


  /* =========================================================
     ENSURE PROGRESS ROW
  ========================================================= */

  async function ensureProgressRow(
    lessonId,
    duration
  ) {

    if (!CURRENT_USER) return;


    let existing =
      getLessonProgress(
        lessonId
      );


    if (existing) {

      if (
        !existing.video_duration_seconds &&
        duration
      ) {

        await supabaseClient
          .from("lesson_progress")
          .update({
            video_duration_seconds:
              Math.round(duration),
            updated_at:
              new Date().toISOString()
          })
          .eq("id", existing.id);


        existing.video_duration_seconds =
          Math.round(duration);
      }


      return;
    }


    const now =
      new Date().toISOString();


    const {
      data,
      error
    } = await supabaseClient
      .from("lesson_progress")
      .insert({
        student_id:
          CURRENT_USER.id,

        lesson_id:
          lessonId,

        first_opened_at:
          now,

        last_watched_at:
          null,

        watch_seconds:
          0,

        video_duration_seconds:
          duration
            ? Math.round(duration)
            : null,

        completed_at:
          null
      })
      .select()
      .single();


    if (error) {

      /*
        A duplicate can happen if two browser events
        try to create the same row.
      */

      console.error(
        "Progress insert:",
        error
      );

      return;
    }


    if (data) {

      ALL_PROGRESS.push(
        data
      );

    }

  }


  /* =========================================================
     START TRACKING
  ========================================================= */

  function startLessonProgress(
    lessonId,
    video
  ) {

    if (!CURRENT_USER) return;


    const existing =
      ACTIVE_TRACKERS[
        lessonId
      ];


    if (!existing) {

      ACTIVE_TRACKERS[
        lessonId
      ] = {
        lastTick:
          video.currentTime,

        lastSave:
          Date.now()
      };

    } else {

      existing.lastTick =
        video.currentTime;

    }

  }


  /* =========================================================
     TRACK VIDEO TIME
  ========================================================= */

  function trackVideoTime(
    lessonId,
    video
  ) {

    if (!CURRENT_USER) return;


    if (video.paused) {
      return;
    }


    if (!ACTIVE_TRACKERS[lessonId]) {

      startLessonProgress(
        lessonId,
        video
      );

      return;
    }


    const tracker =
      ACTIVE_TRACKERS[lessonId];


    const current =
      video.currentTime;


    const previous =
      tracker.lastTick;


    const difference =
      current - previous;


    /*
      Count only reasonable forward playback.
      This prevents seeking from adding huge watch time.
    */

    if (
      difference > 0 &&
      difference <= 5
    ) {

      const progress =
        getLessonProgress(
          lessonId
        );


      if (progress) {

        progress.watch_seconds =
          Number(
            progress.watch_seconds || 0
          ) + difference;

        progress.last_watched_at =
          new Date().toISOString();

      }

    }


    tracker.lastTick =
      current;


    if (
      Date.now() -
      tracker.lastSave >
      10000
    ) {

      tracker.lastSave =
        Date.now();


      saveLessonProgress(
        lessonId,
        video
      );

    }

  }


  /* =========================================================
     SAVE PROGRESS
  ========================================================= */

  async function saveLessonProgress(
    lessonId,
    video
  ) {

    if (!CURRENT_USER) return;


    const progress =
      getLessonProgress(
        lessonId
      );


    if (!progress) {

      await ensureProgressRow(
        lessonId,
        video?.duration || null
      );

    }


    const currentProgress =
      getLessonProgress(
        lessonId
      );


    if (!currentProgress) {
      return;
    }


    const updateData = {

      watch_seconds:
        Math.max(
          0,
          Math.floor(
            Number(
              currentProgress.watch_seconds || 0
            )
          )
        ),

      last_watched_at:
        new Date().toISOString(),

      updated_at:
        new Date().toISOString()

    };


    if (
      video &&
      Number.isFinite(
        video.duration
      ) &&
      video.duration > 0
    ) {

      updateData.video_duration_seconds =
        Math.round(
          video.duration
        );

    }


    const {
      error
    } = await supabaseClient
      .from("lesson_progress")
      .update(updateData)
      .eq("id", currentProgress.id)
      .eq(
        "student_id",
        CURRENT_USER.id
      );


    if (error) {

      console.error(
        "Save progress error:",
        error
      );

      return;
    }


    Object.assign(
      currentProgress,
      updateData
    );

  }


  /* =========================================================
     COMPLETE LESSON
  ========================================================= */

  async function completeLesson(
    lessonId,
    automatic = false
  ) {

    if (!CURRENT_USER) return;


    let progress =
      getLessonProgress(
        lessonId
      );


    /*
      If the student presses Complete without
      watching the video, create the progress row.
    */

    if (!progress) {

      const now =
        new Date().toISOString();


      const {
        data,
        error
      } = await supabaseClient
        .from("lesson_progress")
        .insert({
          student_id:
            CURRENT_USER.id,

          lesson_id:
            lessonId,

          first_opened_at:
            now,

          last_watched_at:
            now,

          watch_seconds:
            0,

          completed_at:
            now
        })
        .select()
        .single();


      if (error) {

        console.error(error);

        showMessage(
          "Lesson could not be completed.",
          "error"
        );

        return;
      }


      progress = data;

      ALL_PROGRESS.push(
        data
      );

    } else {

      const now =
        new Date().toISOString();


      const {
        data,
        error
      } = await supabaseClient
        .from("lesson_progress")
        .update({

          completed_at:
            now,

          last_watched_at:
            now,

          updated_at:
            now

        })
        .eq(
          "id",
          progress.id
        )
        .eq(
          "student_id",
          CURRENT_USER.id
        )
        .select()
        .single();


      if (error) {

        console.error(error);

        showMessage(
          "Lesson could not be completed.",
          "error"
        );

        return;
      }


      if (data) {

        Object.assign(
          progress,
          data
        );

      }

    }


    /* Stop active tracker */

    delete ACTIVE_TRACKERS[
      lessonId
    ];


    showMessage(
      automatic
        ? "🎉 Lesson completed automatically!"
        : "✅ Lesson completed!"
    );


    /*
      Re-render.
      This automatically unlocks the next lesson.
    */

    renderCourses();


    /*
      Try to scroll to next lesson after render.
    */

    setTimeout(() => {

      const lessons =
        ALL_LESSONS
          .filter(
            lesson =>
              lesson.course ===
              (
                ALL_LESSONS.find(
                  item =>
                    Number(item.id) ===
                    Number(lessonId)
                )?.course
              )
          )
          .sort(
            (a, b) =>
              Number(a.id) -
              Number(b.id)
          );


      const currentIndex =
        lessons.findIndex(
          lesson =>
            Number(lesson.id) ===
            Number(lessonId)
        );


      if (
        currentIndex !== -1 &&
        currentIndex + 1 <
        lessons.length
      ) {

        const nextLesson =
          lessons[currentIndex + 1];


        const headings =
          document.querySelectorAll(
            ".lesson-title"
          );


        headings.forEach(
          heading => {

            if (
              heading.textContent.includes(
                nextLesson.title
              )
            ) {

              heading.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });

            }

          }
        );

      }

    }, 300);

  }


  /* =========================================================
     WATERMARK MOVEMENT
  ========================================================= */

  function moveWatermarks() {

    const watermarks =
      document.querySelectorAll(
        ".watermark"
      );


    const positions = [

      {
        top: "8%",
        left: "5%"
      },

      {
        top: "8%",
        right: "5%"
      },

      {
        bottom: "12%",
        left: "5%"
      },

      {
        bottom: "12%",
        right: "5%"
      },

      {
        top: "45%",
        left: "38%"
      }

    ];


    watermarks.forEach(
      watermark => {

        const position =
          positions[
            Math.floor(
              Math.random() *
              positions.length
            )
          ];


        watermark.style.top =
          position.top || "";

        watermark.style.bottom =
          position.bottom || "";

        watermark.style.left =
          position.left || "";

        watermark.style.right =
          position.right || "";

      }
    );

  }


  /* =========================================================
     FULLSCREEN
  ========================================================= */

  document.addEventListener(
    "fullscreenchange",
    () => {

      /*
        Watermark is inside the video wrapper,
        so it remains visible with the video.
      */

    }
  );


  /* =========================================================
     CHANGE PASSWORD
  ========================================================= */

  async function changePassword() {

    const password =
      document.getElementById(
        "newPassword"
      ).value.trim();


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      ).value.trim();


    if (!password) {

      showMessage(
        "Enter a new password.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    if (
      password !==
      confirmPassword
    ) {

      showMessage(
        "Passwords do not match.",
        "error"
      );

      return;
    }


    const {
      error
    } = await supabaseClient.auth
      .updateUser({
        password: password
      });


    if (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Password change failed.",
        "error"
      );

      return;
    }


    document.getElementById(
      "newPassword"
    ).value = "";


    document.getElementById(
      "confirmPassword"
    ).value = "";


    showMessage(
      "✅ Password changed successfully."
    );

  }


  /* =========================================================
     LOGOUT
  ========================================================= */

  async function logout() {

    /*
      Save active video progress before logout.
    */

    const savePromises = [];


    document
      .querySelectorAll("video")
      .forEach(video => {

        const lessonElement =
          video.closest(".lesson");

        if (!lessonElement) {
          return;
        }


        const title =
          lessonElement.querySelector(
            ".lesson-title"
          )?.textContent || "";


        const lesson =
          ALL_LESSONS.find(
            item =>
              title.includes(
                item.title
              )
          );


        if (lesson) {

          savePromises.push(
            saveLessonProgress(
              lesson.id,
              video
            )
          );

        }

      });


    await Promise.allSettled(
      savePromises
    );


    await supabaseClient.auth.signOut();


    window.location.href =
      "login.html";

  }


  /* =========================================================
     PAGE VISIBILITY
  ========================================================= */

  document.addEventListener(
    "visibilitychange",
    async () => {

      if (
        document.visibilityState ===
        "hidden"
      ) {

        const videos =
          document.querySelectorAll(
            "video"
          );


        const saves = [];


        videos.forEach(
          video => {

            const lessonElement =
              video.closest(".lesson");

            if (!lessonElement) {
              return;
            }


            const title =
              lessonElement.querySelector(
                ".lesson-title"
              )?.textContent || "";


            const lesson =
              ALL_LESSONS.find(
                item =>
                  title.includes(
                    item.title
                  )
              );


            if (lesson) {

              saves.push(
                saveLessonProgress(
                  lesson.id,
                  video
                )
              );

            }

          }
        );


        await Promise.allSettled(
          saves
        );

      }

    }
  );


  /* =========================================================
     BEFORE UNLOAD
  ========================================================= */

  window.addEventListener(
    "beforeunload",
    () => {

      /*
        Do not perform long async operations here.
        Browser may cancel them.
      */

      Object.values(
        ACTIVE_TRACKERS
      ).forEach(
        tracker => {

          tracker.lastTick =
            null;

        }
      );

    }
  );


  /* =========================================================
     START
  ========================================================= */

  (async function start() {

    await loadStudent();


    /*
      Move watermark immediately.
    */

    moveWatermarks();


    /*
      Move watermark every 15 seconds.
    */

    watermarkTimer =
      setInterval(
        moveWatermarks,
        15000
      );

  })();

</script>
