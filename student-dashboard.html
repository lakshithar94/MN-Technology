<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Dashboard | MN Technology</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    /* =====================================
       NAVBAR
    ===================================== */

    nav {
      background: #051223;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      background: #22d3ee;
      color: #051223;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .username-display {
      color: #cbd5e1;
    }

    .logout-btn {
      background: #ef4444;
      border: none;
      color: white;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    /* =====================================
       CONTAINER
    ===================================== */

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .welcome h1 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #64748b;
    }

    /* =====================================
       SECTION
    ===================================== */

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    /* =====================================
       COURSE
    ===================================== */

    .course-section {
      margin-bottom: 30px;
    }

    .course-title {
      background: #051223;
      color: white;
      padding: 14px 18px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 19px;
    }

    .course-locked {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      margin-bottom: 15px;
    }

    .lock-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .course-locked h3 {
      margin-bottom: 8px;
      color: #334155;
    }

    .course-locked p {
      color: #64748b;
    }

    /* =====================================
       LESSON
    ===================================== */

    .lesson {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
      position: relative;
    }

    .lesson:last-child {
      margin-bottom: 0;
    }

    .lesson h3 {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .course {
      color: #0284c7;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    /* =====================================
       LESSON STATUS
    ===================================== */

    .lesson-status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .status-locked {
      background: #f1f5f9;
      color: #64748b;
    }

    .status-unlocked {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-watching {
      background: #fef3c7;
      color: #92400e;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .lesson-locked {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    .locked-message {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 18px;
      border-radius: 8px;
      color: #64748b;
      text-align: center;
    }

    .completed-message {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 12px;
      border-radius: 8px;
      color: #166534;
      margin-top: 12px;
      font-weight: bold;
    }

    /* =====================================
       VIDEO WRAPPER
    ===================================== */

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: black;
      border-radius: 10px;
      overflow: hidden;
    }

    /* =====================================
       VIDEO
    ===================================== */

    video {
      width: 100%;
      display: block;
      background: black;
      border-radius: 10px;
    }

    /* =====================================
       WATERMARK
    ===================================== */

    .video-watermark {
      position: absolute;
      color: rgba(255,255,255,0.30);
      font-size: 15px;
      font-weight: bold;
      padding: 6px 10px;
      background: rgba(0,0,0,0.12);
      border-radius: 5px;
      pointer-events: none;
      user-select: none;
      z-index: 99999;
      transition:
        top 1s ease,
        left 1s ease,
        right 1s ease,
        bottom 1s ease;
      white-space: nowrap;
    }

    /* =====================================
       FULLSCREEN
    ===================================== */

    .video-wrapper:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper:fullscreen video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0;
    }

    .video-wrapper:-webkit-full-screen video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 0;
    }

    /* =====================================
       FULLSCREEN BUTTON
    ===================================== */

    .fullscreen-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 100000;
      background: rgba(0,0,0,0.65);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .fullscreen-btn:hover {
      opacity: 1;
    }

    .video-wrapper:fullscreen .fullscreen-btn {
      right: 18px;
      bottom: 18px;
    }

    .video-wrapper:-webkit-full-screen .fullscreen-btn {
      right: 18px;
      bottom: 18px;
    }

    /* =====================================
       LESSON COMPLETE BUTTON
    ===================================== */

    .lesson-complete-btn {
      margin-top: 15px;
      background: #22c55e;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s ease;
    }

    .lesson-complete-btn:hover {
      background: #16a34a;
    }

    .lesson-complete-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .lesson-complete-btn.completing {
      background: #f59e0b;
      cursor: wait;
    }

    /* =====================================
       PDF BUTTON
    ===================================== */

    .pdf-btn {
      display: inline-block;
      margin-top: 15px;
      margin-left: 8px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
    }

    .pdf-btn:hover {
      background: #1d4ed8;
    }

    /* =====================================
       PASSWORD
    ===================================== */

    .password-form {
      max-width: 500px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .change-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .change-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =====================================
       MESSAGE
    ===================================== */

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* =====================================
       NO LESSONS
    ===================================== */

    .no-lessons {
      color: #64748b;
      text-align: center;
      padding: 30px;
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 700px) {

      nav {
        padding: 12px 15px;
      }

      .logo span {
        display: none;
      }

      .nav-right {
        gap: 8px;
      }

      .username-display {
        font-size: 13px;
      }

      .container {
        padding: 0 12px;
      }

      .video-watermark {
        font-size: 11px;
        padding: 4px 7px;
      }

      .fullscreen-btn {
        font-size: 12px;
        padding: 7px 9px;
      }

      .section {
        padding: 18px;
      }

      .lesson {
        padding: 15px;
      }

      .pdf-btn {
        margin-left: 0;
        margin-top: 10px;
      }

    }

  </style>

</head>

<body>

  <!-- =====================================
       NAVBAR
  ===================================== -->

  <nav>

    <div class="logo">

      <div class="logo-box">
        MN
      </div>

      <span>
        MN Technology
      </span>

    </div>

    <div class="nav-right">

      <span
        class="username-display"
        id="navUsername"
      >
        Student
      </span>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </nav>


  <div class="container">

    <!-- =====================================
         WELCOME
    ===================================== -->

    <div class="welcome">

      <h1>
        Welcome,
        <span id="welcomeUsername">
          Student
        </span>!
      </h1>

      <p>
        Select a lesson below and start learning.
      </p>

    </div>


    <!-- =====================================
         LESSONS
    ===================================== -->

    <div class="section">

      <h2>
        📚 Available Lessons
      </h2>

      <div id="lessonsList">

        <p class="no-lessons">
          Loading lessons...
        </p>

      </div>

    </div>


    <!-- =====================================
         PASSWORD
    ===================================== -->

    <div class="section">

      <h2>
        🔐 Change Password
      </h2>

      <div
        id="passwordMessage"
        class="message"
      >
      </div>

      <form
        id="passwordForm"
        class="password-form"
      >

        <label for="newPassword">
          New Password
        </label>

        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          minlength="6"
          required
          autocomplete="new-password"
        >

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="6"
          required
          autocomplete="new-password"
        >

        <button
          type="submit"
          class="change-btn"
          id="changePasswordBtn"
        >
          Change Password
        </button>

      </form>

    </div>

  </div>


  <!-- =====================================
       SUPABASE
  ===================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://ekanfqwbqwfhjfgctouk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       ELEMENTS
    ===================================== */

    const lessonsList =
      document.getElementById("lessonsList");

    const navUsername =
      document.getElementById("navUsername");

    const welcomeUsername =
      document.getElementById("welcomeUsername");

    const passwordForm =
      document.getElementById("passwordForm");

    const passwordMessage =
      document.getElementById("passwordMessage");


    /* =====================================
       CURRENT STUDENT
    ===================================== */

    let CURRENT_STUDENT = null;


    /* =====================================
       ALL DATA
    ===================================== */

    let ALL_COURSES = [];
    let ALL_LESSONS = [];
    let ALL_PROGRESS = [];


    /* =====================================
       ACTIVE VIDEO TRACKERS
    ===================================== */

    const activeTrackers = new Map();


    /* =====================================
       PASSWORD MESSAGE
    ===================================== */

    function showPasswordMessage(
      text,
      type
    ) {

      passwordMessage.textContent =
        text;

      passwordMessage.className =
        "message " + type;

      passwordMessage.style.display =
        "block";

    }


    /* =====================================
       LOAD STUDENT
    ===================================== */

    async function loadStudent() {

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.auth.getSession();


      if (
        sessionError ||
        !sessionData.session
      ) {

        window.location.href =
          "login.html";

        return null;
      }


      const user =
        sessionData.session.user;


      const {
        data: student,
        error
      } =
        await supabaseClient
          .from("student_accounts")
          .select(
            "id, username, course_access"
          )
          .eq(
            "id",
            user.id
          )
          .maybeSingle();


      if (
        error ||
        !student
      ) {

        console.error(error);

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

        return null;
      }


      CURRENT_STUDENT =
        student;


      navUsername.textContent =
        student.username;

      welcomeUsername.textContent =
        student.username;


      return student;

    }


    /* =====================================
       LOAD PROGRESS
    ===================================== */

    async function loadProgress() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("lesson_progress")
          .select("*")
          .eq(
            "student_id",
            CURRENT_STUDENT.id
          );


      if (error) {

        console.error(
          "Progress loading error:",
          error
        );

        ALL_PROGRESS = [];

        return [];

      }


      ALL_PROGRESS =
        data || [];


      return ALL_PROGRESS;

    }


    /* =====================================
       GET PROGRESS
    ===================================== */

    function getProgress(
      lessonId
    ) {

      return ALL_PROGRESS.find(
        progress =>
          Number(progress.lesson_id) ===
          Number(lessonId)
      ) || null;

    }


    /* =====================================
       CHECK COMPLETED
    ===================================== */

    function isLessonCompleted(
      lessonId
    ) {

      const progress =
        getProgress(
          lessonId
        );


      return !!(
        progress &&
        progress.completed_at
      );

    }


    /* =====================================
       CHECK UNLOCKED
    ===================================== */

    function isLessonUnlocked(
      lesson,
      courseLessons
    ) {

      if (
        !courseLessons ||
        courseLessons.length === 0
      ) {

        return false;

      }


      const lessonIndex =
        courseLessons.findIndex(
          item =>
            Number(item.id) ===
            Number(lesson.id)
        );


      if (
        lessonIndex === -1
      ) {

        return false;

      }


      /*
        First lesson is always unlocked.
      */

      if (
        lessonIndex === 0
      ) {

        return true;

      }


      /*
        Previous lesson must be completed.
      */

      const previousLesson =
        courseLessons[
          lessonIndex - 1
        ];


      return isLessonCompleted(
        previousLesson.id
      );

    }


    /* =====================================
       LOAD COURSES
    ===================================== */

    async function loadCourses() {

      const {
        data: courses,
        error: courseError
      } =
        await supabaseClient
          .from("courses")
          .select(
            "id, name"
          )
          .order(
            "id",
            {
              ascending: true
            }
          );


      if (courseError) {

        console.error(
          courseError
        );

        lessonsList.innerHTML =
          '<p class="no-lessons">Could not load courses.</p>';

        return;

      }


      ALL_COURSES =
        courses || [];


      if (
        ALL_COURSES.length === 0
      ) {

        lessonsList.innerHTML =
          '<p class="no-lessons">No courses available yet.</p>';

        return;

      }


      const {
        data: lessons,
        error: lessonError
      } =
        await supabaseClient
          .from("lessons")
          .select("*")
          .order(
            "id",
            {
              ascending: true
            }
          );


      if (lessonError) {

        console.error(
          lessonError
        );

        lessonsList.innerHTML =
          '<p class="no-lessons">Could not load lessons.</p>';

        return;

      }


      ALL_LESSONS =
        lessons || [];


      await loadProgress();

      renderCourses();

    }


    /* =====================================
       RENDER COURSES
    ===================================== */

    function renderCourses() {

      const access =
        Array.isArray(
          CURRENT_STUDENT.course_access
        )
          ? CURRENT_STUDENT.course_access
          : [];


      lessonsList.innerHTML =
        "";


      ALL_COURSES.forEach(
        course => {

          const courseName =
            course.name;


          const hasAccess =
            access.includes(
              courseName
            );


          const courseBox =
            document.createElement(
              "div"
            );


          courseBox.className =
            "course-section";


          /* COURSE TITLE */

          const title =
            document.createElement(
              "div"
            );


          title.className =
            "course-title";


          title.textContent =
            hasAccess
              ? "📚 " + courseName
              : "🔒 " + courseName;


          courseBox.appendChild(
            title
          );


          /* LOCKED COURSE */

          if (!hasAccess) {

            const locked =
              document.createElement(
                "div"
              );


            locked.className =
              "course-locked";


            locked.innerHTML = `
              <div class="lock-icon">
                🔒
              </div>

              <h3>
                Course Locked
              </h3>

              <p>
                You don't have access to this course yet.
              </p>

              <p style="margin-top:8px;">
                Please contact the administrator to get access.
              </p>
            `;


            courseBox.appendChild(
              locked
            );


            lessonsList.appendChild(
              courseBox
            );


            return;

          }


          /* OPEN COURSE */

          const courseLessons =
            ALL_LESSONS
              .filter(
                lesson =>
                  lesson.course ===
                  courseName
              )
              .sort(
                (a, b) =>
                  Number(a.id) -
                  Number(b.id)
              );


          if (
            courseLessons.length === 0
          ) {

            const noLesson =
              document.createElement(
                "div"
              );


            noLesson.className =
              "no-lessons";


            noLesson.textContent =
              "No lessons available in this course yet.";


            courseBox.appendChild(
              noLesson
            );

          }

          else {

            courseLessons.forEach(
              lesson => {

                courseBox.appendChild(
                  createLessonElement(
                    lesson,
                    courseLessons
                  )
                );

              }
            );

          }


          lessonsList.appendChild(
            courseBox
          );

        }
      );

    }


    /* =====================================
       CREATE LESSON
    ===================================== */

    function createLessonElement(
      lesson,
      courseLessons
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "lesson";


      item.id =
        "lesson-" +
        lesson.id;


      const unlocked =
        isLessonUnlocked(
          lesson,
          courseLessons
        );


      const completed =
        isLessonCompleted(
          lesson.id
        );


      const progress =
        getProgress(
          lesson.id
        );


      if (!unlocked) {

        item.classList.add(
          "lesson-locked"
        );

      }


      /* TITLE */

      const title =
        document.createElement(
          "h3"
        );


      title.textContent =
        lesson.title || "";


      item.appendChild(
        title
      );


      /* COURSE */

      const course =
        document.createElement(
          "div"
        );


      course.className =
        "course";


      course.textContent =
        "Course: " +
        (lesson.course || "");


      item.appendChild(
        course
      );


      /* DESCRIPTION */

      const description =
        document.createElement(
          "div"
        );


      description.className =
        "description";


      description.textContent =
        lesson.description || "";


      item.appendChild(
        description
      );


      /* STATUS */

      const status =
        document.createElement(
          "div"
        );


      status.className =
        "lesson-status";


      if (completed) {

        status.classList.add(
          "status-completed"
        );

        status.textContent =
          "✅ Completed";

      }

      else if (
        progress &&
        progress.first_opened_at
      ) {

        status.classList.add(
          "status-watching"
        );

        status.textContent =
          "👀 Watching";

      }

      else if (unlocked) {

        status.classList.add(
          "status-unlocked"
        );

        status.textContent =
          "▶️ Ready to Watch";

      }

      else {

        status.classList.add(
          "status-locked"
        );

        status.textContent =
          "🔒 Locked";

      }


      item.appendChild(
        status
      );


      /* =====================================
         LOCKED LESSON
      ===================================== */

      if (!unlocked) {

        const lockedMessage =
          document.createElement(
            "div"
          );


        lockedMessage.className =
          "locked-message";


        lockedMessage.innerHTML = `
          🔒 <strong>Lesson Locked</strong>

          <br><br>

          Complete the previous lesson
          to unlock this lesson.
        `;


        item.appendChild(
          lockedMessage
        );


        return item;

      }


      /*
        Keep video element available to the
        Complete button.
      */

      let videoElement =
        null;


      /* =====================================
         VIDEO
      ===================================== */

      if (lesson.video_path) {

        const videoWrapper =
          document.createElement(
            "div"
          );


        videoWrapper.className =
          "video-wrapper";


        videoElement =
          document.createElement(
            "video"
          );


        videoElement.controls =
          true;


        videoElement.preload =
          "metadata";


        /*
          Block common download controls.
        */

        videoElement.setAttribute(
          "controlsList",
          "nodownload noremoteplayback nofullscreen"
        );


        videoElement.setAttribute(
          "disablePictureInPicture",
          ""
        );


        videoElement.addEventListener(
          "contextmenu",
          function(event) {

            event.preventDefault();

          }
        );


        /* WATERMARK */

        const watermark =
          document.createElement(
            "div"
          );


        watermark.className =
          "video-watermark";


        watermark.textContent =
          "💧 MN TECHNOLOGY • " +
          CURRENT_STUDENT.username;


        /* FULLSCREEN BUTTON */

        const fullscreenButton =
          document.createElement(
            "button"
          );


        fullscreenButton.className =
          "fullscreen-btn";


        fullscreenButton.type =
          "button";


        fullscreenButton.textContent =
          "⛶ Full Screen";


        fullscreenButton.addEventListener(
          "click",
          async function(event) {

            event.preventDefault();

            event.stopPropagation();


            try {

              if (
                !document.fullscreenElement
              ) {

                if (
                  videoWrapper.requestFullscreen
                ) {

                  await videoWrapper.requestFullscreen();

                }

                else if (
                  videoWrapper.webkitRequestFullscreen
                ) {

                  videoWrapper.webkitRequestFullscreen();

                }

              }

              else {

                if (
                  document.exitFullscreen
                ) {

                  await document.exitFullscreen();

                }

                else if (
                  document.webkitExitFullscreen
                ) {

                  document.webkitExitFullscreen();

                }

              }

            }

            catch (error) {

              console.error(
                "Fullscreen error:",
                error
              );

            }

          }
        );


        /* DOUBLE CLICK FULLSCREEN */

        videoElement.addEventListener(
          "dblclick",
          async function(event) {

            event.preventDefault();


            try {

              if (
                !document.fullscreenElement
              ) {

                if (
                  videoWrapper.requestFullscreen
                ) {

                  await videoWrapper.requestFullscreen();

                }

                else if (
                  videoWrapper.webkitRequestFullscreen
                ) {

                  videoWrapper.webkitRequestFullscreen();

                }

              }

              else {

                if (
                  document.exitFullscreen
                ) {

                  await document.exitFullscreen();

                }

                else if (
                  document.webkitExitFullscreen
                ) {

                  document.webkitExitFullscreen();

                }

              }

            }

            catch (error) {

              console.error(
                "Fullscreen error:",
                error
              );

            }

          }
        );


        /* ADD ELEMENTS */

        videoWrapper.appendChild(
          videoElement
        );


        videoWrapper.appendChild(
          watermark
        );


        videoWrapper.appendChild(
          fullscreenButton
        );


        item.appendChild(
          videoWrapper
        );


        /* LOAD SECURE VIDEO */

        loadSecureVideo(
          lesson.video_path,
          videoElement
        );


        /* WATERMARK MOVEMENT */

        startWatermarkMovement(
          watermark,
          videoWrapper
        );


        /* WATCH TRACKING */

        setupVideoTracking(
          videoElement,
          lesson
        );

      }

      else {

        const noVideo =
          document.createElement(
            "div"
          );


        noVideo.className =
          "locked-message";


        noVideo.textContent =
          "No video available for this lesson yet.";


        item.appendChild(
          noVideo
        );

      }


      /* =====================================
         LESSON COMPLETE BUTTON
      ===================================== */

      const completeButton =
        document.createElement(
          "button"
        );


      completeButton.type =
        "button";


      completeButton.className =
        "lesson-complete-btn";


      if (completed) {

        completeButton.textContent =
          "✅ Lesson Completed";


        completeButton.disabled =
          true;

      }

      else {

        completeButton.textContent =
          "✅ Lesson Complete";


        completeButton.disabled =
          false;


        completeButton.addEventListener(
          "click",
          async function() {

            completeButton.disabled =
              true;


            completeButton.classList.add(
              "completing"
            );


            completeButton.textContent =
              "Saving...";


            try {

              const tracker =
                activeTrackers.get(
                  Number(lesson.id)
                );


              /*
                If video is currently playing,
                pause it before completion.
              */

              if (
                videoElement &&
                !videoElement.paused
              ) {

                videoElement.pause();

              }


              if (tracker) {

                tracker.lastTick =
                  null;

                tracker.completed =
                  true;


                await saveLessonProgress(
                  lesson.id,
                  tracker
                );


                await completeLesson(
                  lesson.id,
                  tracker
                );

              }

              else {

                /*
                  Student can complete a lesson
                  even without watching it.
                */

                const existing =
                  getProgress(
                    lesson.id
                  );


                const trackerWithoutVideo = {

                  lessonId:
                    Number(lesson.id),

                  videoDuration:
                    null,

                  firstOpened:
                    existing?.first_opened_at ||
                    null,

                  lastTick:
                    null,

                  watchSeconds:
                    Number(
                      existing?.watch_seconds ||
                      0
                    ),

                  saving:
                    false,

                  completed:
                    true

                };


                await completeLesson(
                  lesson.id,
                  trackerWithoutVideo
                );

              }

            }

            catch (error) {

              console.error(
                "Manual complete error:",
                error
              );


              completeButton.disabled =
                false;


              completeButton.classList.remove(
                "completing"
              );


              completeButton.textContent =
                "✅ Lesson Complete";


              alert(
                "Could not complete this lesson."
              );

            }

          }
        );

      }


      item.appendChild(
        completeButton
      );


      /* =====================================
         PDF DOWNLOAD
      ===================================== */

      if (
        lesson.pdf_path
      ) {

        const pdfButton =
          document.createElement(
            "a"
          );


        pdfButton.className =
          "pdf-btn";


        pdfButton.textContent =
          "📄 Download PDF";


        pdfButton.href =
          "#";


        pdfButton.addEventListener(
          "click",
          async function(event) {

            event.preventDefault();


            await downloadPdf(
              lesson.pdf_path,
              pdfButton
            );

          }
        );


        item.appendChild(
          pdfButton
        );

      }


      /* =====================================
         COMPLETED MESSAGE
      ===================================== */

      if (completed) {

        const completedMessage =
          document.createElement(
            "div"
          );


        completedMessage.className =
          "completed-message";


        completedMessage.textContent =
          "✅ You have completed this lesson. You can watch it again anytime.";


        item.appendChild(
          completedMessage
        );

      }


      return item;

    }


    /* =====================================
       SECURE VIDEO
    ===================================== */

    async function loadSecureVideo(
      videoPath,
      videoElement
    ) {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from("Video")
            .createSignedUrl(
              videoPath,
              7200
            );


        if (error) {

          console.error(
            "Video signed URL error:",
            error
          );


          videoElement.outerHTML =
            '<p style="color:#991b1b;padding:15px;">Unable to load this video.</p>';


          return;

        }


        if (
          !data ||
          !data.signedUrl
        ) {

          videoElement.outerHTML =
            '<p style="color:#991b1b;padding:15px;">Video URL could not be created.</p>';


          return;

        }


        videoElement.src =
          data.signedUrl;


        videoElement.load();

      }

      catch (error) {

        console.error(
          error
        );


        videoElement.outerHTML =
          '<p style="color:#991b1b;padding:15px;">Unable to load this video.</p>';

      }

    }


    /* =====================================
       DOWNLOAD PDF
    ===================================== */

    async function downloadPdf(
      pdfPath,
      button
    ) {

      if (!pdfPath) {
        return;
      }


      const originalText =
        button.textContent;


      button.textContent =
        "Preparing PDF...";


      button.style.pointerEvents =
        "none";


      try {

        /*
          PDF is also inside the private
          Video bucket, therefore use a
          signed URL.
        */

        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from("Video")
            .createSignedUrl(
              pdfPath,
              3600,
              {
                download: true
              }
            );


        if (
          error ||
          !data ||
          !data.signedUrl
        ) {

          console.error(
            "PDF signed URL error:",
            error
          );


          alert(
            "PDF download failed."
          );


          return;

        }


        /*
          Open the signed download URL.
        */

        const link =
          document.createElement(
            "a"
          );


        link.href =
          data.signedUrl;


        link.target =
          "_blank";


        link.rel =
          "noopener";


        document.body.appendChild(
          link
        );


        link.click();


        link.remove();

      }

      catch (error) {

        console.error(
          "PDF download error:",
          error
        );


        alert(
          "PDF download failed."
        );

      }

      finally {

        button.textContent =
          originalText;


        button.style.pointerEvents =
          "auto";

      }

    }


    /* =====================================
       MOVING WATERMARK
    ===================================== */

    function startWatermarkMovement(
      watermark,
      wrapper
    ) {

      const positions = [

        {
          top: "8%",
          left: "8%"
        },

        {
          top: "8%",
          left: "auto",
          right: "8%"
        },

        {
          top: "auto",
          bottom: "18%",
          left: "8%"
        },

        {
          top: "auto",
          bottom: "18%",
          left: "auto",
          right: "8%"
        },

        {
          top: "42%",
          left: "40%"
        },

        {
          top: "25%",
          left: "20%"
        },

        {
          top: "60%",
          left: "55%"
        }

      ];


      let index =
        Math.floor(
          Math.random() *
          positions.length
        );


      function moveWatermark() {

        const position =
          positions[index];


        watermark.style.top =
          position.top ||
          "auto";


        watermark.style.bottom =
          position.bottom ||
          "auto";


        watermark.style.left =
          position.left ||
          "auto";


        watermark.style.right =
          position.right ||
          "auto";


        index =
          (index + 1) %
          positions.length;

      }


      /*
        Initial position
      */

      moveWatermark();


      /*
        Change position every 15 seconds.
      */

      setInterval(
        moveWatermark,
        15000
      );

    }


    /* =====================================
       VIDEO TRACKING SETUP
    ===================================== */

    function setupVideoTracking(
      video,
      lesson
    ) {

      const tracker = {

        lessonId:
          Number(lesson.id),

        videoDuration:
          null,

        firstOpened:
          false,

        lastTick:
          null,

        watchSeconds:
          Number(
            getProgress(
              lesson.id
            )?.watch_seconds || 0
          ),

        saving:
          false,

        completed:
          isLessonCompleted(
            lesson.id
          ),

        lastSaveSeconds:
          Number(
            getProgress(
              lesson.id
            )?.watch_seconds || 0
          )

      };


      activeTrackers.set(
        Number(lesson.id),
        tracker
      );


      /* =====================================
         VIDEO METADATA
      ===================================== */

      video.addEventListener(
        "loadedmetadata",
        function() {

          if (
            Number.isFinite(
              video.duration
            )
          ) {

            tracker.videoDuration =
              Math.round(
                video.duration
              );

          }

        }
      );


      /* =====================================
         PLAY
      ===================================== */

      video.addEventListener(
        "play",
        async function() {

          tracker.lastTick =
            Date.now();


          if (
            !tracker.firstOpened
          ) {

            tracker.firstOpened =
              true;


            await startLessonProgress(
              lesson.id,
              tracker.videoDuration
            );

          }

        }
      );


      /* =====================================
         TIME UPDATE
      ===================================== */

      video.addEventListener(
        "timeupdate",
        async function() {

          if (
            video.paused ||
            video.ended
          ) {

            return;

          }


          const now =
            Date.now();


          if (
            tracker.lastTick
          ) {

            const difference =
              (
                now -
                tracker.lastTick
              ) / 1000;


            /*
              Only count reasonable
              real playback time.
            */

            if (
              difference > 0 &&
              difference <= 5
            ) {

              tracker.watchSeconds +=
                difference;

            }

          }


          tracker.lastTick =
            now;


          /*
            Save approximately every
            10 seconds of watch time.
          */

          if (
            tracker.watchSeconds -
            tracker.lastSaveSeconds >=
            10
          ) {

            tracker.lastSaveSeconds =
              tracker.watchSeconds;


            await saveLessonProgress(
              lesson.id,
              tracker
            );

          }

        }
      );


      /* =====================================
         PAUSE
      ===================================== */

      video.addEventListener(
        "pause",
        async function() {

          tracker.lastTick =
            null;


          await saveLessonProgress(
            lesson.id,
            tracker
          );

        }
      );


      /* =====================================
         ENDED = COMPLETED
      ===================================== */

      video.addEventListener(
        "ended",
        async function() {

          tracker.lastTick =
            null;


          if (
            Number.isFinite(
              video.duration
            )
          ) {

            tracker.videoDuration =
              Math.round(
                video.duration
              );

          }


          tracker.completed =
            true;


          await completeLesson(
            lesson.id,
            tracker
          );

        }
      );


      /* =====================================
         PAGE HIDDEN
      ===================================== */

      document.addEventListener(
        "visibilitychange",
        async function() {

          if (
            document.hidden
          ) {

            tracker.lastTick =
              null;


            await saveLessonProgress(
              lesson.id,
              tracker
            );

          }

        }
      );

    }


    /* =====================================
       START LESSON PROGRESS
    ===================================== */

    async function startLessonProgress(
      lessonId,
      duration
    ) {

      const existing =
        getProgress(
          lessonId
        );


      if (
        existing &&
        existing.first_opened_at
      ) {

        return;

      }


      const now =
        new Date().toISOString();


      const row = {

        student_id:
          CURRENT_STUDENT.id,

        lesson_id:
          Number(lessonId),

        first_opened_at:
          now,

        last_watched_at:
          now,

        watch_seconds:
          Number(
            existing?.watch_seconds || 0
          ),

        video_duration_seconds:
          duration
            ? Number(duration)
            : null,

        completed_at:
          existing?.completed_at ||
          null,

        updated_at:
          now

      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("lesson_progress")
          .upsert(
            row,
            {
              onConflict:
                "student_id,lesson_id"
            }
          )
          .select()
          .maybeSingle();


      if (error) {

        console.error(
          "Start progress error:",
          error
        );

        return;

      }


      if (data) {

        const index =
          ALL_PROGRESS.findIndex(
            item =>
              Number(item.lesson_id) ===
              Number(lessonId)
          );


        if (index >= 0) {

          ALL_PROGRESS[index] =
            data;

        }

        else {

          ALL_PROGRESS.push(
            data
          );

        }

      }

    }


    /* =====================================
       SAVE LESSON PROGRESS
    ===================================== */

    async function saveLessonProgress(
      lessonId,
      tracker
    ) {

      if (
        !CURRENT_STUDENT ||
        !tracker ||
        tracker.saving
      ) {

        return;

      }


      tracker.saving =
        true;


      try {

        const existing =
          getProgress(
            lessonId
          );


        const now =
          new Date().toISOString();


        const firstOpened =
          existing?.first_opened_at ||
          now;


        const duration =
          tracker.videoDuration ||
          existing?.video_duration_seconds ||
          null;


        const row = {

          student_id:
            CURRENT_STUDENT.id,

          lesson_id:
            Number(lessonId),

          first_opened_at:
            firstOpened,

          last_watched_at:
            now,

          watch_seconds:
            Math.max(
              0,
              Math.round(
                tracker.watchSeconds || 0
              )
            ),

          video_duration_seconds:
            duration
              ? Number(duration)
              : null,

          completed_at:
            existing?.completed_at ||
            null,

          updated_at:
            now

        };


        const {
          data,
          error
        } =
          await supabaseClient
            .from("lesson_progress")
            .upsert(
              row,
              {
                onConflict:
                  "student_id,lesson_id"
              }
            )
            .select()
            .maybeSingle();


        if (error) {

          console.error(
            "Save progress error:",
            error
          );

          return;

        }


        if (data) {

          const index =
            ALL_PROGRESS.findIndex(
              item =>
                Number(item.lesson_id) ===
                Number(lessonId)
            );


          if (index >= 0) {

            ALL_PROGRESS[index] =
              data;

          }

          else {

            ALL_PROGRESS.push(
              data
            );

          }

        }

      }

      finally {

        tracker.saving =
          false;

      }

    }


    /* =====================================
       COMPLETE LESSON
    ===================================== */

    async function completeLesson(
      lessonId,
      tracker
    ) {

      if (!CURRENT_STUDENT) {
        return;
      }


      const existing =
        getProgress(
          lessonId
        );


      const now =
        new Date().toISOString();


      const duration =
        tracker?.videoDuration ||
        existing?.video_duration_seconds ||
        null;


      const watchSeconds =
        Math.max(
          0,
          Math.round(
            tracker?.watchSeconds ||
            existing?.watch_seconds ||
            0
          )
        );


      /*
        If this is a manual Complete
        without watching the video,
        first_opened_at can still be
        created now.
      */

      const row = {

        student_id:
          CURRENT_STUDENT.id,

        lesson_id:
          Number(lessonId),

        first_opened_at:
          existing?.first_opened_at ||
          now,

        last_watched_at:
          now,

        watch_seconds:
          watchSeconds,

        video_duration_seconds:
          duration
            ? Number(duration)
            : null,

        completed_at:
          now,

        updated_at:
          now

      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("lesson_progress")
          .upsert(
            row,
            {
              onConflict:
                "student_id,lesson_id"
            }
          )
          .select()
          .maybeSingle();


      if (error) {

        console.error(
          "Complete lesson error:",
          error
        );

        throw error;

      }


      if (data) {

        const index =
          ALL_PROGRESS.findIndex(
            item =>
              Number(item.lesson_id) ===
              Number(lessonId)
          );


        if (index >= 0) {

          ALL_PROGRESS[index] =
            data;

        }

        else {

          ALL_PROGRESS.push(
            data
          );

        }

      }


      /*
        Stop active tracker.
      */

      activeTrackers.delete(
        Number(lessonId)
      );


      /*
        Find next lesson.
      */

      const currentLesson =
        ALL_LESSONS.find(
          lesson =>
            Number(lesson.id) ===
            Number(lessonId)
        );


      if (!currentLesson) {

        renderCourses();

        return;

      }


      const courseLessons =
        ALL_LESSONS
          .filter(
            lesson =>
              lesson.course ===
              currentLesson.course
          )
          .sort(
            (a, b) =>
              Number(a.id) -
              Number(b.id)
          );


      const currentIndex =
        courseLessons.findIndex(
          lesson =>
            Number(lesson.id) ===
            Number(lessonId)
        );


      const nextLesson =
        courseLessons[
          currentIndex + 1
        ];


      /*
        Re-render.
        This unlocks the next lesson.
      */

      renderCourses();


      /*
        Scroll to next lesson.
      */

      if (nextLesson) {

        setTimeout(
          function() {

            const nextElement =
              document.getElementById(
                "lesson-" +
                nextLesson.id
              );


            if (nextElement) {

              nextElement.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });


              nextElement.style.border =
                "2px solid #22c55e";


              setTimeout(
                function() {

                  nextElement.style.border =
                    "1px solid #e5e7eb";

                },
                3000
              );

            }

          },
          700
        );

      }

    }


    /* =====================================
       CHANGE PASSWORD
    ===================================== */

    passwordForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const newPassword =
          document.getElementById(
            "newPassword"
          ).value;


        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value;


        if (
          newPassword.length < 6
        ) {

          showPasswordMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;

        }


        if (
          newPassword !==
          confirmPassword
        ) {

          showPasswordMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        const button =
          document.getElementById(
            "changePasswordBtn"
          );


        button.disabled =
          true;


        button.textContent =
          "Changing...";


        try {

          const {
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password:
                  newPassword
              });


          if (error) {

            throw error;

          }


          showPasswordMessage(
            "Password changed successfully!",
            "success"
          );


          passwordForm.reset();

        }

        catch (error) {

          console.error(
            error
          );


          showPasswordMessage(
            error.message ||
            "Could not change password.",
            "error"
          );

        }

        finally {

          button.disabled =
            false;


          button.textContent =
            "Change Password";

        }

      }
    );


    /* =====================================
       LOGOUT
    ===================================== */

    document.getElementById(
      "logoutBtn"
    ).addEventListener(
      "click",
      async function() {

        /*
          Save active video progress
          before logout.
        */

        for (
          const tracker of
          activeTrackers.values()
        ) {

          await saveLessonProgress(
            tracker.lessonId,
            tracker
          );

        }


        await supabaseClient.auth.signOut();


        window.location.href =
          "login.html";

      }
    );


    /* =====================================
       SAVE BEFORE PAGE CLOSE
    ===================================== */

    window.addEventListener(
      "beforeunload",
      function() {

        /*
          Browser may not wait for async
          Supabase requests here.
        */

        activeTrackers.forEach(
          tracker => {

            tracker.lastTick =
              null;

          }
        );

      }
    );


    /* =====================================
       START
    ===================================== */

    (async function() {

      const student =
        await loadStudent();


      if (!student) {

        return;

      }


      await loadCourses();

    })();

  </script>
