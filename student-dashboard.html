<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Dashboard | MN Technology</title>

  <!-- IMPORTANT: lowercase @supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
    }

    .navbar {
      background: #051223;
      color: white;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #22d3ee;
      color: #051223;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .username-display {
      font-size: 14px;
      color: #d9faff;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .welcome {
      background: linear-gradient(135deg, #051223, #0a1f3d);
      color: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .welcome h1 {
      margin-bottom: 8px;
      font-size: 26px;
    }

    .welcome p {
      color: #c9d8e8;
    }

    .section-title {
      margin: 25px 0 15px;
      font-size: 22px;
    }

    .course-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .course-title {
      color: #0a1f3d;
      font-size: 21px;
      margin-bottom: 18px;
      border-bottom: 2px solid #e8eef5;
      padding-bottom: 10px;
    }

    .lesson-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      background: #fbfdff;
    }

    .lesson-card.locked {
      opacity: .65;
      background: #f1f5f9;
    }

    .lesson-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .lesson-title {
      font-size: 18px;
      font-weight: bold;
      color: #172033;
    }

    .lesson-number {
      background: #0a1f3d;
      color: white;
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .lesson-description {
      color: #64748b;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-locked {
      background: #e2e8f0;
      color: #475569;
    }

    .status-open {
      background: #dcfce7;
      color: #166534;
    }

    .status-completed {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .video-wrapper {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
    }

    .video-wrapper video {
      width: 100%;
      max-height: 520px;
      display: block;
      background: black;
    }

    .watermark {
      position: absolute;
      left: 15px;
      top: 15px;
      color: rgba(255,255,255,.75);
      background: rgba(0,0,0,.35);
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 12px;
      pointer-events: none;
      z-index: 5;
      user-select: none;
    }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button,
    .pdf-btn {
      border: none;
      border-radius: 7px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .watch-btn {
      background: #0a1f3d;
      color: white;
    }

    .watch-btn:hover {
      background: #12325e;
    }

    .complete-btn {
      background: #16a34a;
      color: white;
    }

    .complete-btn:hover {
      background: #15803d;
    }

    .complete-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .pdf-btn {
      background: #7c3aed;
      color: white;
    }

    .pdf-btn:hover {
      background: #6d28d9;
    }

    .locked-btn {
      background: #cbd5e1;
      color: #475569;
      cursor: not-allowed;
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .empty {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 12px;
      color: #64748b;
    }

    .password-card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
      margin-top: 30px;
    }

    .password-card h2 {
      margin-bottom: 15px;
    }

    .password-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .password-form input {
      flex: 1;
      min-width: 220px;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      outline: none;
    }

    .password-form button {
      background: #0a1f3d;
      color: white;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    @media (max-width: 700px) {
      .navbar {
        padding: 12px;
      }

      .username-display {
        display: none;
      }

      .lesson-header {
        flex-direction: column;
      }

      .lesson-actions {
        flex-direction: column;
      }

      .lesson-actions button,
      .lesson-actions a {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="brand">
      <div class="logo">MN</div>
      <span>MN Technology</span>
    </div>

    <div class="user-area">
      <span class="username-display" id="usernameDisplay"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="container">

    <div id="message" class="message"></div>

    <section class="welcome">
      <h1>Welcome to MN Technology 👋</h1>
      <p id="welcomeText">Loading your account...</p>
    </section>

    <h2 class="section-title">📚 Available Lessons</h2>

    <div id="lessonsContainer">
      <div class="loading">Loading lessons...</div>
    </div>

    <section class="password-card">
      <h2>🔐 Change Password</h2>

      <form class="password-form" onsubmit="changePassword(event)">
        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          minlength="6"
          required
        >

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="6"
          required
        >

        <button type="submit">
          Change Password
        </button>
      </form>
    </section>

  </main>

<script>
  /* =========================================================
     SUPABASE CONFIGURATION
     ========================================================= */

  const SUPABASE_URL =
    "https://ekanfqwbqwfhjfgctouk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const VIDEO_BUCKET = "Video";

  let CURRENT_USER = null;
  let CURRENT_STUDENT = null;

  let ALL_LESSONS = [];
  let ALL_PROGRESS = [];

  let activeTrackers = new Map();


  /* =========================================================
     MESSAGE
     ========================================================= */

  function showMessage(text, type = "success") {
    const box = document.getElementById("message");

    box.textContent = text;
    box.className = "message " + type;

    setTimeout(() => {
      box.className = "message";
    }, 5000);
  }


  /* =========================================================
     AUTH / STUDENT
     ========================================================= */

  async function loadStudent() {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      window.location.href = "login.html";
      return;
    }

    CURRENT_USER = user;

    const { data: student, error } =
      await supabaseClient
        .from("student_accounts")
        .select("id, username, course_access")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {
      console.error(error);
      showMessage(
        "Student account එක ලබාගැනීමට නොහැකි විය.",
        "error"
      );
      return;
    }

    if (!student) {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
      return;
    }

    CURRENT_STUDENT = student;

    document.getElementById("usernameDisplay").textContent =
      student.username;

    document.getElementById("welcomeText").textContent =
      `Welcome ${student.username}. ඔබට ලබාදී ඇති පාඨමාලා වල පාඩම් මෙහිදී අධ්‍යයනය කළ හැක.`;


    await loadProgress();
    await loadLessons();
  }


  /* =========================================================
     LOAD PROGRESS
     ========================================================= */

  async function loadProgress() {

    if (!CURRENT_STUDENT) return;

    const { data, error } =
      await supabaseClient
        .from("lesson_progress")
        .select("*")
        .eq("student_id", CURRENT_STUDENT.id);

    if (error) {
      console.error("Progress error:", error);
      ALL_PROGRESS = [];
      return;
    }

    ALL_PROGRESS = data || [];
  }


  /* =========================================================
     LOAD LESSONS
     ========================================================= */

  async function loadLessons() {

    if (!CURRENT_STUDENT) return;

    const courseAccess =
      Array.isArray(CURRENT_STUDENT.course_access)
        ? CURRENT_STUDENT.course_access
        : [];

    if (courseAccess.length === 0) {

      document.getElementById("lessonsContainer").innerHTML =
        `<div class="empty">
          ඔබට තවමත් කිසිදු පාඨමාලාවකට access ලබාදී නැත.
        </div>`;

      return;
    }


    const { data, error } =
      await supabaseClient
        .from("lessons")
        .select(
          "id,title,course,description,video_path,pdf_path,created_at"
        )
        .in("course", courseAccess)
        .order("id", { ascending: true });


    if (error) {

      console.error("Lessons error:", error);

      document.getElementById("lessonsContainer").innerHTML =
        `<div class="empty">
          Lessons ලබාගැනීමේදී දෝෂයක් ඇතිවිය.
        </div>`;

      return;
    }


    ALL_LESSONS = data || [];

    renderCourses();
  }


  /* =========================================================
     GROUP COURSES
     ========================================================= */

  function renderCourses() {

    const container =
      document.getElementById("lessonsContainer");

    if (!ALL_LESSONS.length) {

      container.innerHTML =
        `<div class="empty">
          ඔබට ලබාදී ඇති පාඨමාලා සඳහා තවමත් lessons නැත.
        </div>`;

      return;
    }


    const grouped = {};

    ALL_LESSONS.forEach(lesson => {

      if (!grouped[lesson.course]) {
        grouped[lesson.course] = [];
      }

      grouped[lesson.course].push(lesson);
    });


    container.innerHTML = "";


    Object.keys(grouped).forEach(courseName => {

      const courseLessons = grouped[courseName];

      courseLessons.sort(
        (a, b) => Number(a.id) - Number(b.id)
      );


      const courseCard =
        document.createElement("section");

      courseCard.className = "course-card";


      const title =
        document.createElement("h3");

      title.className = "course-title";

      title.textContent =
        `📘 ${courseName}`;


      courseCard.appendChild(title);


      courseLessons.forEach(
        (lesson, index) => {

          const lessonElement =
            createLessonElement(
              lesson,
              index,
              courseLessons
            );

          courseCard.appendChild(
            lessonElement
          );
        }
      );


      container.appendChild(courseCard);
    });
  }


  /* =========================================================
     PROGRESS HELPERS
     ========================================================= */

  function getProgress(lessonId) {

    return ALL_PROGRESS.find(
      item =>
        Number(item.lesson_id) === Number(lessonId)
    );
  }


  function isLessonCompleted(lessonId) {

    const progress =
      getProgress(lessonId);

    return !!(
      progress &&
      progress.completed_at
    );
  }


  function isLessonUnlocked(
    lesson,
    courseLessons
  ) {

    const lessonIndex =
      courseLessons.findIndex(
        item =>
          Number(item.id) === Number(lesson.id)
      );


    if (lessonIndex === -1) {
      return false;
    }


    // First lesson is always unlocked.
    if (lessonIndex === 0) {
      return true;
    }


    const previousLesson =
      courseLessons[lessonIndex - 1];


    return isLessonCompleted(
      previousLesson.id
    );
  }


  /* =========================================================
     CREATE LESSON CARD
     ========================================================= */

  function createLessonElement(
    lesson,
    index,
    courseLessons
  ) {

    const card =
      document.createElement("div");

    card.className = "lesson-card";


    const completed =
      isLessonCompleted(lesson.id);


    const unlocked =
      isLessonUnlocked(
        lesson,
        courseLessons
      );


    if (!unlocked) {
      card.classList.add("locked");
    }


    const progress =
      getProgress(lesson.id);


    let statusHTML = "";


    if (completed) {

      statusHTML =
        `<span class="status status-completed">
          ✅ Completed
        </span>`;

    } else if (unlocked) {

      statusHTML =
        `<span class="status status-open">
          🔓 Available
        </span>`;

    } else {

      statusHTML =
        `<span class="status status-locked">
          🔒 Locked
        </span>`;
    }


    const safeTitle =
      escapeHtml(lesson.title || "Untitled Lesson");

    const safeDescription =
      escapeHtml(
        lesson.description || ""
      );


    card.innerHTML = `

      <div class="lesson-header">

        <div style="display:flex; gap:12px; align-items:flex-start;">

          <span class="lesson-number">
            ${index + 1}
          </span>

          <div>

            <div class="lesson-title">
              ${safeTitle}
            </div>

            <div style="margin-top:7px;">
              ${statusHTML}
            </div>

          </div>

        </div>

      </div>


      ${
        safeDescription
          ? `<div class="lesson-description">
              ${safeDescription}
            </div>`
          : ""
      }


      <div
        id="video-area-${lesson.id}"
        class="video-wrapper"
      >

        <video
          id="video-${lesson.id}"
          preload="metadata"
          playsinline
        ></video>

        <div
          id="watermark-${lesson.id}"
          class="watermark"
        >
          MN TECHNOLOGY
        </div>

      </div>


      <div class="lesson-actions">

        ${
          unlocked
          ?
          `<button
              class="watch-btn"
              onclick="openLessonVideo(${lesson.id})"
            >
              ▶ Watch Lesson
            </button>`
          :
          `<button
              class="locked-btn"
              disabled
            >
              🔒 Complete previous lesson
            </button>`
        }


        ${
          lesson.pdf_path
          ?
          `<button
              class="pdf-btn"
              onclick="downloadPDF('${encodeURIComponent(lesson.pdf_path)}')"
            >
              📄 Download PDF
            </button>`
          :
          ""
        }


        ${
          completed
          ?
          `<button
              class="complete-btn"
              disabled
            >
              ✅ Completed
            </button>`
          :
          unlocked
          ?
          `<button
              id="complete-btn-${lesson.id}"
              class="complete-btn"
              onclick="completeLessonManually(${lesson.id})"
            >
              ☑ Lesson Complete
            </button>`
          :
          ""
        }

      </div>


      ${
        progress
        ?
        `<div
          style="
            margin-top:12px;
            font-size:13px;
            color:#64748b;
          "
        >
          ${
            progress.watch_seconds
              ? "Watched: " +
                formatTime(progress.watch_seconds)
              : "Not watched yet"
          }
        </div>`
        :
        ""
      }

    `;


    return card;
  }


  /* =========================================================
     OPEN VIDEO
     ========================================================= */

  async function openLessonVideo(lessonId) {

    const lesson =
      ALL_LESSONS.find(
        item =>
          Number(item.id) === Number(lessonId)
      );

    if (!lesson) return;


    const courseLessons =
      ALL_LESSONS
        .filter(
          item =>
            item.course === lesson.course
        )
        .sort(
          (a, b) =>
            Number(a.id) - Number(b.id)
        );


    if (
      !isLessonUnlocked(
        lesson,
        courseLessons
      )
    ) {

      showMessage(
        "මෙම lesson එක unlock වී නැත.",
        "error"
      );

      return;
    }


    const area =
      document.getElementById(
        `video-area-${lesson.id}`
      );

    const video =
      document.getElementById(
        `video-${lesson.id}`
      );


    area.style.display = "block";


    if (!video.src) {

      await loadSecureVideo(
        lesson,
        video
      );
    }


    if (
      video.requestFullscreen &&
      window.innerWidth < 700
    ) {
      // Do not automatically fullscreen on mobile.
    }


    area.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }


  /* =========================================================
     PRIVATE VIDEO SIGNED URL
     ========================================================= */

  async function loadSecureVideo(
    lesson,
    video
  ) {

    if (!lesson.video_path) {

      showMessage(
        "මෙම lesson එකට video එකක් නැත.",
        "error"
      );

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(VIDEO_BUCKET)
        .createSignedUrl(
          lesson.video_path,
          7200
        );


    if (error || !data?.signedUrl) {

      console.error(
        "Signed URL error:",
        error
      );

      showMessage(
        "Video එක load කිරීමට නොහැකි විය.",
        "error"
      );

      return;
    }


    video.src =
      data.signedUrl;


    video.setAttribute(
      "controlsList",
      "nodownload noremoteplayback nofullscreen"
    );

    video.setAttribute(
      "disablePictureInPicture",
      ""
    );


    video.addEventListener(
      "contextmenu",
      event => {
        event.preventDefault();
      }
    );


    setupVideoTracking(
      lesson,
      video
    );
  }


  /* =========================================================
     VIDEO TRACKING
     ========================================================= */

  function setupVideoTracking(
    lesson,
    video
  ) {

    if (
      video.dataset.trackingReady === "true"
    ) {
      return;
    }


    video.dataset.trackingReady = "true";


    video.addEventListener(
      "loadedmetadata",
      async () => {

        await startLessonProgress(
          lesson.id,
          video.duration
        );
      }
    );


    video.addEventListener(
      "play",
      async () => {

        await startLessonProgress(
          lesson.id,
          video.duration
        );


        const existing =
          activeTrackers.get(
            Number(lesson.id)
          );


        activeTrackers.set(
          Number(lesson.id),
          {
            lastTick: Date.now(),
            lastSave: Date.now(),
            video: video
          }
        );
      }
    );


    video.addEventListener(
      "timeupdate",
      async () => {

        const tracker =
          activeTrackers.get(
            Number(lesson.id)
          );


        if (!tracker) return;


        const now = Date.now();

        const diff =
          (now - tracker.lastTick) / 1000;


        tracker.lastTick = now;


        // Ignore abnormal jumps.
        if (
          diff > 0 &&
          diff <= 5
        ) {

          const progress =
            getProgress(lesson.id);


          if (progress) {

            progress.watch_seconds =
              Number(
                progress.watch_seconds || 0
              ) + diff;

            progress.last_watched_at =
              new Date().toISOString();


            const elapsedSinceSave =
              now - tracker.lastSave;


            if (
              elapsedSinceSave >= 10000
            ) {

              tracker.lastSave = now;

              await saveLessonProgress(
                lesson.id,
                {
                  watch_seconds:
                    Math.floor(
                      progress.watch_seconds
                    ),

                  last_watched_at:
                    progress.last_watched_at,

                  video_duration_seconds:
                    Number.isFinite(
                      video.duration
                    )
                    ?
                    Math.floor(
                      video.duration
                    )
                    :
                    null
                }
              );
            }
          }
        }
      }
    );


    video.addEventListener(
      "pause",
      async () => {

        await saveCurrentVideoProgress(
          lesson.id,
          video
        );
      }
    );


    video.addEventListener(
      "ended",
      async () => {

        await saveCurrentVideoProgress(
          lesson.id,
          video
        );


        /*
          Video ending automatically marks
          the lesson completed.
        */
        await completeLessonManually(
          lesson.id,
          true
        );
      }
    );
  }


  /* =========================================================
     START PROGRESS
     ========================================================= */

  async function startLessonProgress(
    lessonId,
    duration
  ) {

    if (!CURRENT_STUDENT) return;


    let progress =
      getProgress(lessonId);


    const now =
      new Date().toISOString();


    if (!progress) {

      const payload = {

        student_id:
          CURRENT_STUDENT.id,

        lesson_id:
          Number(lessonId),

        first_opened_at:
          now,

        last_watched_at:
          now,

        watch_seconds:
          0,

        video_duration_seconds:
          Number.isFinite(duration)
          ?
          Math.floor(duration)
          :
          null

      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("lesson_progress")
          .insert(payload)
          .select()
          .maybeSingle();


      if (error) {

        console.error(
          "Start progress error:",
          error
        );

        return;
      }


      if (data) {

        ALL_PROGRESS.push(data);
      }

    } else {

      const updates = {

        last_watched_at:
          now,

        video_duration_seconds:
          Number.isFinite(duration)
          ?
          Math.floor(duration)
          :
          progress.video_duration_seconds

      };


      const {
        error
      } =
        await supabaseClient
          .from("lesson_progress")
          .update(updates)
          .eq("id", progress.id);


      if (error) {
        console.error(error);
      }


      Object.assign(
        progress,
        updates
      );
    }
  }


  /* =========================================================
     SAVE VIDEO PROGRESS
     ========================================================= */

  async function saveCurrentVideoProgress(
    lessonId,
    video
  ) {

    const tracker =
      activeTrackers.get(
        Number(lessonId)
      );


    if (tracker) {

      tracker.lastTick =
        Date.now();
    }


    const progress =
      getProgress(lessonId);


    if (!progress) {

      await startLessonProgress(
        lessonId,
        video.duration
      );

      return;
    }


    const updates = {

      watch_seconds:
        Math.floor(
          Number(
            progress.watch_seconds || 0
          )
        ),

      last_watched_at:
        new Date().toISOString(),

      video_duration_seconds:
        Number.isFinite(
          video.duration
        )
        ?
        Math.floor(
          video.duration
        )
        :
        progress.video_duration_seconds
    };


    await saveLessonProgress(
      lessonId,
      updates
    );
  }


  /* =========================================================
     SAVE PROGRESS
     ========================================================= */

  async function saveLessonProgress(
    lessonId,
    updates
  ) {

    if (!CURRENT_STUDENT) return;


    let progress =
      getProgress(lessonId);


    if (!progress) {

      await startLessonProgress(
        lessonId,
        updates.video_duration_seconds
      );

      progress =
        getProgress(lessonId);

      if (!progress) return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("lesson_progress")
        .update(updates)
        .eq("id", progress.id)
        .eq(
          "student_id",
          CURRENT_STUDENT.id
        );


    if (error) {

      console.error(
        "Save progress error:",
        error
      );

      return;
    }


    Object.assign(
      progress,
      updates
    );
  }


  /* =========================================================
     LESSON COMPLETE
     ========================================================= */

  async function completeLessonManually(
    lessonId,
    automatic = false
  ) {

    if (!CURRENT_STUDENT) return;


    const lesson =
      ALL_LESSONS.find(
        item =>
          Number(item.id) === Number(lessonId)
      );


    if (!lesson) return;


    const courseLessons =
      ALL_LESSONS
        .filter(
          item =>
            item.course === lesson.course
        )
        .sort(
          (a, b) =>
            Number(a.id) - Number(b.id)
        );


    if (
      !isLessonUnlocked(
        lesson,
        courseLessons
      )
    ) {

      if (!automatic) {

        showMessage(
          "මෙම lesson එක තවම unlock වී නැත.",
          "error"
        );
      }

      return;
    }


    /*
      If video is currently playing,
      pause it and save progress first.
    */

    const video =
      document.getElementById(
        `video-${lesson.id}`
      );


    if (
      video &&
      !video.paused &&
      !video.ended
    ) {

      video.pause();

      await saveCurrentVideoProgress(
        lesson.id,
        video
      );
    }


    let progress =
      getProgress(lesson.id);


    const now =
      new Date().toISOString();


    /*
      IMPORTANT:
      Student may click Complete even
      without watching the video.

      Therefore watch_seconds remains 0
      if there is no previous progress.
    */

    if (!progress) {

      const payload = {

        student_id:
          CURRENT_STUDENT.id,

        lesson_id:
          Number(lesson.id),

        first_opened_at:
          now,

        last_watched_at:
          now,

        watch_seconds:
          0,

        video_duration_seconds:
          video &&
          Number.isFinite(video.duration)
          ?
          Math.floor(video.duration)
          :
          null,

        completed_at:
          now
      };


      const {
        data,
        error
      } =
        await supabaseClient
          .from("lesson_progress")
          .insert(payload)
          .select()
          .maybeSingle();


      if (error) {

        console.error(
          "Complete insert error:",
          error
        );

        showMessage(
          "Lesson complete කිරීමේදී දෝෂයක් ඇතිවිය.",
          "error"
        );

        return;
      }


      if (data) {

        ALL_PROGRESS.push(data);
      }

    } else {

      const updates = {

        completed_at:
          now,

        last_watched_at:
          now

      };


      const {
        error
      } =
        await supabaseClient
          .from("lesson_progress")
          .update(updates)
          .eq("id", progress.id)
          .eq(
            "student_id",
            CURRENT_STUDENT.id
          );


      if (error) {

        console.error(
          "Complete update error:",
          error
        );

        showMessage(
          "Lesson complete කිරීමේදී දෝෂයක් ඇතිවිය.",
          "error"
        );

        return;
      }


      Object.assign(
        progress,
        updates
      );
    }


    /*
      Re-render.
      This automatically unlocks the
      next lesson.
    */

    renderCourses();


    if (!automatic) {

      showMessage(
        "✅ Lesson එක සාර්ථකව Complete කළා! ඊළඟ lesson එක දැන් unlock වී ඇත."
      );
    }


    /*
      Find next lesson and scroll to it.
    */

    const currentIndex =
      courseLessons.findIndex(
        item =>
          Number(item.id) === Number(lesson.id)
      );


    const nextLesson =
      courseLessons[currentIndex + 1];


    if (nextLesson) {

      setTimeout(() => {

        const nextCard =
          document.getElementById(
            `video-area-${nextLesson.id}`
          );

        if (nextCard) {

          nextCard
            .closest(".lesson-card")
            ?.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });
        }

      }, 500);
    }
  }


  /* =========================================================
     PDF DOWNLOAD
     ========================================================= */

  async function downloadPDF(
    encodedPath
  ) {

    try {

      const path =
        decodeURIComponent(
          encodedPath
        );


      if (!path) return;


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from(VIDEO_BUCKET)
          .createSignedUrl(
            path,
            300,
            {
              download: true
            }
          );


      if (
        error ||
        !data?.signedUrl
      ) {

        console.error(
          "PDF signed URL error:",
          error
        );

        showMessage(
          "PDF එක download කිරීමට නොහැකි විය.",
          "error"
        );

        return;
      }


      const link =
        document.createElement("a");

      link.href =
        data.signedUrl;

      link.target = "_blank";

      link.rel =
        "noopener noreferrer";

      document.body.appendChild(link);

      link.click();

      link.remove();

    } catch (error) {

      console.error(error);

      showMessage(
        "PDF download error.",
        "error"
      );
    }
  }


  /* =========================================================
     WATERMARK MOVEMENT
     ========================================================= */

  setInterval(() => {

    document
      .querySelectorAll(".watermark")
      .forEach(watermark => {

        const x =
          Math.floor(
            Math.random() * 70
          );

        const y =
          Math.floor(
            Math.random() * 70
          );

        watermark.style.left =
          x + "%";

        watermark.style.top =
          y + "%";
      });

  }, 15000);


  /* =========================================================
     FORMAT TIME
     ========================================================= */

  function formatTime(seconds) {

    seconds =
      Math.max(
        0,
        Math.floor(
          Number(seconds) || 0
        )
      );


    const hours =
      Math.floor(
        seconds / 3600
      );


    const minutes =
      Math.floor(
        (seconds % 3600) / 60
      );


    const secs =
      seconds % 60;


    if (hours > 0) {

      return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
      );

    }


    return (
      String(minutes).padStart(2, "0") +
      ":" +
      String(secs).padStart(2, "0")
    );
  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /* =========================================================
     CHANGE PASSWORD
     ========================================================= */

  async function changePassword(event) {

    event.preventDefault();


    const newPassword =
      document.getElementById(
        "newPassword"
      ).value.trim();


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      ).value.trim();


    if (
      newPassword.length < 6
    ) {

      showMessage(
        "Password එක අවම වශයෙන් characters 6ක් විය යුතුයි.",
        "error"
      );

      return;
    }


    if (
      newPassword !==
      confirmPassword
    ) {

      showMessage(
        "Passwords දෙක සමාන නැත.",
        "error"
      );

      return;
    }


    const {
      error
    } =
      await supabaseClient.auth
        .updateUser({
          password:
            newPassword
        });


    if (error) {

      console.error(error);

      showMessage(
        "Password වෙනස් කිරීමට නොහැකි විය: " +
        error.message,
        "error"
      );

      return;
    }


    document.getElementById(
      "newPassword"
    ).value = "";

    document.getElementById(
      "confirmPassword"
    ).value = "";


    showMessage(
      "✅ Password එක සාර්ථකව වෙනස් කළා."
    );
  }


  /* =========================================================
     SAVE BEFORE LEAVING
     ========================================================= */

  document.addEventListener(
    "visibilitychange",
    async () => {

      if (
        document.visibilityState ===
        "hidden"
      ) {

        for (
          const [
            lessonId,
            tracker
          ]
          of activeTrackers
        ) {

          if (tracker.video) {

            await saveCurrentVideoProgress(
              lessonId,
              tracker.video
            );
          }
        }
      }
    }
  );


  /* =========================================================
     LOGOUT
     ========================================================= */

  async function logout() {

    /*
      Save active video progress first.
    */

    for (
      const [
        lessonId,
        tracker
      ]
      of activeTrackers
    ) {

      if (tracker.video) {

        await saveCurrentVideoProgress(
          lessonId,
          tracker.video
        );
      }
    }


    const {
      error
    } =
      await supabaseClient.auth.signOut();


    if (error) {

      console.error(error);

      showMessage(
        "Logout කිරීමේදී දෝෂයක් ඇතිවිය.",
        "error"
      );

      return;
    }


    window.location.href =
      "login.html";
  }


  /* =========================================================
     INITIAL LOAD
     ========================================================= */

  loadStudent();

</script>
