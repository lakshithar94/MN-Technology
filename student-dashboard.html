<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | MN Technology</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    /* NAVBAR */
    .navbar {
      background: #051223;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #22d3ee;
      color: #051223;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .password-btn {
      background: #22d3ee;
      color: #051223;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 18px;
    }

    /* WELCOME */
    .welcome {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .welcome h2 {
      margin: 0 0 8px;
      color: #051223;
    }

    .welcome p {
      margin: 0;
      color: #667085;
    }

    /* SECTION */
    .section {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .section h2 {
      margin-top: 0;
      margin-bottom: 18px;
      color: #051223;
    }

    /* COURSE */
    .course {
      margin-bottom: 25px;
    }

    .course-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #0f172a;
    }

    /* LESSON LIST */
    .lessons {
      display: grid;
      gap: 12px;
    }

    .lesson {
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      padding: 18px;
      background: #fff;
      transition: 0.2s;
    }

    .lesson-unlocked {
      cursor: pointer;
    }

    .lesson-unlocked:hover {
      border-color: #22d3ee;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.06);
    }

    .lesson-locked {
      background: #f8fafc;
      cursor: not-allowed;
      opacity: 0.85;
    }

    .lesson-number {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .lesson-title {
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 7px;
    }

    .lesson-description {
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .lesson-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .status-locked {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-unlocked {
      background: #dcfce7;
      color: #166534;
    }

    .status-watching {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-completed {
      background: #ede9fe;
      color: #6d28d9;
    }

    .click-hint {
      margin-top: 12px;
      color: #0891b2;
      font-size: 14px;
      font-weight: bold;
    }

    .locked-message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #fff1f2;
      color: #be123c;
      font-size: 14px;
    }

    /* LESSON VIEWER */
    .lesson-viewer {
      display: none;
    }

    .back-btn {
      border: none;
      background: #e2e8f0;
      color: #0f172a;
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .back-btn:hover {
      background: #cbd5e1;
    }

    .viewer-header {
      margin-bottom: 18px;
    }

    .viewer-header h2 {
      margin: 0 0 7px;
      color: #051223;
    }

    .viewer-course {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .viewer-description {
      color: #475569;
      line-height: 1.6;
    }

    /* VIDEO */
    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 18px;
    }

    .video-container video {
      width: 100%;
      display: block;
      max-height: 650px;
      background: black;
    }

    .watermark {
      position: absolute;
      top: 18px;
      left: 18px;
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      font-weight: bold;
      pointer-events: none;
      z-index: 5;
      user-select: none;
      text-shadow: 1px 1px 3px #000;
    }

    .fullscreen-btn {
      position: absolute;
      right: 12px;
      bottom: 55px;
      z-index: 10;
      background: rgba(0,0,0,0.65);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 7px;
      padding: 8px 11px;
      cursor: pointer;
    }

    /* ACTIONS */
    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .action-btn {
      border: none;
      padding: 11px 17px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .complete-btn {
      background: #16a34a;
      color: white;
    }

    .complete-btn:hover {
      background: #15803d;
    }

    .pdf-btn {
      background: #2563eb;
      color: white;
    }

    .pdf-btn:hover {
      background: #1d4ed8;
    }

    .completed-message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #047857;
      font-weight: bold;
    }

    /* PASSWORD */
    .password-form {
      display: none;
      margin-top: 15px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      max-width: 500px;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    .save-password {
      border: none;
      background: #051223;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }

    /* LOADING */
    .loading {
      padding: 20px;
      text-align: center;
      color: #64748b;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .navbar {
        padding: 11px 12px;
      }

      .brand {
        font-size: 16px;
      }

      .logo {
        width: 38px;
        height: 38px;
      }

      .nav-actions {
        gap: 5px;
      }

      .nav-btn {
        padding: 8px 9px;
        font-size: 12px;
      }

      .container {
        margin-top: 15px;
        padding: 0 10px;
      }

      .section,
      .welcome {
        padding: 16px;
        border-radius: 12px;
      }

      .lesson {
        padding: 15px;
      }

      .video-container video {
        max-height: 400px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="brand">
      <div class="logo">MN</div>
      <span>MN Technology</span>
    </div>

    <div class="nav-actions">
      <button class="nav-btn password-btn" id="passwordToggle">
        🔑 Change Password
      </button>

      <button class="nav-btn logout-btn" id="logoutButton">
        Logout
      </button>
    </div>
  </nav>

  <div class="container">

    <!-- WELCOME -->
    <div class="welcome">
      <h2>Welcome, <span id="studentName">Student</span> 👋</h2>
      <p>Welcome to your MN Technology learning dashboard.</p>
    </div>

    <!-- LESSON LIST -->
    <div class="section" id="lessonsSection">
      <h2>📚 Available Lessons</h2>

      <div id="lessonsList">
        <div class="loading">Loading lessons...</div>
      </div>
    </div>

    <!-- LESSON VIEWER -->
    <div class="section lesson-viewer" id="lessonViewer">

      <button type="button" class="back-btn" id="backToLessons">
        ⬅️ Back to Lessons
      </button>

      <div id="lessonViewerContent"></div>

    </div>

    <!-- CHANGE PASSWORD -->
    <div class="section">
      <h2>🔑 Change Password</h2>

      <div class="password-form" id="passwordForm">

        <div class="input-group">
          <label for="oldPassword">Current Password</label>
          <input
            type="password"
            id="oldPassword"
            placeholder="Enter current password"
          >
        </div>

        <div class="input-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
          >
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
          >
        </div>

        <button class="save-password" id="savePassword">
          Save Password
        </button>

        <div class="message" id="passwordMessage"></div>

      </div>
    </div>

  </div>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================================
       SUPABASE CONFIG
    ========================================= */

    const SUPABASE_URL =
      "https://ekanfqwbqwfhjfgctouk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_tpFTptBWglmisRRhQiptmg_VkKhJdDn";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       GLOBAL VARIABLES
    ========================================= */

    let currentStudent = null;
    let currentProgress = [];
    let lessons = [];

    /*
      Only one lesson viewer is active at a time.
      Watch time continues to be tracked in background.
    */
    const activeTrackers = new Map();

    let currentViewerLessonId = null;
    let currentWatermarkInterval = null;


    /* =========================================
       LOAD STUDENT
    ========================================= */

    async function loadStudent() {

      const username =
        localStorage.getItem("studentUsername");

      if (!username) {
        window.location.href = "login.html";
        return;
      }

      const { data, error } =
        await supabaseClient
          .from("student_accounts")
          .select("*")
          .eq("username", username)
          .single();

      if (error || !data) {
        alert("Student account not found.");
        localStorage.removeItem("studentUsername");
        window.location.href = "login.html";
        return;
      }

      currentStudent = data;

      document.getElementById("studentName").textContent =
        data.username;

      await loadProgress();
      await loadCourses();
    }


    /* =========================================
       LOAD PROGRESS
    ========================================= */

    async function loadProgress() {

      if (!currentStudent) return;

      const { data, error } =
        await supabaseClient
          .from("lesson_progress")
          .select("*")
          .eq("student_id", currentStudent.id);

      if (error) {
        console.error("Progress error:", error);
        currentProgress = [];
        return;
      }

      currentProgress = data || [];
    }


    /* =========================================
       GET PROGRESS
    ========================================= */

    function getProgress(lessonId) {

      return currentProgress.find(
        p => Number(p.lesson_id) === Number(lessonId)
      ) || null;
    }


    /* =========================================
       CHECK COMPLETED
    ========================================= */

    function isLessonCompleted(lessonId) {

      const progress = getProgress(lessonId);

      return !!(
        progress &&
        progress.completed_at
      );
    }


    /* =========================================
       CHECK LESSON UNLOCK
    ========================================= */

    function isLessonUnlocked(lesson, courseLessons) {

      const index =
        courseLessons.findIndex(
          item => Number(item.id) === Number(lesson.id)
        );

      /*
        First lesson is always unlocked.
      */
      if (index <= 0) {
        return true;
      }

      const previousLesson =
        courseLessons[index - 1];

      return isLessonCompleted(previousLesson.id);
    }


    /* =========================================
       LOAD COURSES / LESSONS
    ========================================= */

    async function loadCourses() {

      const { data, error } =
        await supabaseClient
          .from("lessons")
          .select("*")
          .order("id", { ascending: true });

      if (error) {
        console.error("Lessons error:", error);

        document.getElementById("lessonsList").innerHTML =
          "<p>Unable to load lessons.</p>";

        return;
      }

      lessons = data || [];

      await renderCourses();
    }


    /* =========================================
       RENDER LESSON LIST
       IMPORTANT:
       NO VIDEO IS CREATED HERE.
    ========================================= */

    async function renderCourses() {

      const container =
        document.getElementById("lessonsList");

      container.innerHTML = "";

      if (!currentStudent) return;

      const access =
        currentStudent.course_access || [];

      /*
        Get unique courses from lessons.
      */
      const courses =
        [...new Set(
          lessons.map(
            lesson => lesson.course
          )
        )];

      if (!courses.length) {
        container.innerHTML =
          "<p>No lessons available.</p>";
        return;
      }

      courses.forEach(course => {

        const courseLessons =
          lessons
            .filter(
              lesson =>
                lesson.course === course
            )
            .sort(
              (a, b) =>
                Number(a.id) - Number(b.id)
            );

        const courseDiv =
          document.createElement("div");

        courseDiv.className = "course";

        const courseTitle =
          document.createElement("div");

        courseTitle.className =
          "course-title";

        courseTitle.textContent =
          "📘 " + course;

        courseDiv.appendChild(courseTitle);

        const lessonsDiv =
          document.createElement("div");

        lessonsDiv.className = "lessons";

        /*
          If student does not have access,
          show course as locked.
        */
        const hasAccess =
          access.includes(course);

        if (!hasAccess) {

          const lockedCourse =
            document.createElement("div");

          lockedCourse.className =
            "lesson lesson-locked";

          lockedCourse.innerHTML = `
            <div class="lesson-title">
              🔒 Course Locked
            </div>

            <div class="locked-message">
              You do not currently have access to this course.
            </div>
          `;

          lessonsDiv.appendChild(
            lockedCourse
          );

        } else {

          courseLessons.forEach(
            (lesson, index) => {

              const lessonElement =
                createLessonElement(
                  lesson,
                  courseLessons,
                  index
                );

              lessonsDiv.appendChild(
                lessonElement
              );

            }
          );
        }

        courseDiv.appendChild(
          lessonsDiv
        );

        container.appendChild(
          courseDiv
        );
      });
    }


    /* =========================================
       CREATE LESSON LIST ITEM
       NO VIDEO HERE
    ========================================= */

    function createLessonElement(
      lesson,
      courseLessons,
      index
    ) {

      const unlocked =
        isLessonUnlocked(
          lesson,
          courseLessons
        );

      const completed =
        isLessonCompleted(
          lesson.id
        );

      const progress =
        getProgress(
          lesson.id
        );

      const div =
        document.createElement("div");

      div.className =
        "lesson " +
        (unlocked
          ? "lesson-unlocked"
          : "lesson-locked");


      /* LESSON NUMBER */

      const number =
        document.createElement("div");

      number.className =
        "lesson-number";

      number.textContent =
        "Lesson " +
        String(index + 1).padStart(2, "0");


      /* TITLE */

      const title =
        document.createElement("div");

      title.className =
        "lesson-title";

      title.textContent =
        lesson.title;


      /* DESCRIPTION */

      const description =
        document.createElement("div");

      description.className =
        "lesson-description";

      description.textContent =
        lesson.description || "";


      /* STATUS */

      const status =
        document.createElement("span");

      status.className =
        "lesson-status";


      if (!unlocked) {

        status.classList.add(
          "status-locked"
        );

        status.textContent =
          "🔒 Locked";

      } else if (completed) {

        status.classList.add(
          "status-completed"
        );

        status.textContent =
          "✅ Completed";

      } else if (
        progress &&
        progress.watch_seconds > 0
      ) {

        status.classList.add(
          "status-watching"
        );

        status.textContent =
          "👀 Continue Lesson";

      } else {

        status.classList.add(
          "status-unlocked"
        );

        status.textContent =
          "▶️ Ready to Watch";
      }


      div.appendChild(number);
      div.appendChild(title);
      div.appendChild(description);
      div.appendChild(status);


      /* LOCKED MESSAGE */

      if (!unlocked) {

        const lockedMessage =
          document.createElement("div");

        lockedMessage.className =
          "locked-message";

        lockedMessage.textContent =
          index > 0
            ? "🔒 Complete the previous lesson to unlock this lesson."
            : "🔒 This lesson is locked.";

        div.appendChild(
          lockedMessage
        );

      } else {

        const hint =
          document.createElement("div");

        hint.className =
          "click-hint";

        hint.textContent =
          "▶️ Click to open this lesson";

        div.appendChild(
          hint
        );


        /*
          IMPORTANT:
          Clicking lesson opens viewer.
        */
        div.addEventListener(
          "click",
          () => {
            openLesson(
              lesson,
              courseLessons,
              index
            );
          }
        );
      }


      return div;
    }


    /* =========================================
       OPEN LESSON
    ========================================= */

    async function openLesson(
      lesson,
      courseLessons,
      index
    ) {

      /*
        Save current lesson before switching.
      */
      await saveCurrentViewerProgress();


      /*
        Clean old viewer.
      */
      cleanupLessonViewer();


      currentViewerLessonId =
        Number(lesson.id);


      /*
        Hide lesson list.
      */
      document.getElementById(
        "lessonsSection"
      ).style.display = "none";


      /*
        Show viewer.
      */
      const viewer =
        document.getElementById(
          "lessonViewer"
        );

      viewer.style.display =
        "block";


      const content =
        document.getElementById(
          "lessonViewerContent"
        );

      content.innerHTML = "";


      /* HEADER */

      const header =
        document.createElement("div");

      header.className =
        "viewer-header";


      const title =
        document.createElement("h2");

      title.textContent =
        lesson.title;


      const course =
        document.createElement("div");

      course.className =
        "viewer-course";

      course.textContent =
        "📘 " + lesson.course;


      const description =
        document.createElement("div");

      description.className =
        "viewer-description";

      description.textContent =
        lesson.description || "";


      const progress =
        getProgress(
          lesson.id
        );


      const status =
        document.createElement("span");

      status.className =
        "lesson-status";


      if (isLessonCompleted(lesson.id)) {

        status.classList.add(
          "status-completed"
        );

        status.textContent =
          "✅ Completed";

      } else if (
        progress &&
        progress.watch_seconds > 0
      ) {

        status.classList.add(
          "status-watching"
        );

        status.textContent =
          "👀 Watching";

      } else {

        status.classList.add(
          "status-unlocked"
        );

        status.textContent =
          "▶️ Ready to Watch";
      }


      header.appendChild(title);
      header.appendChild(course);
      header.appendChild(description);

      content.appendChild(header);
      content.appendChild(status);


      /* VIDEO AREA */

      const videoContainer =
        document.createElement("div");

      videoContainer.className =
        "video-container";


      const video =
        document.createElement("video");

      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";


      /*
        Prevent normal downloading option.
      */
      video.setAttribute(
        "controlsList",
        "nodownload"
      );


      /* WATERMARK */

      const watermark =
        document.createElement("div");

      watermark.className =
        "watermark";

      watermark.textContent =
        currentStudent.username;


      /* FULLSCREEN */

      const fullscreenButton =
        document.createElement("button");

      fullscreenButton.className =
        "fullscreen-btn";

      fullscreenButton.type =
        "button";

      fullscreenButton.textContent =
        "⛶ Fullscreen";


      fullscreenButton.addEventListener(
        "click",
        async () => {

          if (
            video.requestFullscreen
          ) {
            try {
              await video.requestFullscreen();
            } catch (error) {
              console.error(
                "Fullscreen error:",
                error
              );
            }
          }
        }
      );


      videoContainer.appendChild(
        video
      );

      videoContainer.appendChild(
        watermark
      );

      videoContainer.appendChild(
        fullscreenButton
      );


      content.appendChild(
        videoContainer
      );


      /* ACTION BUTTONS */

      const actions =
        document.createElement("div");

      actions.className =
        "lesson-actions";


      const completeButton =
        document.createElement("button");

      completeButton.type =
        "button";

      completeButton.className =
        "action-btn complete-btn";

      completeButton.textContent =
        isLessonCompleted(lesson.id)
          ? "✅ Lesson Completed"
          : "✅ Lesson Complete";


      if (
        isLessonCompleted(lesson.id)
      ) {
        completeButton.disabled =
          true;

        completeButton.style.opacity =
          "0.6";

        completeButton.style.cursor =
          "not-allowed";
      }


      completeButton.addEventListener(
        "click",
        async () => {

          await completeLesson(
            lesson
          );
        }
      );


      actions.appendChild(
        completeButton
      );


      /* PDF */

      if (lesson.pdf_path) {

        const pdfButton =
          document.createElement("button");

        pdfButton.type =
          "button";

        pdfButton.className =
          "action-btn pdf-btn";

        pdfButton.textContent =
          "📄 Open / Download PDF";


        pdfButton.addEventListener(
          "click",
          () => {
            downloadPdf(
              lesson.pdf_path,
              lesson.title
            );
          }
        );


        actions.appendChild(
          pdfButton
        );
      }


      content.appendChild(
        actions
      );


      /* COMPLETED MESSAGE */

      if (
        isLessonCompleted(lesson.id)
      ) {

        const completedMessage =
          document.createElement("div");

        completedMessage.className =
          "completed-message";

        completedMessage.textContent =
          "🎉 You have completed this lesson.";

        content.appendChild(
          completedMessage
        );
      }


      /*
        Load secure private video.
      */
      await loadSecureVideo(
        video,
        lesson
      );


      /*
        Start background watch tracking.
      */
      setupVideoTracking(
        video,
        lesson
      );


      /*
        Start moving watermark.
      */
      startWatermarkMovement(
        watermark,
        videoContainer
      );


      /*
        Scroll viewer to top.
      */
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* =========================================
       LOAD SECURE VIDEO
    ========================================= */

    async function loadSecureVideo(
      video,
      lesson
    ) {

      if (!lesson.video_path) {

        videoContainerMessage(
          video,
          "🎬 No video available for this lesson."
        );

        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from("Video")
            .createSignedUrl(
              lesson.video_path,
              60 * 60
            );


        if (error) {
          throw error;
        }


        if (!data || !data.signedUrl) {
          throw new Error(
            "Signed URL not generated."
          );
        }


        video.src =
          data.signedUrl;


        video.load();

      } catch (error) {

        console.error(
          "Secure video error:",
          error
        );

        videoContainerMessage(
          video,
          "❌ Unable to load video."
        );
      }
    }


    /* =========================================
       VIDEO ERROR MESSAGE
    ========================================= */

    function videoContainerMessage(
      video,
      message
    ) {

      const container =
        video.parentElement;

      if (!container) return;

      const msg =
        document.createElement("div");

      msg.style.color =
        "white";

      msg.style.padding =
        "30px";

      msg.style.textAlign =
        "center";

      msg.textContent =
        message;

      container.appendChild(
        msg
      );
    }


    /* =========================================
       PDF DOWNLOAD
    ========================================= */

    async function downloadPdf(
      pdfPath,
      title
    ) {

      if (!pdfPath) {
        alert("PDF not available.");
        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from("Video")
            .createSignedUrl(
              pdfPath,
              60 * 60
            );


        if (error) {
          throw error;
        }


        if (!data || !data.signedUrl) {
          throw new Error(
            "PDF URL not generated."
          );
        }


        window.open(
          data.signedUrl,
          "_blank"
        );

      } catch (error) {

        console.error(
          "PDF error:",
          error
        );

        alert(
          "Unable to open PDF."
        );
      }
    }


    /* =========================================
       WATERMARK MOVEMENT
    ========================================= */

    function startWatermarkMovement(
      watermark,
      container
    ) {

      /*
        Clear previous interval.
      */
      if (currentWatermarkInterval) {

        clearInterval(
          currentWatermarkInterval
        );

        currentWatermarkInterval =
          null;
      }


      let x = 18;
      let y = 18;

      let dx = 1;
      let dy = 1;


      currentWatermarkInterval =
        setInterval(
          () => {

            if (
              !document.body.contains(
                watermark
              )
            ) {

              clearInterval(
                currentWatermarkInterval
              );

              currentWatermarkInterval =
                null;

              return;
            }


            const maxX =
              Math.max(
                20,
                container.clientWidth -
                watermark.offsetWidth -
                20
              );


            const maxY =
              Math.max(
                20,
                container.clientHeight -
                watermark.offsetHeight -
                20
              );


            x += dx;
            y += dy;


            if (
              x <= 10 ||
              x >= maxX
            ) {
              dx *= -1;
            }


            if (
              y <= 10 ||
              y >= maxY
            ) {
              dy *= -1;
            }


            watermark.style.left =
              x + "px";

            watermark.style.top =
              y + "px";

          },
          100
        );
    }


    /* =========================================
       SETUP VIDEO TRACKING
       WATCH TIME IS HIDDEN FROM STUDENT.
       IT IS STILL SAVED TO DATABASE.
    ========================================= */

    function setupVideoTracking(
      video,
      lesson
    ) {

      const lessonId =
        Number(lesson.id);


      const tracker = {

        lessonId,

        videoDuration: 0,

        firstOpened:
          new Date().toISOString(),

        lastTick: null,

        watchSeconds:
          Number(
            getProgress(
              lessonId
            )?.watch_seconds || 0
          ),

        saving: false,

        completed:
          isLessonCompleted(
            lessonId
          ),

        lastSaveSeconds:
          Number(
            getProgress(
              lessonId
            )?.watch_seconds || 0
          )
      };


      /*
        Remove old tracker for same lesson.
      */
      activeTrackers.set(
        lessonId,
        tracker
      );


      video.addEventListener(
        "loadedmetadata",
        () => {

          if (
            Number.isFinite(
              video.duration
            )
          ) {

            tracker.videoDuration =
              video.duration;

          }
        }
      );


      video.addEventListener(
        "play",
        async () => {

          tracker.lastTick =
            Date.now();


          if (
            !tracker.started
          ) {

            tracker.started =
              true;

            await startLessonProgress(
              tracker
            );
          }
        }
      );


      video.addEventListener(
        "timeupdate",
        async () => {

          if (
            tracker.lastTick === null
          ) {

            tracker.lastTick =
              Date.now();

            return;
          }


          const now =
            Date.now();


          const difference =
            (now -
              tracker.lastTick) /
            1000;


          /*
            Only count reasonable
            real playback intervals.
          */
          if (
            difference > 0 &&
            difference <= 5
          ) {

            tracker.watchSeconds +=
              difference;
          }


          tracker.lastTick =
            now;


          /*
            Save approximately
            every 10 seconds.
          */
          if (
            tracker.watchSeconds -
            tracker.lastSaveSeconds >=
            10
          ) {

            tracker.lastSaveSeconds =
              tracker.watchSeconds;

            await saveLessonProgress(
              tracker
            );
          }
        }
      );


      video.addEventListener(
        "pause",
        async () => {

          tracker.lastTick =
            null;

          await saveLessonProgress(
            tracker
          );
        }
      );


      video.addEventListener(
        "ended",
        async () => {

          tracker.completed =
            true;

          await completeLesson(
            lesson
          );
        }
      );


      document.addEventListener(
        "visibilitychange",
        async () => {

          if (
            document.hidden &&
            activeTrackers.get(
              lessonId
            ) === tracker
          ) {

            await saveLessonProgress(
              tracker
            );
          }
        }
      );
    }


    /* =========================================
       START LESSON PROGRESS
    ========================================= */

    async function startLessonProgress(
      tracker
    ) {

      if (!currentStudent) return;


      try {

        const existing =
          getProgress(
            tracker.lessonId
          );


        const firstOpened =
          existing?.first_opened_at ||
          tracker.firstOpened;


        const { data, error } =
          await supabaseClient
            .from("lesson_progress")
            .upsert(
              {
                student_id:
                  currentStudent.id,

                lesson_id:
                  tracker.lessonId,

                first_opened_at:
                  firstOpened,

                last_watched_at:
                  new Date().toISOString(),

                watch_seconds:
                  Math.floor(
                    tracker.watchSeconds
                  ),

                video_duration_seconds:
                  tracker.videoDuration
                    ? Math.floor(
                        tracker.videoDuration
                      )
                    : null,

                completed_at:
                  existing?.completed_at ||
                  null,

                updated_at:
                  new Date().toISOString()
              },
              {
                onConflict:
                  "student_id,lesson_id"
              }
            )
            .select()
            .single();


        if (error) {
          throw error;
        }


        /*
          Update local progress.
        */
        const existingIndex =
          currentProgress.findIndex(
            p =>
              Number(p.lesson_id) ===
              Number(tracker.lessonId)
          );


        if (existingIndex >= 0) {

          currentProgress[
            existingIndex
          ] = data;

        } else {

          currentProgress.push(
            data
          );
        }

      } catch (error) {

        console.error(
          "Start progress error:",
          error
        );
      }
    }


    /* =========================================
       SAVE LESSON PROGRESS
    ========================================= */

    async function saveLessonProgress(
      tracker
    ) {

      if (
        !currentStudent ||
        !tracker ||
        tracker.saving
      ) {
        return;
      }


      tracker.saving =
        true;


      try {

        const existing =
          getProgress(
            tracker.lessonId
          );


        const firstOpened =
          existing?.first_opened_at ||
          tracker.firstOpened;


        const { data, error } =
          await supabaseClient
            .from("lesson_progress")
            .upsert(
              {
                student_id:
                  currentStudent.id,

                lesson_id:
                  tracker.lessonId,

                first_opened_at:
                  firstOpened,

                last_watched_at:
                  new Date().toISOString(),

                watch_seconds:
                  Math.floor(
                    tracker.watchSeconds
                  ),

                video_duration_seconds:
                  tracker.videoDuration
                    ? Math.floor(
                        tracker.videoDuration
                      )
                    : existing?.video_duration_seconds ||
                      null,

                completed_at:
                  tracker.completed
                    ? (
                        existing?.completed_at ||
                        new Date().toISOString()
                      )
                    : (
                        existing?.completed_at ||
                        null
                      ),

                updated_at:
                  new Date().toISOString()
              },
              {
                onConflict:
                  "student_id,lesson_id"
              }
            )
            .select()
            .single();


        if (error) {
          throw error;
        }


        const existingIndex =
          currentProgress.findIndex(
            p =>
              Number(p.lesson_id) ===
              Number(tracker.lessonId)
          );


        if (existingIndex >= 0) {

          currentProgress[
            existingIndex
          ] = data;

        } else {

          currentProgress.push(
            data
          );
        }


        tracker.lastSaveSeconds =
          tracker.watchSeconds;

      } catch (error) {

        console.error(
          "Save progress error:",
          error
        );

      } finally {

        tracker.saving =
          false;
      }
    }


    /* =========================================
       COMPLETE LESSON
    ========================================= */

    async function completeLesson(
      lesson
    ) {

      if (!currentStudent) return;


      const lessonId =
        Number(lesson.id);


      const tracker =
        activeTrackers.get(
          lessonId
        );


      const existing =
        getProgress(
          lessonId
        );


      try {

        const { data, error } =
          await supabaseClient
            .from("lesson_progress")
            .upsert(
              {
                student_id:
                  currentStudent.id,

                lesson_id:
                  lessonId,

                first_opened_at:
                  existing?.first_opened_at ||
                  tracker?.firstOpened ||
                  new Date().toISOString(),

                last_watched_at:
                  new Date().toISOString(),

                watch_seconds:
                  Math.floor(
                    tracker?.watchSeconds ||
                    existing?.watch_seconds ||
                    0
                  ),

                video_duration_seconds:
                  Math.floor(
                    tracker?.videoDuration ||
                    existing?.video_duration_seconds ||
                    0
                  ) || null,

                completed_at:
                  existing?.completed_at ||
                  new Date().toISOString(),

                updated_at:
                  new Date().toISOString()
              },
              {
                onConflict:
                  "student_id,lesson_id"
              }
            )
            .select()
            .single();


        if (error) {
          throw error;
        }


        /*
          Update local progress.
        */
        const existingIndex =
          currentProgress.findIndex(
            p =>
              Number(p.lesson_id) ===
              lessonId
          );


        if (existingIndex >= 0) {

          currentProgress[
            existingIndex
          ] = data;

        } else {

          currentProgress.push(
            data
          );
        }


        if (tracker) {
          tracker.completed =
            true;
        }


        /*
          Stop tracking completed lesson.
        */
        activeTrackers.delete(
          lessonId
        );


        /*
          Refresh lesson list so the
          next lesson becomes unlocked.
        */
        await renderCourses();


        /*
          Show completed message in viewer.
        */
        const content =
          document.getElementById(
            "lessonViewerContent"
          );


        if (content) {

          const oldMessage =
            content.querySelector(
              ".completed-message"
            );


          if (!oldMessage) {

            const message =
              document.createElement("div");

            message.className =
              "completed-message";

            message.textContent =
              "🎉 You have completed this lesson.";

            content.appendChild(
              message
            );
          }


          const button =
            content.querySelector(
              ".complete-btn"
            );


          if (button) {

            button.textContent =
              "✅ Lesson Completed";

            button.disabled =
              true;

            button.style.opacity =
              "0.6";

            button.style.cursor =
              "not-allowed";
          }
        }

      } catch (error) {

        console.error(
          "Complete lesson error:",
          error
        );

        alert(
          "Unable to mark lesson as completed."
        );
      }
    }


    /* =========================================
       SAVE CURRENT VIEWER PROGRESS
    ========================================= */

    async function saveCurrentViewerProgress() {

      if (
        currentViewerLessonId === null
      ) {
        return;
      }


      const tracker =
        activeTrackers.get(
          currentViewerLessonId
        );


      if (tracker) {

        await saveLessonProgress(
          tracker
        );
      }
    }


    /* =========================================
       CLEANUP VIEWER
    ========================================= */

    function cleanupLessonViewer() {

      /*
        Clear watermark timer.
      */
      if (currentWatermarkInterval) {

        clearInterval(
          currentWatermarkInterval
        );

        currentWatermarkInterval =
          null;
      }


      /*
        Stop current video.
      */
      const viewer =
        document.getElementById(
          "lessonViewer"
        );


      const video =
        viewer?.querySelector(
          "video"
        );


      if (video) {

        try {
          video.pause();
        } catch (error) {}

        video.removeAttribute(
          "src"
        );

        video.load();
      }


      /*
        Remove old tracker.
      */
      if (
        currentViewerLessonId !== null
      ) {

        activeTrackers.delete(
          currentViewerLessonId
        );
      }


      currentViewerLessonId =
        null;
    }


    /* =========================================
       BACK TO LESSONS
    ========================================= */

    document
      .getElementById(
        "backToLessons"
      )
      .addEventListener(
        "click",
        async () => {

          await saveCurrentViewerProgress();

          cleanupLessonViewer();


          document.getElementById(
            "lessonViewer"
          ).style.display =
            "none";


          document.getElementById(
            "lessonsSection"
          ).style.display =
            "block";


          /*
            Refresh statuses/unlocks.
          */
          await loadProgress();
          await renderCourses();


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        }
      );


    /* =========================================
       CHANGE PASSWORD
    ========================================= */

    document
      .getElementById(
        "passwordToggle"
      )
      .addEventListener(
        "click",
        () => {

          const form =
            document.getElementById(
              "passwordForm"
            );

          if (
            form.style.display ===
            "block"
          ) {

            form.style.display =
              "none";

          } else {

            form.style.display =
              "block";
          }
        }
      );


    document
      .getElementById(
        "savePassword"
      )
      .addEventListener(
        "click",
        async () => {

          const oldPassword =
            document.getElementById(
              "oldPassword"
            ).value;

          const newPassword =
            document.getElementById(
              "newPassword"
            ).value;

          const confirmPassword =
            document.getElementById(
              "confirmPassword"
            ).value;

          const message =
            document.getElementById(
              "passwordMessage"
            );


          message.textContent = "";


          if (
            !oldPassword ||
            !newPassword ||
            !confirmPassword
          ) {

            message.textContent =
              "Please fill all fields.";

            message.style.color =
              "#dc2626";

            return;
          }


          if (
            newPassword !==
            confirmPassword
          ) {

            message.textContent =
              "New passwords do not match.";

            message.style.color =
              "#dc2626";

            return;
          }


          if (
            oldPassword !==
            currentStudent.password
          ) {

            message.textContent =
              "Current password is incorrect.";

            message.style.color =
              "#dc2626";

            return;
          }


          const { error } =
            await supabaseClient
              .from("student_accounts")
              .update({
                password:
                  newPassword
              })
              .eq(
                "id",
                currentStudent.id
              );


          if (error) {

            console.error(
              "Password update error:",
              error
            );

            message.textContent =
              "Unable to change password.";

            message.style.color =
              "#dc2626";

            return;
          }


          currentStudent.password =
            newPassword;


          message.textContent =
            "✅ Password changed successfully.";

          message.style.color =
            "#16a34a";


          document.getElementById(
            "oldPassword"
          ).value = "";

          document.getElementById(
            "newPassword"
          ).value = "";

          document.getElementById(
            "confirmPassword"
          ).value = "";
        }
      );


    /* =========================================
       LOGOUT
    ========================================= */

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        async () => {

          await saveCurrentViewerProgress();

          cleanupLessonViewer();

          localStorage.removeItem(
            "studentUsername"
          );

          window.location.href =
            "login.html";
        }
      );


    /* =========================================
       BEFORE UNLOAD
       SAVE WATCH TIME
    ========================================= */

    window.addEventListener(
      "beforeunload",
      () => {

        /*
          Fire-and-forget save.
          Normal navigation may cancel async requests,
          but regular pause/visibility events also save.
        */

        activeTrackers.forEach(
          tracker => {

            saveLessonProgress(
              tracker
            );
          }
        );
      }
    );


    /* =========================================
       START
    ========================================= */

    (async function () {

      try {

        await loadStudent();

      } catch (error) {

        console.error(
          "Dashboard startup error:",
          error
        );

        alert(
          "Unable to load Student Dashboard."
        );
      }

    })();

  </script>
